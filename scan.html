<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สแกน QR Code บัตรสมาชิก</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 1. ดึง Html5-QRCode Library เข้ามาใช้งาน -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        * { font-family: 'Prompt', sans-serif; }
        /* ซ่อนการแสดงผลโลโก้และปุ่มส่วนเกินของ Library เพื่อความสวยงาม */
        #qr-reader img { display: none; }
        #qr-reader { border: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Modal Box -->
    <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl relative border border-gray-100">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-4 pb-2 border-b">
            <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                📷 สแกน QR Code บัตรสมาชิก
            </h2>
            <button onclick="closeScanner()" class="text-gray-400 hover:text-gray-600 text-xl font-bold p-1">
                ×
            </button>
        </div>

        <!-- กล่องแสดงผลกล้อง / ตัวสแกน -->
        <div id="qr-reader" class="w-full rounded-2xl overflow-hidden bg-black min-h-[250px] flex items-center justify-center relative">
        </div>

        <!-- ปุ่มสำหรับอัปโหลดไฟล์รูปภาพแทนการเปิดกล้อง -->
        <div class="mt-4 text-center">
            <input type="file" id="qr-input-file" accept="image/*" class="hidden" onchange="scanImageFile(this)">
            <button onclick="document.getElementById('qr-input-file').click()" class="w-full py-2.5 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-xl text-sm transition flex items-center justify-center gap-2">
                🖼️ เลือกไฟล์รูปภาพ QR Code (Scan Image File)
            </button>
        </div>

        <p class="text-center text-xs text-gray-500 mt-3">
            ส่องกล้องไปที่ QR Code บนบัตรสมาชิกเพื่อบันทึกข้อมูลด่วน
        </p>

        <!-- Footer / ปุ่มปิด -->
        <div class="mt-5 pt-3 border-t">
            <button onclick="closeScanner()" class="w-full py-3 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-2xl text-sm transition">
                ปิดกล้อง
            </button>
        </div>

    </div>

    <script>
        let html5QrcodeScanner = null;

        // ฟังก์ชันเริ่มต้นเปิดกล้อง
        function startScanner() {
            html5QrcodeScanner = new Html5Qrcode("qr-reader");

            const config = { 
                fps: 10, 
                qrbox: { width: 220, height: 220 } 
            };

            // เรียกขอสิทธิ์เปิดกล้อง (ใช้กล้องหลัง environment เป็นหลัก)
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess, 
                onScanFailure
            ).catch(err => {
                console.error("ไม่สามารถเปิดกล้องได้:", err);
                document.getElementById("qr-reader").innerHTML = `
                    <div class="text-center p-4 text-white">
                        <p class="text-red-400 font-bold mb-1">⚠️ ไม่สามารถขอสิทธิ์เปิดกล้องได้</p>
                        <p class="text-xs text-gray-300">กรุณากดอนุญาตให้ใช้งานกล้อง (Allow Camera) หรือใช้วิธีอัปโหลดไฟล์รูปแทน</p>
                    </div>
                `;
            });
        }

        // เมื่อสแกนสำเร็จ
        function onScanSuccess(decodedText, decodedResult) {
            // หยุดการสแกนเมื่อได้ข้อมูลแล้ว
            stopScanner();

            alert("สแกนสำเร็จ! ข้อมูลบัตรสมาชิก: " + decodedText);
            
            // TODO: นำข้อมูล decodedText ไปใช้งานต่อ เช่น ค้นหารายชื่อสมาชิก หรือส่งเข้า Form
            // document.getElementById('username').value = decodedText;
        }

        // ทำงานเมื่อกล้องกำลังสแกนหาข้อความ (ปล่อยว่างไว้ได้)
        function onScanFailure(error) {
            // console.warn(`Code scan error = ${error}`);
        }

        // สแกนจากไฟล์รูปภาพ
        function scanImageFile(input) {
            if (input.files == null || input.files.length === 0) return;

            const imageFile = input.files[0];
            const html5QrCode = new Html5Qrcode("qr-reader");

            html5QrCode.scanFile(imageFile, true)
                .then(decodedText => {
                    onScanSuccess(decodedText, null);
                })
                .catch(err => {
                    alert("ไม่พบ QR Code ในรูปภาพนี้ กรุณาลองใหม่อีกครั้ง");
                });
        }

        // ปิดกล้องและหยุดการทำงาน
        function stopScanner() {
            if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                }).catch(err => console.error("Error stopping scanner", err));
            }
        }

        function closeScanner() {
            stopScanner();
            // ถ้าอยู่ใน Modal สามารถเขียนคำสั่งซ่อน Modal เพิ่มเติมตรงนี้ได้ครับ
            alert("ปิดหน้าจอระบบสแกนเรียบร้อย");
        }

        // เปิดสแกนเนอร์อัตโนมัติเมื่อโหลดหน้าเว็บสำเร็จ
        window.addEventListener('DOMContentLoaded', () => {
            startScanner();
        });
    </script>
</body>
</html>
