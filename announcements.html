<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประกาศ — กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="members.css">
<link rel="stylesheet" href="announcements.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="fa-solid fa-wheat-awn"></i></div>
      <div class="logo-text"><strong>กลุ่มข้าวสาร</strong><span>บ้านร่องเข็ม หมู่ที่ 6</span></div>
    </div>
    <nav class="sidebar-menu">
      <a href="index.html" class="menu-item"><i class="fa-solid fa-house"></i><span>หน้าหลัก</span></a>
      <a href="current-funeral.html" class="menu-item"><i class="fa-solid fa-hand-holding-heart"></i><span>งานศพปัจจุบัน</span></a>
      <a href="members.html" class="menu-item"><i class="fa-solid fa-users"></i><span>สมาชิก</span></a>
      <a href="rice-record.html" class="menu-item"><i class="fa-solid fa-bowl-rice"></i><span>บันทึกรับข้าว</span></a>
      <a href="history.html" class="menu-item"><i class="fa-solid fa-calendar-days"></i><span>งานศพย้อนหลัง</span></a>
      <a href="announcements.html" class="menu-item active"><i class="fa-solid fa-bullhorn"></i><span>ประกาศ</span></a>
      <a href="reports.html" class="menu-item"><i class="fa-solid fa-chart-column"></i><span>รายงาน</span></a>
      <a href="settings.html" class="menu-item"><i class="fa-solid fa-gear"></i><span>ตั้งค่า</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-box">
        <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
        <div class="user-info"></div>
      </div>
      <button class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="logo-icon small"><i class="fa-solid fa-bullhorn"></i></div>
        <div><h1>ประกาศ / ข่าวสาร</h1><p>แจ้งข่าวสารถึงสมาชิกกลุ่มข้าวสาร</p></div>
      </div>
      <div class="topbar-right">
        <div class="clock-box"><i class="fa-regular fa-clock"></i>
          <div><div id="liveClock" class="clock-time">00:00:00</div>
               <div id="liveDate" class="clock-date">-</div></div></div>
        <button class="action-btn abtn-red admin-only" id="btnNew">
          <i class="fa-solid fa-plus"></i> เพิ่มประกาศ</button>
      </div>
    </header>

    <section class="card">
      <div class="toolbar">
        <div class="search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="searchInput" placeholder="ค้นหาหัวข้อ / รายละเอียด">
        </div>
        <select id="filterType">
          <option value="all">ทุกประเภท</option>
          <option value="general">ทั่วไป</option>
          <option value="meeting">ประชุม</option>
          <option value="fee">เงินสมทบ</option>
          <option value="urgent">ด่วน</option>
        </select>
        <select id="filterPin">
          <option value="all">ทั้งหมด</option>
          <option value="pin">ปักหมุดเท่านั้น</option>
        </select>
      </div>
      <div class="ann-list" id="annList"></div>
      <div class="table-foot"><span id="countText">แสดง 0 รายการ</span></div>
    </section>

    <footer class="footer">© 2025 กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</footer>
  </main>
</div>
<div id="toastContainer" class="toast-container"></div>
<script type="module" src="announcements.js"></script>
</body>
</html>
