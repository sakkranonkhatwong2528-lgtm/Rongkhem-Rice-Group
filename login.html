<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</title>

    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background: linear-gradient(135deg, #0f5132, #198754, #28a745); }
        .login-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="login-card w-full max-w-md rounded-3xl p-8 shadow-2xl border border-white/20 relative overflow-hidden">
        
        <!-- HEADER LOGO -->
        <div class="text-center mb-6">
            <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3 shadow-inner text-5xl">
                🌾
            </div>
            <h1 class="text-2xl font-bold text-gray-800">ระบบกลุ่มข้าวสาร</h1>
            <p class="text-sm font-medium text-green-700">บ้านร่องเข็ม หมู่ที่ 6</p>
            <p class="text-xs text-gray-500 mt-1">ต.จำป่าหวาย อ.เมือง จ.พะเยา</p>
        </div>

        <!-- FORM LOGIN -->
        <form onsubmit="handleLogin(event)" class="space-y-4">
            
            <!-- เลือกประเภทผู้ใช้งาน -->
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">ประเภทผู้ใช้งาน</label>
                <div class="grid grid-cols-2 gap-2 p-1 bg-gray-100 rounded-2xl border">
                    <button type="button" id="btnRoleMember" onclick="selectRole('member')" class="py-2.5 rounded-xl font-bold text-xs transition bg-green-600 text-white shadow">
                        👤 สมาชิก / กรรมการ
                    </button>
                    <button type="button" id="btnRoleAdmin" onclick="selectRole('admin')" class="py-2.5 rounded-xl font-bold text-xs transition text-gray-600 hover:bg-gray-200">
                        👑 ผู้ใหญ่บ้าน (Admin)
                    </button>
                </div>
            </div>

            <!-- ชนิดการเข้าใช้งาน -->
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" id="username" required placeholder="ป้อนชื่อผู้ใช้งาน..." class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 text-sm font-medium">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">รหัสผ่าน (Password)</label>
                <input type="password" id="password" required placeholder="ป้อนรหัสผ่าน..." class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 text-sm font-medium">
            </div>

            <!-- ข้อความแจ้งเตือนข้อผิดพลาด -->
            <div id="errorMsg" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 p-2.5 rounded-xl text-center font-bold">
                ⚠️ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!
            </div>

            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-3.5 rounded-2xl font-bold text-base shadow-lg transition flex items-center justify-center gap-2">
                🚀 เข้าสู่ระบบ
            </button>
        </form>

        <!-- FOOTER INFO -->
        <div class="mt-6 border-t pt-4 text-center">
            <p class="text-xs text-gray-500">📌 <strong>รหัสทดสอบระบบ:</strong></p>
            <p class="text-xs text-gray-400 mt-0.5">สมาชิก: <strong>member</strong> / <strong>1234</strong></p>
            <p class="text-xs text-gray-400">ผู้ใหญ่บ้าน: <strong>admin</strong> / <strong>admin1234</strong></p>
        </div>

    </div>

    <script>
        let selectedRole = 'member';

        function selectRole(role) {
            selectedRole = role;
            const btnMember = document.getElementById('btnRoleMember');
            const btnAdmin = document.getElementById('btnRoleAdmin');
            const usernameInput = document.getElementById('username');

            if (role === 'member') {
                btnMember.className = "py-2.5 rounded-xl font-bold text-xs transition bg-green-600 text-white shadow";
                btnAdmin.className = "py-2.5 rounded-xl font-bold text-xs transition text-gray-600 hover:bg-gray-200";
                usernameInput.value = 'member';
            } else {
                btnAdmin.className = "py-2.5 rounded-xl font-bold text-xs transition bg-amber-500 text-white shadow";
                btnMember.className = "py-2.5 rounded-xl font-bold text-xs transition text-gray-600 hover:bg-gray-200";
                usernameInput.value = 'admin';
            }
            document.getElementById('errorMsg').classList.add('hidden');
        }

        // ตั้งค่าเริ่มต้นใส่ username ให้อัตโนมัติเพื่อความสะดวก
        document.getElementById('username').value = 'member';

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            // ตรวจสอบสิทธิ์ผู้ใหญ่บ้าน (Admin)
            if (selectedRole === 'admin' || user === 'admin') {
                if ((user === 'admin' && pass === 'admin1234') || pass === '1234') {
                    localStorage.setItem('Rongkhem_User_Role', 'admin');
                    localStorage.setItem('Rongkhem_User_Name', 'นายศักรนนทน์ ขัติย์วงศ์ (ผู้ใหญ่บ้าน)');
                    location.href = 'index.html';
                    return;
                }
            }

            // ตรวจสอบสิทธิ์สมาชิก (Member)
            if (selectedRole === 'member' || user === 'member') {
                if (pass === '1234') {
                    localStorage.setItem('Rongkhem_User_Role', 'member');
                    localStorage.setItem('Rongkhem_User_Name', 'สมาชิกกลุ่มข้าวสาร');
                    location.href = 'index.html';
                    return;
                }
            }

            // หากใส่รหัสผิด
            errorMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
