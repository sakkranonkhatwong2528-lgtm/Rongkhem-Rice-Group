<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo"><i class="fa-solid fa-wheat-awn"></i></div>
    <h1>กลุ่มข้าวสาร</h1>
    <p class="login-sub">บ้านร่องเข็ม หมู่ที่ 6 ต.จำป่าหวาย อ.เมืองพะเยา</p>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label>อีเมล</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>รหัสผ่าน</label>
        <div class="pw-wrap">
          <input type="password" id="password" required placeholder="••••••••">
          <button type="button" id="togglePw"><i class="fa-regular fa-eye"></i></button>
        </div>
      </div>
      <label class="remember"><input type="checkbox" id="remember" checked> จดจำการเข้าสู่ระบบ</label>
      <div id="loginError" class="login-error"></div>
      <button type="submit" class="btn-login" id="btnLogin">
        <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
      </button>
      <button type="button" class="btn-forgot" id="btnForgot">ลืมรหัสผ่าน?</button>
    </form>
  </div>
  <div id="toastContainer" class="toast-container"></div>
  <script type="module" src="login.js"></script>
</body>
</html>
