<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 เข้าสู่ระบบ - กลุ่มข้าวสารบ้านร่องเข็ม</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; }
        body { background: #eef2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: white; width: 100%; max-width: 400px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
        .header-icon { font-size: 3rem; margin-bottom: 10px; }
        h2 { color: #1b5e20; margin-bottom: 5px; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; outline: none; }
        input:focus { border-color: #2e7d32; }
        .btn-login { width: 100%; padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-login:hover { background: #1b5e20; }
        .error-msg { color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; display: none; }
        .demo-info { margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; font-size: 0.8rem; color: #777; line-height: 1.5; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="header-icon">🌾</div>
    <h2>เข้าสู่ระบบ</h2>
    <p>กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6</p>

    <div id="errorMsg" class="error-msg"></div>

    <form onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="username">ชื่อผู้ใช้งาน (Username)</label>
            <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required>
        </div>

        <div class="form-group">
            <label for="password">รหัสผ่าน (Password)</label>
            <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
        </div>

        <button type="submit" class="btn-login">🔑 เข้าสู่ระบบ</button>
    </form>

    <div class="demo-info">
        💡 <strong>ผู้ใช้เริ่มต้นสำหรับทดสอบ:</strong><br>
        Username: <code>admin</code> | Password: <code>1234</code>
    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
