<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - กลุ่มข้าวสารบ้านร่องเข็ม</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-green-900 via-green-800 to-green-600 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl text-center">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-inner">
            🌾
        </div>
        <h1 class="text-2xl font-bold text-gray-800">เข้าสู่ระบบ</h1>
        <p class="text-gray-500 text-sm mb-6">กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6</p>

        <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="username" required placeholder="เช่น admin" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-600 focus:outline-none text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">รหัสผ่าน (Password)</label>
                <input type="password" id="password" required placeholder="กรอกรหัสผ่าน" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-600 focus:outline-none text-sm">
            </div>
            <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 rounded-xl shadow-lg transition mt-2">
                🔑 เข้าสู่ระบบ
            </button>
        </form>

        <div class="mt-6 border-t pt-4 text-xs text-gray-400">
            ระบบบริหารจัดการกลุ่มข้าวสาร V4.0<br>
            บ้านร่องเข็ม ต.จำป่าหวาย อ.เมือง จ.พะเยา
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            if ((u === 'admin' && p === '1234') || 
                (u === 'committee' && p === '1234') || 
                (u === 'user' && p === '1234')) {
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('currentUser', u);
                window.location.href = 'index.html';
            } else {
                alert('❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง (ทดสอบใช้: admin / 1234)');
            }
        }
    </script>
</body>
</html>
