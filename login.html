<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - กลุ่มข้าวสารบ้านร่องเข็ม</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; }
        body {
            background: linear-gradient(135deg, #1b5e20, #2e7d32, #4caf50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo { font-size: 4rem; margin-bottom: 10px; }
        h1 { font-size: 1.5rem; color: #1b5e20; margin-bottom: 5px; }
        p { font-size: 0.9rem; color: #666; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.9rem; font-weight: bold; color: #333; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        input:focus { border-color: #2e7d32; box-shadow: 0 0 0 3px rgba(46,125,50,0.15); }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-login:hover { background: #1b5e20; }
        #errorMsg {
            color: #d32f2f;
            background: #ffebee;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 15px;
            display: none;
        }
        .footer-text { margin-top: 25px; font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">🌾</div>
        <h1>เข้าสู่ระบบ</h1>
        <p>กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6</p>

        <div id="errorMsg"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="username" placeholder="เช่น admin" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน (Password)</label>
                <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">🔑 เข้าสู่ระบบ</button>
        </form>

        <div class="footer-text">
            ระบบบริหารจัดการกลุ่มข้าวสาร V4.0<br>
            บ้านร่องเข็ม ต.จำป่าหวาย อ.เมือง จ.พะเยา
        </div>
    </div>

    <!-- เชื่อมโยงระบบล็อกอิน -->
    <script src="js/auth.js"></script>
</body>
</html>
