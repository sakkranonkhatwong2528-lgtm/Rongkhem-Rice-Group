<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <meta

    <title>
        ทะเบียนสมาชิก - กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ 6

<body class="bg-amber-50 min-h-screen p-4 sm:p-6">

    <div class="max-w-5xl mx-auto space-y-6">


        <!-- HEADER -->

        <div
            class="
                flex
                flex-col
                sm:flex-row
                sm:items-center
                justify-between
                bg-white
                p-4
                sm:p-6
                rounded-xl
                shadow-sm
                border
                border-amber-200
                gap-4
            "
        >

            <div>

                <h1
                    class="
                        text-xl
                        sm:text-2xl
                        font-bold
                        text-gray-800
                        flex
                        items-center
                        gap-2
                    "
                >

                    👥 ทะเบียนสมาชิกกลุ่มข้าวสาร

                </h1>


                <p class="text-sm text-gray-500">

                    บ้านร่องเข็ม หมู่ที่ 6

                </p>

            </div>


            <div class="flex items-center gap-2">

                <button
                    onclick="resetAllStatus()"
                    class="
                        px-3
                        py-2
                        text-xs
                        sm:text-sm
                        bg-rose-100
                        hover:bg-rose-200
                        text-rose-700
                        font-medium
                        rounded-lg
                        transition
                        border
                        border-rose-200
                    "
                >

                    🔄 เริ่มรอบใหม่

                </button>


                <a
                    href="index.html"
                    class="
                        px-3
                        py-2
                        text-xs
                        sm:text-sm
                        bg-gray-100
                        hover:bg-gray-200
                        text-gray-700
                        font-medium
                        rounded-lg
                        transition
                    "
                >

                    ← กลับหน้าหลัก

                </a>

            </div>

        </div>



        <!-- SUMMARY -->

        <div
            class="
                grid
                grid-cols-1
                sm:grid-cols-3
                gap-4
            "
        >

            <div
                class="
                    bg-white
                    p-4
                    rounded-xl
                    border
                    border-amber-200
                    shadow-sm
                    flex
                    items-center
                    justify-between
                "
            >

                <div>

                    <p
                        class="
                            text-xs
                            text-gray-500
                            font-medium
                        "
                    >

                        👥 สมาชิกทั้งหมด

                    </p>


                    <p
                        id="totalCount"
                        class="
                            text-2xl
                            font-bold
                            text-gray-800
                        "
                    >

                        0 คน

                    </p>

                </div>

                <div
                    class="
                        w-10
                        h-10
                        bg-amber-100
                        rounded-full
                        flex
                        items-center
                        justify-center
                        text-amber-600
                    "
                >

                    👥

                </div>

            </div>



            <div
                class="
                    bg-white
                    p-4
                    rounded-xl
                    border
                    border-emerald-200
                    shadow-sm
                    flex
                    items-center
                    justify-between
                "
            >

                <div>

                    <p
                        class="
                            text-xs
                            text-emerald-600
                            font-medium
                        "
                    >

                        🟢 ส่งแล้ว

                    </p>


                    <p
                        id="sentCount"
                        class="
                            text-2xl
                            font-bold
                            text-emerald-600
                        "
                    >

                        0 คน

                    </p>

                </div>


                <div
                    class="
                        w-10
                        h-10
                        bg-emerald-100
                        rounded-full
                        flex
                        items-center
                        justify-center
                        text-emerald-600
                    "
                >

                    ✓

                </div>

            </div>



            <div
                class="
                    bg-white
                    p-4
                    rounded-xl
                    border
                    border-red-200
                    shadow-sm
                    flex
                    items-center
                    justify-between
                "
            >

                <div>

                    <p
                        class="
                            text-xs
                            text-red-500
                            font-medium
                        "
                    >

                        🔴 ยังไม่ส่ง

                    </p>


                    <p
                        id="notSentCount"
                        class="
                            text-2xl
                            font-bold
                            text-red-600
                        "
                    >

                        0 คน

                    </p>

                </div>


                <div
                    class="
                        w-10
                        h-10
                        bg-red-100
                        rounded-full
                        flex
                        items-center
                        justify-center
                        text-red-600
                    "
                >

                    !

                </div>

            </div>

        </div>



        <!-- ADD MEMBER -->

        <div
            class="
                bg-white
                p-4
                sm:p-6
                rounded-xl
                shadow-md
                border
                border-amber-200
                space-y-4
            "
        >

            <h2
                class="
                    text-lg
                    font-semibold
                    text-gray-800
                "
            >

                ➕ เพิ่มสมาชิกใหม่

            </h2>


            <form
                id="memberForm"
                class="
                    grid
                    grid-cols-1
                    sm:grid-cols-3
                    gap-3
                "
            >

                <input
                    type="text"
                    id="memberCode"
                    placeholder="รหัสสมาชิก เช่น RK177"
                    class="
                        px-4
                        py-2
                        border
                        border-gray-300
                        rounded-lg
                        text-sm
                    "
                >


                <input
                    type="text"
                    id="memberName"
                    placeholder="ชื่อ - นามสกุล"
                    required
                    class="
                        px-4
                        py-2
                        border
                        border-gray-300
                        rounded-lg
                        text-sm
                    "
                >


                <input
                    type="text"
                    id="memberHouse"
                    placeholder="บ้านเลขที่ / หมู่"
                    required
                    class="
                        px-4
                        py-2
                        border
                        border-gray-300
                        rounded-lg
                        text-sm
                    "
                >


                <button
                    type="submit"
                    class="
                        sm:col-span-3
                        bg-amber-600
                        hover:bg-amber-700
                        text-white
                        font-medium
                        py-2
                        rounded-lg
                        transition
                        shadow
                    "
                >

                    💾 บันทึกเพิ่มสมาชิก

                </button>

            </form>

        </div>



        <!-- FILTER -->

        <div
            class="
                bg-white
                p-4
                rounded-xl
                border
                border-amber-200
                flex
                flex-wrap
                gap-2
                items-center
            "
        >

            <span
                class="
                    text-sm
                    text-gray-500
                "
            >

                กรองข้อมูล:

            </span>


            <button
                onclick="filterMembers('all')"
                id="btnFilterAll"
                class="
                    px-3
                    py-2
                    text-xs
                    rounded-lg
                    bg-amber-600
                    text-white
                "
            >

                ทั้งหมด

            </button>


            <button
                onclick="filterMembers('sent')"
                id="btnFilterSent"
                class="
                    px-3
                    py-2
                    text-xs
                    rounded-lg
                    bg-gray-100
                    text-gray-700
                "
            >

                🟢 ส่งแล้ว

            </button>


            <button
                onclick="filterMembers('pending')"
                id="btnFilterPending"
                class="
                    px-3
                    py-2
                    text-xs
                    rounded-lg
                    bg-gray-100
                    text-gray-700
                "
            >

                🔴 ยังไม่ส่ง

            </button>

        </div>



        <!-- MEMBER TABLE -->

        <div
            class="
                bg-white
                rounded-xl
                shadow-md
                border
                border-amber-200
                overflow-hidden
            "
        >

            <div class="overflow-x-auto">

                <table
                    class="
                        w-full
                        text-sm
                        text-left
                        text-gray-700
                    "
                >

                    <thead
                        class="
                            text-xs
                            text-gray-700
                            uppercase
                            bg-amber-100
                        "
                    >

                        <tr>

                            <th
                                class="
                                    px-4
                                    py-3
                                    text-center
                                "
                            >

                                ลำดับ

                            </th>


                            <th
                                class="
                                    px-4
                                    py-3
                                "
                            >

                                รหัสสมาชิก

                            </th>


                            <th
                                class="
                                    px-4
                                    py-3
                                "
                            >

                                ชื่อ - นามสกุล

                            </th>


                            <th
                                class="
                                    px-4
                                    py-3
                                "
                            >

                                บ้านเลขที่

                            </th>


                            <th
                                class="
                                    px-4
                                    py-3
                                    text-center
                                "
                            >

                                สถานะ

                            </th>


                            <th
                                class="
                                    px-4
                                    py-3
                                    text-center
                                "
                            >

                                จัดการ

                            </th>

                        </tr>

                    </thead>


                    <tbody id="memberTableBody">

                        <tr>

                            <td
                                colspan="6"
                                class="loading-row"
                            >

                                🔄 กำลังโหลดข้อมูลสมาชิก...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>



    <!-- FIREBASE MEMBER SYSTEM -->

    <script type="module">

        import {

            getRongkhemMembers,
            addRongkhemMember,
            updateRongkhemMember,
            deleteRongkhemMember

        }

        from "./members.js";



        let members = [];

        let currentFilter = "all";



        // ==================================
        // LOAD MEMBERS
        // ==================================

        async function loadMembers() {

            const tbody =
                document.getElementById(
                    "memberTableBody"
                );


            try {

                tbody.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="loading-row"
                        >

                            🔄 กำลังโหลดข้อมูล...

                        </td>

                    </tr>

                `;


                members =
                    await getRongkhemMembers();


                renderTable();

            }

            catch (error) {

                console.error(
                    error
                );


                tbody.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="
                                text-center
                                py-8
                                text-red-500
                            "
                        >

                            ❌ โหลดข้อมูลสมาชิกไม่สำเร็จ

                        </td>

                    </tr>

                `;

            }

        }



        // ==================================
        // RENDER TABLE
        // ==================================

        function renderTable() {

            const tbody =
                document.getElementById(
                    "memberTableBody"
                );


            const total =
                members.length;


            const sent =
                members.filter(
                    member =>
                        member.status === "sent"
                ).length;


            const pending =
                total - sent;


            document.getElementById(
                "totalCount"
            ).innerText =
                total + " คน";


            document.getElementById(
                "sentCount"
            ).innerText =
                sent + " คน";


            document.getElementById(
                "notSentCount"
            ).innerText =
                pending + " คน";



            let filtered =
                members;


            if (
                currentFilter === "sent"
            ) {

                filtered =
                    members.filter(
                        member =>
                            member.status === "sent"
                    );

            }


            if (
                currentFilter === "pending"
            ) {

                filtered =
                    members.filter(
                        member =>
                            member.status !== "sent"
                    );

            }



            if (
                filtered.length === 0
            ) {

                tbody.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="
                                text-center
                                py-8
                                text-gray-400
                            "
                        >

                            ไม่พบข้อมูลสมาชิก

                        </td>

                    </tr>

                `;

                return;

            }



            tbody.innerHTML =
                filtered.map(
                    (
                        member,
                        index
                    ) => {

                        const memberId =
                            member.memberId ||
                            member.id ||
                            "-";


                        const isSent =
                            member.status ===
                            "sent";


                        return `

                            <tr
                                class="
                                    border-b
                                    border-gray-100
                                    hover:bg-amber-50
                                "
                            >

                                <td
                                    class="
                                        px-4
                                        py-3
                                        text-center
                                    "
                                >

                                    ${index + 1}

                                </td>


                                <td
                                    class="
                                        px-4
                                        py-3
                                        font-mono
                                        font-semibold
                                    "
                                >

                                    ${memberId}

                                </td>


                                <td
                                    class="
                                        px-4
                                        py-3
                                        font-medium
                                    "
                                >

                                    ${member.name || "-"}

                                </td>


                                <td
                                    class="
                                        px-4
                                        py-3
                                    "
                                >

                                    ${
                                        member.address ||
                                        member.houseNo ||
                                        "-"
                                    }

                                </td>


                                <td
                                    class="
                                        px-4
                                        py-3
                                        text-center
                                    "
                                >

                                    <button

                                        onclick="
                                            toggleStatus(
                                                '${member.firestoreId}'
                                            )
                                        "

                                        class="
                                            px-3
                                            py-1
                                            text-xs
                                            rounded-full
                                            font-medium
                                            ${
                                                isSent

                                                ?

                                                "bg-emerald-100 text-emerald-700"

                                                :

                                                "bg-red-100 text-red-700"
                                            }
                                        "

                                    >

                                        ${
                                            isSent

                                            ?

                                            "🟢 ส่งแล้ว"

                                            :

                                            "🔴 ยังไม่ส่ง"
                                        }

                                    </button>

                                </td>


                                <td
                                    class="
                                        px-4
                                        py-3
                                        text-center
                                    "
                                >

                                    <button

                                        onclick="
                                            deleteMember(
                                                '${member.firestoreId}'
                                            )
                                        "

                                        class="
                                            px-3
                                            py-1
                                            text-xs
                                            bg-rose-50
                                            text-rose-600
                                            rounded-lg
                                        "
                                    >

                                        🗑️ ลบ

                                    </button>

                                </td>

                            </tr>

                        `;

                    }

                ).join("");

        }



        // ==================================
        // ADD MEMBER
        // ==================================

        document
            .getElementById(
                "memberForm"
            )
            .addEventListener(

                "submit",

                async function (
                    event
                ) {

                    event.preventDefault();


                    const memberId =
                        document
                        .getElementById(
                            "memberCode"
                        )
                        .value
                        .trim();


                    const name =
                        document
                        .getElementById(
                            "memberName"
                        )
                        .value
                        .trim();


                    const address =
                        document
                        .getElementById(
                            "memberHouse"
                        )
                        .value
                        .trim();


                    try {

                        const result =
                            await addRongkhemMember({

                                memberId:

                                    memberId ||

                                    null,

                                name:

                                    name,

                                address:

                                    address

                            });


                        if (
                            !result.success
                        ) {

                            throw new Error(
                                result.error ||
                                "บันทึกไม่สำเร็จ"
                            );

                        }


                        alert(
                            "✅ เพิ่มสมาชิกเรียบร้อย"
                        );


                        event.target.reset();


                        await loadMembers();

                    }

                    catch (
                        error
                    ) {

                        console.error(
                            error
                        );


                        alert(

                            "❌ เพิ่มสมาชิกไม่สำเร็จ\n" +

                            error.message

                        );

                    }

                }

            );



        // ==================================
        // TOGGLE STATUS
        // ==================================

        window.toggleStatus =
            async function (
                firestoreId
            ) {

                const member =
                    members.find(

                        item =>
                            item.firestoreId ===
                            firestoreId

                    );


                if (
                    !member
                ) return;


                const newStatus =

                    member.status ===
                    "sent"

                    ?

                    "pending"

                    :

                    "sent";


                const result =
                    await updateRongkhemMember(

                        firestoreId,

                        {

                            status:

                                newStatus

                        }

                    );


                if (
                    result.success
                ) {

                    await loadMembers();

                }

                else {

                    alert(
                        "❌ บันทึกสถานะไม่สำเร็จ"
                    );

                }

            };



        // ==================================
        // DELETE MEMBER
        // ==================================

        window.deleteMember =
            async function (
                firestoreId
            ) {

                if (

                    !confirm(
                        "ยืนยันการลบสมาชิก?"
                    )

                ) {

                    return;

                }


                const result =
                    await deleteRongkhemMember(

                        firestoreId

                    );


                if (
                    result.success
                ) {

                    alert(
                        "ลบสมาชิกเรียบร้อย"
                    );


                    await loadMembers();

                }

                else {

                    alert(
                        "❌ ลบข้อมูลไม่สำเร็จ"
                    );

                }

            };



        // ==================================
        // RESET STATUS
        // ==================================

        window.resetAllStatus =
            async function () {

                if (
                    members.length === 0
                ) return;


                if (

                    !confirm(
                        "ยืนยันเริ่มรอบใหม่? สมาชิกทั้งหมดจะถูกตั้งเป็นยังไม่ส่ง"
                    )

                ) {

                    return;

                }


                try {

                    for (
                        const member
                        of members
                    ) {

                        if (
                            member.firestoreId
                        ) {

                            await updateRongkhemMember(

                                member.firestoreId,

                                {

                                    status:

                                        "pending"

                                }

                            );

                        }

                    }


                    alert(
                        "✅ เริ่มรอบใหม่เรียบร้อย"
                    );


                    await loadMembers();

                }

                catch (
                    error
                ) {

                    alert(
                        "❌ รีเซ็ตข้อมูลไม่สำเร็จ"
                    );

                }

            };



        // ==================================
        // FILTER
        // ==================================

        window.filterMembers =
            function (
                type
            ) {

                currentFilter =
                    type;


                document
                    .getElementById(
                        "btnFilterAll"
                    )
                    .className =

                    type === "all"

                    ?

                    "px-3 py-2 text-xs rounded-lg bg-amber-600 text-white"

                    :

                    "px-3 py-2 text-xs rounded-lg bg-gray-100 text-gray-700";


                document
                    .getElementById(
                        "btnFilterSent"
                    )
                    .className =

                    type === "sent"

                    ?

                    "px-3 py-2 text-xs rounded-lg bg-emerald-600 text-white"

                    :

                    "px-3 py-2 text-xs rounded-lg bg-gray-100 text-gray-700";


                document
                    .getElementById(
                        "btnFilterPending"
                    )
                    .className =

                    type === "pending"

                    ?

                    "px-3 py-2 text-xs rounded-lg bg-red-600 text-white"

                    :

                    "px-3 py-2 text-xs rounded-lg bg-gray-100 text-gray-700";


                renderTable();

            };



        // ==================================
        // START
        // ==================================

        document.addEventListener(

            "DOMContentLoaded",

            async function () {

                await loadMembers();

            }

        );

    </script>

</body>
</html>
