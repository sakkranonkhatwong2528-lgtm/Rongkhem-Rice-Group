<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>👥 ทะเบียนสมาชิก</title>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Sarabun',sans-serif;
}

body{
background:#eef2f5;
}

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.header{
background:linear-gradient(135deg,#0f5132,#198754);
padding:25px;
color:#fff;
border-radius:20px;
margin-bottom:20px;
}

.header h1{
font-size:34px;
}

.card{
background:#fff;
padding:20px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
margin-bottom:20px;
}

.row{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

input{
padding:14px;
border:1px solid #ddd;
border-radius:10px;
width:100%;
}

button{
padding:13px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.btn-save{
background:#198754;
color:#fff;
}

.btn-clear{
background:#dc3545;
color:#fff;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#198754;
color:#fff;
padding:14px;
}

td{
padding:12px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#f5fff8;
}

.action button{

margin-right:5px;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>

👥 ทะเบียนสมาชิก

</h1>

<p>

กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6

</p>

</div>

<div class="card">

<h2>

เพิ่มสมาชิก

</h2>

<br>

<div class="row">

<input
id="memberHouse"
placeholder="บ้านเลขที่">

<input
id="memberName"
placeholder="ชื่อ-สกุล">

<input
id="memberPhone"
placeholder="เบอร์โทร">

<div>

<button
class="btn-save"
onclick="addMember()">

💾 บันทึก

</button>

<button
class="btn-clear"
onclick="clearMemberForm()">

ล้าง

</button>

</div>

</div>

</div>

<div class="card">

<input

id="searchMember"

placeholder="🔍 ค้นหาสมาชิก"

onkeyup="searchMember()">

<table>

<thead>

<tr>

<th>ลำดับ</th>

<th>บ้านเลขที่</th>

<th>ชื่อ</th>

<th>โทรศัพท์</th>

<th>ส่งแล้ว</th>

<th>ค้างส่ง</th>

<th>จัดการ</th>

</tr>

</thead>

<tbody id="memberTable">

</tbody>

</table>
  </div>

<a href="index.html"
style="
display:block;
text-align:center;
margin-top:25px;
text-decoration:none;
font-weight:bold;
color:#666;
">

🏠 กลับหน้าหลัก

</a>

</div>

<!-- Modal QR -->

<div id="qrModal"
style="
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
z-index:999;
">

<div
style="
background:#fff;
width:350px;
margin:60px auto;
padding:20px;
border-radius:15px;
text-align:center;
">

<h2>

📱 QR Code สมาชิก

</h2>

<br>

<div id="qrcode"></div>

<br>

<button
class="btn-save"
onclick="printQR()">

🖨️ พิมพ์

</button>

<button
class="btn-clear"
onclick="closeQR()">

ปิด

</button>

</div>

</div>

<script src="js/app.js"></script>

<script src="js/members.js"></script>

<script src="js/qr.js"></script>

<script>

window.onload=function(){

loadMembers();

}

function closeQR(){

document.getElementById("qrModal").style.display="none";

}

</script>

</body>

</html>

</div>
