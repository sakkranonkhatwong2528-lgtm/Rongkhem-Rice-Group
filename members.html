<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
ทะเบียนสมาชิกกลุ่มข้าวสาร
</title>

<style>

body{
margin:0;
font-family:Tahoma,sans-serif;
background:#f4f7f2;
}

.header{
background:linear-gradient(135deg,#228B22,#4caf50);
color:white;
padding:25px;
text-align:center;
}

.box{
background:white;
margin:15px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{

width:100%;
padding:15px;
background:#228B22;
color:white;
border:0;
border-radius:10px;
font-size:18px;

}


.member{

background:#f8fff8;
padding:15px;
margin-top:10px;
border-radius:10px;
border-left:5px solid #228B22;

}


.delete{

background:#d9534f;
padding:8px;
border-radius:8px;
color:white;
border:0;

}


.count{

text-align:center;
font-size:25px;
color:#228B22;
font-weight:bold;

}

</style>


</head>


<body>



<div class="header">

<h1>
👥 ทะเบียนสมาชิก
</h1>

<p>
กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6
</p>

</div>




<div class="box">

<h2>
➕ เพิ่มสมาชิก
</h2>


<input id="name"
placeholder="ชื่อ-นามสกุล">


<input id="house"
placeholder="บ้านเลขที่">


<button onclick="addMember()">

บันทึกสมาชิก

</button>


</div>




<div class="box">


<h2>
📋 รายชื่อสมาชิก
</h2>


<div class="count">

สมาชิกทั้งหมด 
<span id="total">0</span>
คน

</div>



<div id="list"></div>


</div>





<script>


let members =
JSON.parse(localStorage.getItem("members")) || [];



function showMember(){


let html="";


members.forEach((m,index)=>{


html += `

<div class="member">


<b>
${index+1}. ${m.name}
</b>


<br>

🏠 บ้านเลขที่ ${m.house}


<br><br>


<button class="delete"
onclick="removeMember(${index})">

ลบ

</button>


</div>

`;



});


document.getElementById("list").innerHTML=html;


document.getElementById("total").innerHTML=
members.length;



}



function addMember(){


let name =
document.getElementById("name").value;


let house =
document.getElementById("house").value;



if(name==""){

alert("กรุณาใส่ชื่อสมาชิก");

return;

}



let data={

name:name,

house:house

};



members.push(data);



localStorage.setItem(
"members",
JSON.stringify(members)
);



document.getElementById("name").value="";

document.getElementById("house").value="";



showMember();


}



function removeMember(index){


if(confirm("ต้องการลบสมาชิกนี้หรือไม่")){


members.splice(index,1);


localStorage.setItem(
"members",
JSON.stringify(members)
);


showMember();


}


}



showMember();


</script>


</body>

</html>
