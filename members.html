<div class="member-card">

    <strong>
        ${m.name}
    </strong>

    <br>

    🏠 บ้านเลขที่:
    ${m.house}

    <br>

    📦 ค้างส่ง:
    ${Number(m.pending || 0)} ครั้ง

    <br>

    ${
        Number(m.pending || 0) === 0
        ? `<span class="ok">🟢 ปกติ</span>`
        : Number(m.pending || 0) === 1
        ? `<span class="warning">🟡 แจ้งเตือน 1 ครั้ง</span>`
        : `<span class="danger">🔴 เสนอพิจารณาตัดสมาชิก</span>`
    }

</div>
