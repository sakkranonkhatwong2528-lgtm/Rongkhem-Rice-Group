<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ทะเบียนสมาชิกกลุ่มข้าวสาร</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:#f3f7f0;
    color:#333;
}

.header{
    background:linear-gradient(135deg,#176b2c,#4caf50);
    color:white;
    padding:22px 15px;
    text-align:center;
}

.header h1{
    margin:5px 0;
}

.header p{
    margin:5px 0;
}

.container{
    max-width:800px;
    margin:auto;
    padding:15px;
}

.box{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:16px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:13px;
    margin:6px 0;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:0;
    border-radius:10px;
    background:#228B22;
    color:white;
    font-size:16px;
}

button.delete{
    background:#c62828;
}

button.reset{
    background:#777;
}

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.summary-card{
    background:#f8fff8;
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.number{
    font-size:28px;
    font-weight:bold;
    color:#228B22;
}

.member-card{
    background:#fafafa;
    margin-top:10px;
    padding:15px;
    border-radius:12px;
    border-left:5px solid #228B22;
}

.ok{
    color:#1b7a1b;
    font-weight:bold;
}

.warning{
    color:#b88600;
    font-weight:bold;
}

.danger{
    color:#c62828;
    font-weight:bold;
}

.search{
    margin-bottom:10px;
}

.back{
    display:block;
    text-align:center;
    padding:15px;
    color:#228B22;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="header">

<h1>👥 ทะเบียนสมาชิก</h1>

<p>กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</p>

</div>


<div class="container">


<!-- สรุปสมาชิก -->

<div class="box">

<div class="summary">

<div class="summary-card">

<div>👥 สมาชิกทั้งหมด</div>

<div class="number" id="totalMember">
185
</div>

<small>ครัวเรือน</small>

</div>


<div class="summary-card">

<div>⚠️ ค้างส่ง</div>

<div class="number" id="pendingMember">
0
</div>

<small>ครัวเรือน</small>

</div>

</div>

</div>


<!-- เพิ่มสมาชิก -->

<div class="box">

<h2>➕ เพิ่มสมาชิก</h2>

<input
    id="name"
    type="text"
    placeholder="ชื่อ-นามสกุล"
>

<input
    id="house"
    type="text"
    placeholder="บ้านเลขที่"
>

<button onclick="addMember()">
💾 บันทึกสมาชิก
</button>

</div>


<!-- ค้นหา -->

<div class="box">

<h2>🔎 ค้นหาสมาชิก</h2>

<input
    id="search"
    class="search"
    type="text"
    placeholder="ค้นหาชื่อหรือบ้านเลขที่"
    oninput="showMembers()"
>

<div id="memberList"></div>

</div>


<a class="back" href="ดัชนี.html">
← กลับหน้าหลัก
</a>


</div>


<script>

let members =
    JSON.parse(localStorage.getItem("members")) || [];


/* เพิ่มข้อมูลเดิมให้มีช่องสถานะ */

members = members.map(m => ({

    ...m,

    status:
        m.status || "ปกติ",

    pending:
        Number(m.pending || 0),

    pendingFor:
        m.pendingFor || ""

}));


function saveMembers(){

    localStorage.setItem(
        "members",
        JSON.stringify(members)
    );

}


/* เพิ่มสมาชิก */

function addMember(){

    const name =
        document.getElementById("name").value.trim();

    const house =
        document.getElementById("house").value.trim();


    if(!name){

        alert("กรุณากรอกชื่อ-นามสกุล");
        return;

    }


    if(!house){

        alert("กรุณากรอกบ้านเลขที่");
        return;

    }


    /* ป้องกันบ้านเลขที่ซ้ำ */

    const duplicate =
        members.some(
            m => String(m.house) === String(house)
        );


    if(duplicate){

        alert(
            "บ้านเลขที่นี้มีสมาชิกอยู่แล้ว"
        );

        return;

    }


    members.push({

        id:Date.now(),

        name:name,

        house:house,

        status:"ปกติ",

        pending:0,

        pendingFor:""

    });


    saveMembers();


    document.getElementById("name").value = "";
    document.getElementById("house").value = "";


    showMembers();

    alert("เพิ่มสมาชิกเรียบร้อยแล้ว");

}


/* แสดงสมาชิก */

function showMembers(){

    const keyword =
        document.getElementById("search").value
        .trim()
        .toLowerCase();


    const filtered =
        members.filter(m => {

            const name =
                String(m.name || "").toLowerCase();

            const house =
                String(m.house || "").toLowerCase();

            return (
                name.includes(keyword) ||
                house.includes(keyword)
            );

        });


    let html = "";


    filtered.forEach((m,index)=>{

        const pending =
            Number(m.pending || 0);


        let statusText =
            "🟢 ปกติ";

        let statusClass =
            "ok";


        if(pending === 1){

            statusText =
                "🟡 แจ้งเตือน 1 ครั้ง";

            statusClass =
                "warning";

        }


        if(pending >= 2){

            statusText =
                "🔴 เสนอพิจารณาตัดสมาชิก";

            statusClass =
                "danger";

        }


        html += `

            <div class="member-card">

                <strong>
                    ${index + 1}. ${m.name}
                </strong>

                <br>

                🏠 บ้านเลขที่:
                ${m.house}

                <br>

                📦 ค้างส่ง:
                ${pending} งาน

                <br>

                ⚰️ งานศพที่ค้าง:
                ${m.pendingFor || "-"}

                <br>

                <span class="${statusClass}">
                    ${statusText}
                </span>

                <br>

                <button
                    class="delete"
                    onclick="deleteMember(${m.id})">

                    🗑 ลบสมาชิก

                </button>

            </div>

        `;

    });


    if(filtered.length === 0){

        html = `
            <p>
                ไม่พบสมาชิก
            </p>
        `;

    }


    document.getElementById("memberList").innerHTML =
        html;


    document.getElementById("totalMember").innerText =
        members.length > 0
        ? members.length
        : 185;


    document.getElementById("pendingMember").innerText =
        members.filter(
            m => Number(m.pending || 0) > 0
        ).length;

}


/* ลบสมาชิก */

function deleteMember(id){

    const member =
        members.find(
            m => m.id === id
        );


    if(!member){
        return;
    }


    const confirmDelete =
        confirm(
            `ต้องการลบ ${member.name} หรือไม่?`
        );


    if(!confirmDelete){
        return;
    }


    members =
        members.filter(
            m => m.id !== id
        );


    saveMembers();

    showMembers();

}


/* เริ่มต้น */

showMembers();

</script>

</body>

</html>
