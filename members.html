<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายชื่อสมาชิก 192 ครัวเรือน - กลุ่มข้าวสาร บ้านร่องเข็ม</title>
  <style>
    body { font-family: 'Sarabun', sans-serif; background: #f4f7f6; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 900px; margin: auto; }
    .header { background: #1b4332; color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    
    .search-box { margin-bottom: 15px; }
    .search-box input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; display: table; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { background: #f8f9fa; color: #1b4332; position: sticky; top: 0; }
    .table-container { max-height: 500px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 6px; }

    .status-paid { color: #27ae60; font-weight: bold; background: #e8f8f5; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
    .status-unpaid { color: #e74c3c; font-weight: bold; background: #fadbd8; padding: 3px 8px; border-radius: 12px; font-size: 12px; }

    .btn-back { display: block; text-align: center; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 style="margin:0;">👥 รายชื่อสมาชิกกลุ่มข้าวสาร</h2>
    <small>บ้านร่องเข็ม หมู่ที่ 6 (ทั้งหมด 192 ครัวเรือน)</small>
  </div>

  <div class="card">
    <div class="search-box">
      <input type="text" id="searchInput" onkeyup="filterMembers()" placeholder="🔍 พิมพ์ค้นหาบ้านเลขที่ หรือ ชื่อสมาชิก...">
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ลำดับ</th>
            <th>บ้านเลขที่</th>
            <th>ชื่อ - นามสกุล หัวหน้าครอบครัว</th>
            <th>สถานะส่งข้าวสาร</th>
          </tr>
        </thead>
        <tbody id="memberTableBody">
          <!-- โค้ดจะสร้างรายชื่อ 192 ครัวเรือนตรงนี้ -->
        </tbody>
      </table>
    </div>
  </div>

  <a href="dashboard.html" class="btn-back">⬅️ กลับหน้าหลัก Dashboard</a>
</div>

<script>
// ฟังก์ชันสร้างรายชื่อสมาชิกครบ 192 ครัวเรือนอัตโนมัติ
function init192Members() {
  let members = JSON.parse(localStorage.getItem('memberList'));
  
  // ถ้ายังไม่มีข้อมูล หรือข้อมูลมีน้อยกว่า 192 ให้สร้างใหม่ให้ครบ 192 ครัวเรือน
  if (!members || members.length < 192) {
    members = [];
    for (let i = 1; i <= 192; i++) {
      // ตัวอย่างการกำหนดสถานะ (182 รายแรกส่งแล้ว / 10 รายหลังค้างส่ง ตามตัวเลขหน้า Dashboard)
      let status = i <= 182 ? "ส่งแล้ว" : "ค้างส่ง";
      
      members.push({
        id: i,
        houseNo: `${i}`,
        name: `ครัวเรือนที่ ${i} (บ้านร่องเข็ม ม.6)`,
        status: status
      });
    }
    localStorage.setItem('memberList', JSON.stringify(members));
  }
  return members;
}

// วาดตารางรายชื่อสมาชิก
function renderMembers() {
  const members = init192Members();
  const tbody = document.getElementById("memberTableBody");
  tbody.innerHTML = "";

  members.forEach((m, index) => {
    const isPaid = m.status === 'ส่งแล้ว';
    tbody.innerHTML += `
      <tr>
        <td>${index + 1}</td>
        <td><strong>บ้านเลขที่ ${m.houseNo}</strong></td>
        <td>${m.name}</td>
        <td>
          <span class="${isPaid ? 'status-paid' : 'status-unpaid'}">
            ${isPaid ? '✅ ส่งแล้ว' : '❌ ค้างส่ง'}
          </span>
        </td>
      </tr>
    `;
  });
}

// ฟังก์ชันค้นหาบ้านเลขที่ / ชื่อ
function filterMembers() {
  const input = document.getElementById("searchInput").value.toLowerCase();
  const rows = document.querySelectorAll("#memberTableBody tr");

  rows.forEach(row => {
    const text = row.innerText.toLowerCase();
    row.style.display = text.includes(input) ? "" : "none";
  });
}

// โหลดข้อมูลเมื่อเปิดหน้าเว็บ
document.addEventListener("DOMContentLoaded", renderMembers);
</script>

</body>
</html>
