<!-- ปรับแถบเมนูด้านบน โดยเพิ่มปุ่มรีเซ็ตสถานะ -->
<div style="display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap;">
  <div style="display: flex; gap: 10px; flex-wrap: wrap;">
    <input type="text" id="searchMember" placeholder="🔍 ค้นหา ชื่อ-นามสกุล / บ้านเลขที่..." onkeyup="filterMembers()" style="padding: 8px 12px; width: 220px; border: 1px solid #ccc; border-radius: 4px;">
    
    <select id="statusFilter" onchange="filterMembers()" style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px;">
      <option value="all">-- แสดงสถานะทั้งหมด --</option>
      <option value="sent">🟢 ส่งแล้ว</option>
      <option value="pending">🔴 ยังไม่ส่ง</option>
    </select>
  </div>

  <div style="display: flex; gap: 10px;">
    <!-- ปุ่มรีเซ็ตเริ่มรอบใหม่ (สีส้ม/เตือนภัย) -->
    <button onclick="resetAllMemberStatus()" style="background: #fd7e14; color: white; border: none; padding: 10px 14px; border-radius: 4px; cursor: pointer; font-weight: bold;">
      🔄 เริ่มรอบใหม่ (รีเซ็ตทั้งหมด)
    </button>

    <!-- ปุ่มเพิ่มสมาชิก -->
    <button onclick="openMemberModal()" style="background: #28a745; color: white; border: none; padding: 10px 14px; border-radius: 4px; cursor: pointer; font-weight: bold;">
      + เพิ่มสมาชิกใหม่
    </button>
  </div>
</div>
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทะเบียนสมาชิกกลุ่มข้าวสาร - บ้านร่องเข็ม หมู่ 6</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .status-badge { padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 0.85rem; }
    .status-paid { background-color: #d4edda; color: #155724; }
    .status-pending { background-color: #f8d7da; color: #721c24; }
    .btn-status { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-right: 4px; }
  </style>
</head>
<body>

  <div class="container" style="padding: 20px; max-width: 1100px; margin: 0 auto;">
    <h2>👥 ทะเบียนสมาชิกกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ 6</h2>

    <!-- ส่วนแถบค้นหา ตัวกรองสถานะ และปุ่มเพิ่มสมาชิก -->
    <div style="display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap;">
      <div style="display: flex; gap: 10px;">
        <input type="text" id="searchMember" placeholder="🔍 ค้นหา ชื่อ-นามสกุล / บ้านเลขที่..." onkeyup="filterMembers()" style="padding: 8px 12px; width: 250px; border: 1px solid #ccc; border-radius: 4px;">
        
        <select id="statusFilter" onchange="filterMembers()" style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px;">
          <option value="all">-- แสดงสถานะทั้งหมด --</option>
          <option value="sent">🟢 ส่งแล้ว</option>
          <option value="pending">🔴 ยังไม่ส่ง</option>
        </select>
      </div>

      <button onclick="openMemberModal()" style="background: #28a745; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">
        + เพิ่มสมาชิกใหม่
      </button>
    </div>

    <!-- ตารางแสดงทะเบียนสมาชิก -->
    <div class="table-container" style="background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
          <tr style="background-color: #f8f9fa; border-bottom: 2px solid #dee2e6;">
            <th style="padding: 12px;">ลำดับ</th>
            <th style="padding: 12px;">รหัสสมาชิก</th>
            <th style="padding: 12px;">ชื่อ - นามสกุล</th>
            <th style="padding: 12px;">บ้านเลขที่ / หมู่</th>
            <th style="padding: 12px;">สถานะการส่ง</th>
            <th style="padding: 12px;">จัดการ</th>
          </tr>
        </thead>
        <tbody id="memberTableBody">
          <!-- ข้อมูลดึงมาใส่จาก JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal ป๊อปอัปเพิ่มสมาชิกใหม่ -->
  <div id="memberModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);">
    <div style="background: white; margin: 8% auto; padding: 25px; width: 90%; max-width: 450px; border-radius: 8px; position: relative;">
      <span onclick="closeMemberModal()" style="position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer;">&times;</span>
      <h3>📝 บันทึกสมาชิกใหม่</h3>
      <hr style="margin-bottom: 15px;">
      
      <form id="memberForm">
        <div style="margin-bottom: 12px;">
          <label>ชื่อ - นามสกุล *</label>
          <input type="text" id="memberName" placeholder="เช่น นายสมชาย ใจดี" required style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 15px;">
          <label>บ้านเลขที่ / หมู่ *</label>
          <input type="text" id="address" placeholder="เช่น 12/1 หมู่ 6" required style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 20px;">
          <label>สถานะเริ่มต้น</label>
          <select id="initialStatus" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
            <option value="pending">🔴 ยังไม่ส่ง</option>
            <option value="sent">🟢 ส่งแล้ว</option>
          </select>
        </div>

        <div style="text-align: right;">
          <button type="button" onclick="closeMemberModal()" style="padding: 8px 16px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">ยกเลิก</button>
          <button type="submit" style="padding: 8px 16px; background: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer;">💾 บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <script src="members.js"></script>
</body>
</html>
