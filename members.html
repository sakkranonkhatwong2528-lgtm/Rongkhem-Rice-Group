<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ทะเบียนสมาชิกกลุ่มข้าวสาร</title>

<style>

body{
font-family:Tahoma,sans-serif;
margin:0;
background:#f3f7f0;
}

.header{
background:#228B22;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:15px;
}

input,button{
width:100%;
padding:12px;
margin:5px 0;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
}

button{
background:#228B22;
color:white;
border:none;
}


.card{

background:white;
padding:15px;
margin-top:10px;
border-radius:15px;
box-shadow:0 3px 8px #ddd;

}


.menu{

display:block;
padding:15px;
text-decoration:none;
color:#228B22;

}

</style>

</head>


<body>


<div class="header">

<h2>
👥 ทะเบียนสมาชิก
</h2>

<p>
กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6
</p>

</div>



<div class="container">


<input id="name" placeholder="ชื่อ - นามสกุล">


<input id="house" placeholder="บ้านเลขที่">


<button onclick="addMember()">

➕ เพิ่มสมาชิก

</button>



<h3>
รายชื่อสมาชิก
</h3>


<div id="list"></div>


</div>




<script>


let members =
JSON.parse(localStorage.getItem("members")) || [];



function show(){

let html="";

members.forEach((m,i)=>{


html += `

<div class="card">

<b>
${i+1}. ${m.name}
</b>

<br>

บ้านเลขที่ ${m.house}


</div>

`;

});


document.getElementById("list").innerHTML=html;


}




function addMember(){


let name =
document.getElementById("name").value;


let house =
document.getElementById("house").value;



if(name==""){

alert("กรุณาใส่ชื่อสมาชิก");

return;

}



members.push({

name:name,
house:house

});



localStorage.setItem(

"members",

JSON.stringify(members)

);



document.getElementById("name").value="";

document.getElementById("house").value="";



show();


}



show();


</script>



</body>

</html>
