<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
ทะเบียนสมาชิกกลุ่มข้าวสารบ้านร่องเข็ม
</title>


<style>

body{
margin:0;
font-family:Tahoma,sans-serif;
background:#f5f7f2;
}


.header{

background:linear-gradient(
135deg,
#2e7d32,
#66bb6a
);

color:white;
padding:30px;
text-align:center;

}


.container{

padding:20px;

}


.card{

background:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;

}


table{

width:100%;
border-collapse:collapse;

}


th{

background:#2e7d32;
color:white;
padding:12px;

}


td{

padding:12px;
border-bottom:1px solid #ddd;
text-align:center;

}


.search{

width:100%;
padding:12px;
margin-bottom:15px;
border-radius:8px;
border:1px solid #ccc;

}


.btn{

display:inline-block;
margin-top:20px;
padding:12px 20px;
background:#2e7d32;
color:white;
text-decoration:none;
border-radius:10px;

}


</style>


</head>



<body>


<div class="header">

<h1>
👥 ทะเบียนสมาชิกกลุ่มข้าวสาร
</h1>

<p>
บ้านร่องเข็ม หมู่ที่ 6
</p>

</div>



<div class="container">


<div class="card">


<input class="search"
id="search"
placeholder="🔍 ค้นหาชื่อสมาชิก"
onkeyup="searchMember()">



<table>


<thead>

<tr>

<th>
ลำดับ
</th>

<th>
ชื่อ-นามสกุล
</th>

<th>
บ้านเลขที่
</th>

<th>
จำนวนข้าว
</th>

</tr>

</thead>


<tbody id="memberList">


<tr>

<td>
1
</td>

<td>
นายจักรวัตร ประพลรัตนัง
</td>

<td>
2
</td>

<td>
12 กก.
</td>


</tr>


</tbody>


</table>


</div>


<a class="btn" href="index.html">
⬅ กลับหน้าหลัก
</a>


</div>




<script>


function searchMember(){

let input =
document.getElementById("search").value.toLowerCase();


let rows =
document.querySelectorAll("#memberList tr");


rows.forEach(row=>{


if(row.innerText.toLowerCase().includes(input)){

row.style.display="";

}else{

row.style.display="none";

}


});


}


</script>



</body>

</html>
