<script>

let members = JSON.parse(localStorage.getItem("members")) || [];

let list = members.filter(
    m => m.status === "ยังไม่ส่ง"
);

let alertBox = "";

if (list.length === 0) {

    alertBox = `
        <div class="success">
            ✅ ทุกครัวเรือนส่งข้าวสารครบแล้ว
        </div>
    `;

} else {

    alertBox = `
        <div class="warning">
            ❌ มีครัวเรือนยังไม่ส่ง ${list.length} ครัวเรือน
            <br><br>
    `;

    list.forEach(m => {

        alertBox += `
            🏠 ${m.name || "-"}
            <br>
            📌 สถานะ : ${m.status || "ยังไม่ส่ง"}
            <br>
            📦 ค้างส่ง : ${m.pending || 0} งาน
            <br>
            ⚰️ ค้างส่งงานศพ : ${m.pendingFor || "-"}
            <br><br>
        `;

    });

    alertBox += `
        </div>
    `;
}


const alertElement = document.getElementById("alert");

if (alertElement) {
    alertElement.innerHTML = alertBox;
}

</script>
