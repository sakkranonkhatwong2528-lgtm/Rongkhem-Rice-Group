<!-- ==================== 3. เมนู: จัดการงานศพ ==================== -->
<div id="tab-funeral" class="tab-content hidden flex-col gap-6">
    <!-- ฟอร์มเพิ่มงานศพใหม่ -->
    <div class="bg-white p-5 rounded-xl shadow-sm flex flex-col gap-4">
        <h2 class="text-lg font-bold text-gray-800 border-b pb-2">🕊️ เพิ่มงานศพใหม่ (บันทึกข้อมูลผู้เสียชีวิต)</h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <div>
                <label class="text-xs font-semibold text-gray-600 mb-1 block">ชื่อผู้เสียชีวิต</label>
                <input type="text" id="new-first-name" placeholder="เช่น เกษมสุข" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-600 mb-1 block">นามสกุล</label>
                <input type="text" id="new-last-name" placeholder="เช่น ใฝ่ใจ" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-600 mb-1 block">อายุ (ปี)</label>
                <input type="number" id="new-age" placeholder="เช่น 75" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-600 mb-1 block">บ้านเลขที่</label>
                <input type="text" id="new-house-no" placeholder="เช่น 12/1 หมู่ 6" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-600 mb-1 block">วันที่เสียชีวิต</label>
                <input type="date" id="new-death-date" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-600 mb-1 block">วันเผา (วันฌาปนกิจ)</label>
                <input type="date" id="new-cremation-date" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
        </div>

        <button onclick="addNewFuneral()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-6 rounded-lg text-sm w-full sm:w-fit transition mt-2 flex items-center justify-center gap-2">
            <span>+ บันทึกและเปิดงานศพนี้</span>
        </button>
    </div>

    <!-- ตารางประวัติงานศพ -->
    <div class="bg-white rounded-xl shadow-sm overflow-x-auto p-4">
        <h3 class="text-md font-bold text-gray-700 mb-3">📜 ประวัติงานศพทั้งหมด</h3>
        <table class="w-full text-left border-collapse">
            <thead class="bg-gray-50 border-b">
                <tr>
                    <th class="p-3 text-sm font-semibold text-gray-600">ชื่อ - นามสกุล</th>
                    <th class="p-3 text-sm font-semibold text-gray-600 text-center">อายุ</th>
                    <th class="p-3 text-sm font-semibold text-gray-600">บ้านเลขที่</th>
                    <th class="p-3 text-sm font-semibold text-gray-600">วันเสียชีวิต</th>
                    <th class="p-3 text-sm font-semibold text-gray-600">วันเผา</th>
                    <th class="p-3 text-sm font-semibold text-gray-600 text-center">สถานะ</th>
                </tr>
            </thead>
            <tbody id="funeral-history-table" class="divide-y">
                <!-- JS จะวาดข้อมูลงานศพลงตรงนี้ -->
            </tbody>
        </table>
    </div>
</div>
