<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌾 ระบบกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
box-sizing:border-box;
font-family:'Prompt',sans-serif;
}

body{
margin:0;
background:#eef7ee;
color:#263238;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

header{
background:linear-gradient(135deg,#1b5e20,#66bb6a);
color:white;
padding:30px;
border-radius:20px;
text-align:center;
animation:down .8s;
box-shadow:0 10px 25px #999;
}

@keyframes down{
from{opacity:0;transform:translateY(-50px)}
to{opacity:1;transform:translateY(0)}
}

.card{
background:white;
margin-top:20px;
padding:20px;
border-radius:18px;
box-shadow:0 5px 15px #ccc;
animation:show .8s;
}

@keyframes show{
from{opacity:0;transform:scale(.9)}
to{opacity:1;transform:scale(1)}
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.number{
font-size:40px;
font-weight:bold;
color:#2e7d32;
}

.danger{
color:#d32f2f;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

th{
background:#2e7d32;
color:white;
}

.badge{
background:#ffebee;
color:#c62828;
padding:5px 10px;
border-radius:20px;
}

button{
background:#2e7d32;
color:white;
border:0;
padding:12px;
border-radius:10px;
width:100%;
font-size:16px;
}
</style>

</head>

<body>

<div class="container">

<header>
<h1>🌾 ระบบกลุ่มข้าวสาร</h1>
<h2>บ้านร่องเข็ม หมู่ที่ 6</h2>
<p>สมาชิกทั้งหมด 192 ครัวเรือน</p>
</header>


<div class="card stats">

<div>
<div class="number" id="member">192</div>
สมาชิกทั้งหมด
</div>

<div>
<div class="number">182</div>
ส่งแล้ว
</div>

<div>
<div class="number danger">10</div>
ค้างส่ง
</div>

</div>


<div class="card">

<h2>🕊️ แจ้งงานศพ</h2>

<p>⚰️ นายเกษมสุข ใฝ่ใจ</p>
<p>วันฌาปนกิจ 25/07/2569</p>

<hr>

<p>⚰️ นายบูรณพิภพ ผัดดี</p>

</div>


<div class="card">

<h2>⚠️ สมาชิกค้างส่ง / พิจารณาตัดสิทธิ์</h2>

<table>

<tr>
<th>ลำดับ</th>
<th>ชื่อ</th>
<th>บ้านเลขที่</th>
<th>สถานะ</th>
</tr>


<tbody id="list"></tbody>

</table>

<br>

<button onclick="window.print()">
🖨️ พิมพ์รายงาน
</button>

</div>


</div>


<script>

let data=[
["นางแสงเพียร วงค์ขัติย์","6"],
["นายจักร์กวัส ประพลรัตนัง","2"],
["นายยนต์ ปิงเมือง","7"],
["นางสมศรี ปิงเมือง","8"],
["นายชัด ปิงเมือง","10"],
["นายรังษี ใฝ่จิต","14"],
["นายยรรยง ผัดดี","14/1"],
["นายหมื่น วังมูล","15"],
["นายโกวัฒนธฤทธิ์ ประพลรัตนัง","17"],
["นายภาณุวัฒน์ บุญยา","20"]
];


let html="";

data.forEach((x,i)=>{

html+=`
<tr>
<td>${i+1}</td>
<td>${x[0]}</td>
<td>${x[1]}</td>
<td>
<span class="badge">
เสนอพิจารณา
</span>
</td>
</tr>
`;

});


document.getElementById("list").innerHTML=html;


</script>


</body>
</html>
