<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบฌาปนกิจสงเคราะห์ข้าวสาร</title>
    <!-- โหลด Tailwind CSS ผ่าน CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Font Prompt จาก Google Fonts ให้หน้าเว็บดูสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Header / Navbar -->
    <header class="bg-emerald-700 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🌾 ระบบฌาปนกิจสงเคราะห์ข้าวสาร
            </h1>
            <span class="text-xs bg-emerald-800 px-3 py-1 rounded-full border border-emerald-600">
                💾 โหมดบันทึกในเครื่อง (LocalStorage)
            </span>
        </div>
    </header>

    <div class="container mx-auto p-4 md:p-6 flex flex-col md:flex-row gap-6">

        <!-- Sidebar เมนูด้านข้าง -->
        <aside class="w-full md:w-64 bg-white p-4 rounded-xl shadow-sm h-fit">
            <nav class="flex flex-col gap-2">
                <button class="w-full text-left px-4 py-3 rounded-lg bg-emerald-50 text-emerald-700 font-semibold border-l-4 border-emerald-600 flex items-center gap-2">
                    📊 สรุปภาพรวม
                </button>
                <button class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 text-gray-600 transition flex items-center gap-2">
                    🌾 บันทึกรับข้าวสาร
                </button>
                <button class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 text-gray-600 transition flex items-center gap-2">
                    🕊️ จัดการงานศพ
                </button>
                <button class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 text-gray-600 transition flex items-center gap-2">
                    ⚠️ สมาชิกที่ต้องติดตาม
                </button>
                <button class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 text-gray-600 transition flex items-center gap-2">
                    👥 ทะเบียนสมาชิก
                </button>
            </nav>
        </aside>

        <!-- Main Content Area (พื้นที่แสดงเนื้อหาหลัก) -->
        <main class="flex-1 flex flex-col gap-6">

            <!-- 1. แบนเนอร์แจ้งงานศพปัจจุบัน -->
            <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-xl shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                <div>
                    <div class="flex items-center gap-2 text-amber-800 font-bold text-lg">
                        <span>🕊️ งานศพปัจจุบัน:</span>
                        <span>นายเกษมสุข ใฝ่ใจ</span>
                    </div>
                    <p class="text-sm text-amber-700 mt-1">
                        📅 วันฌาปนกิจ: 10 สิงหาคม 2026
                    </p>
                </div>
                <span class="inline-block bg-amber-200 text-amber-800 text-xs px-3 py-1 rounded-full font-medium">
                    กำลังเปิดรับบันทึก
                </span>
            </div>

            <!-- 2. การ์ดสรุปยอดอัตโนมัติ (Dashboard Cards) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                
                <!-- Card 1: สมาชิกทั้งหมด -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 font-medium">สมาชิกทั้งหมด</p>
                        <h3 class="text-2xl font-bold text-gray-800 mt-1">150 <span class="text-sm font-normal text-gray-500">คน</span></h3>
                    </div>
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-xl font-bold">
                        👥
                    </div>
                </div>

                <!-- Card 2: ส่งข้าวสารแล้ว -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 font-medium">ส่งข้าวสารแล้ว</p>
                        <h3 class="text-2xl font-bold text-emerald-600 mt-1">120 <span class="text-sm font-normal text-gray-500">ถุง</span></h3>
                    </div>
                    <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-xl font-bold">
                        ✓
                    </div>
                </div>

                <!-- Card 3: ค้างส่ง -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 font-medium">จำนวนค้างส่ง</p>
                        <h3 class="text-2xl font-bold text-rose-500 mt-1">30 <span class="text-sm font-normal text-gray-500">คน</span></h3>
                    </div>
                    <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center text-xl font-bold">
                        ⏳
                    </div>
                </div>

                <!-- Card 4: ต้องติดตามสะสม -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 font-medium">ติดตามสะสม (≥2 งาน)</p>
                        <h3 class="text-2xl font-bold text-amber-600 mt-1">5 <span class="text-sm font-normal text-gray-500">คน</span></h3>
                    </div>
                    <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center text-xl font-bold">
                        🔴
                    </div>
                </div>

            </div>

        </main>
    </div>

</body>
</html>
