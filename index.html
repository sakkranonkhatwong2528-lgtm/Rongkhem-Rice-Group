<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Tahoma,"Noto Sans Thai",sans-serif;color:#fff;min-height:100vh;background:linear-gradient(135deg,#03140b,#07351d 45%,#0f7a3b);overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
.page{max-width:1220px;margin:auto;padding:18px}
.hero{text-align:center;padding:30px 10px 24px}.logo{width:96px;height:96px;margin:auto;display:grid;place-items:center;font-size:52px;border-radius:28px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 45px rgba(0,0,0,.25)}.hero h1{margin:14px 0 5px;font-size:clamp(30px,5vw,52px)}.hero h2{margin:0;color:#d8f7df;font-size:clamp(19px,3vw,28px);font-weight:600}.hero p{margin:10px 0 0;color:#aee7bc}
.panel{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:26px;backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.2)}
/* condolence */
.condolence{display:flex;gap:28px;align-items:center;padding:28px;margin-bottom:22px;position:relative;overflow:hidden}.condolence:before{content:"";position:absolute;width:320px;height:320px;right:-150px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(255,185,210,.15),transparent 70%)}.wreath{width:150px;height:150px;flex:0 0 150px;position:relative;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),rgba(255,190,215,.04));border:2px solid rgba(255,190,215,.5);z-index:2}.wreath-flower{font-size:60px}.wreath-leaves{position:absolute;top:12px;font-size:23px}.wreath-ribbon{position:absolute;bottom:19px;font-size:25px;color:#f5a8c0}.condolence-content{position:relative;z-index:3}.condolence-title{font-size:27px;font-weight:900;color:#fff0b0}.condolence-name{margin-top:8px;font-size:clamp(26px,4vw,40px);font-weight:900;line-height:1.25}.condolence-age{font-size:.48em;color:#e8cbd5;margin-left:9px;white-space:nowrap}.condolence-group{margin-top:14px;font-size:15px;line-height:1.9;color:#d9f2df;font-style:italic}.condolence-message{margin-top:12px;font-size:15px;line-height:1.95;color:#e7f5e9}.condolence-final{margin-top:18px;font-size:19px;font-weight:900;color:#ffeaa0}.condolence-village{margin-top:5px;color:#a9d5b5;font-size:13px}
/* summary */
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}.summary{padding:22px;border-radius:23px}.blue{background:linear-gradient(135deg,rgba(50,150,255,.22),rgba(255,255,255,.06))}.green{background:linear-gradient(135deg,rgba(50,200,120,.22),rgba(255,255,255,.06))}.gold{background:linear-gradient(135deg,rgba(255,200,50,.22),rgba(255,255,255,.06))}.summary-icon{font-size:34px}.summary-title{margin-top:7px;color:#c9efd3}.summary-number{font-size:42px;font-weight:900;line-height:1.1}.summary-unit{color:#9ed6ad;font-size:13px}
/* dashboard */
.dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{padding:20px;min-height:145px}.stat-icon{font-size:35px}.stat-title{font-size:14px;color:#b9e9c7;margin-top:7px}.stat-number{font-size:35px;font-weight:900;margin-top:3px}.stat-unit{font-size:13px;color:#9ed6ad}.latest{grid-column:span 2;min-height:255px;background:linear-gradient(135deg,rgba(255,215,70,.18),rgba(255,255,255,.06))}.latest-title{font-size:21px;font-weight:900;color:#fff4b0}.latest-name{font-size:clamp(22px,3vw,32px);font-weight:900;margin-top:15px}.latest-age{font-size:.53em;color:#e8cbd5;margin-left:8px;white-space:nowrap}.latest-info{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:17px}.info-box{padding:11px;border-radius:14px;background:rgba(255,255,255,.06)}.info-box small{display:block;color:#aee7bc;font-size:11px}.info-box strong{display:block;margin-top:4px;font-size:14px}.history-button{margin-top:15px;padding:11px 15px;border:0;border-radius:12px;background:#1e8744;color:#fff;font-weight:900}.history{display:none;grid-column:1/-1}.history.show{display:block}.history-card{padding:20px}.history-item{padding:15px;margin-top:10px;border-radius:15px;background:rgba(255,255,255,.06)}.history-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
/* delivery search */
.delivery{padding:22px;margin-top:20px}.delivery-head{display:flex;align-items:center;gap:12px}.delivery-icon{width:56px;height:56px;border-radius:17px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:29px}.delivery h2{margin:0;color:#fff0b0;font-size:22px}.delivery p{margin:4px 0 0;color:#b9e9c7;font-size:13px}.search-row{display:grid;grid-template-columns:1fr 115px;gap:10px;margin-top:15px}.search-row input,.search-row select{width:100%;padding:14px 15px;border:1px solid rgba(255,255,255,.17);border-radius:13px;background:rgba(0,0,0,.17);color:#fff;outline:none}.search-row button{border:0;border-radius:13px;background:#1b8543;color:#fff;font-weight:900}.results{margin-top:14px}.empty{padding:18px;text-align:center;color:#a9ceb1;border:1px dashed rgba(255,255,255,.14);border-radius:14px}.member-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;margin-top:9px;border-radius:16px;background:rgba(255,255,255,.06)}.member-info strong{display:block;font-size:18px}.member-info span{display:block;color:#b9e9c7;font-size:13px;margin-top:4px}.member-status{font-size:12px;margin-top:7px}.member-status.ok{color:#baf3c9}.member-status.warn{color:#ffd36b}.member-actions{display:flex;align-items:center;gap:8px}.amount{width:75px;padding:9px;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(0,0,0,.17);color:#fff}.deliver-btn{padding:10px 13px;border:0;border-radius:10px;background:#168744;color:#fff;font-weight:900}.deliver-btn:disabled{background:#58705f}
/* followup */
.followup{padding:22px;margin-top:20px}.follow-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.follow-head h2{margin:0;color:#fff0b0}.follow-alert{margin-top:14px;padding:14px;border-radius:14px;background:rgba(255,50,50,.15);border:1px solid rgba(255,120,120,.23);line-height:1.8}.follow-item{padding:15px;margin-top:10px;border-radius:15px;background:rgba(255,255,255,.06);border-left:5px solid #ffc107}.follow-item.danger{border-color:#ff5252}.follow-name{font-size:18px;font-weight:900}.follow-meta{margin-top:4px;color:#ccebd4;font-size:14px}.follow-status{margin-top:8px;font-weight:900;color:#ffd54f}.danger .follow-status{color:#ff6b6b}.print{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:#175fa8;color:#fff;font-weight:900}
/* menu */
.menu-title{margin:30px 0 14px}.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.menu a{min-height:125px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:#fff;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);transition:.25s}.menu a:hover{transform:translateY(-5px);background:rgba(255,255,255,.14)}.menu-icon{font-size:36px}.footer{text-align:center;padding:36px 10px;color:#9fd7ac}.creator-label{display:block;margin-top:10px;font-size:12px}.creator-name{display:block;margin-top:4px;color:#d9f2df;font-size:16px;font-weight:900}.creator-role{display:block;margin-top:3px;color:#a9d5b5;font-size:13px;font-style:italic}
@media(max-width:900px){.summary-grid{grid-template-columns:1fr}.dashboard,.menu{grid-template-columns:repeat(2,1fr)}.latest{grid-column:span 2}.latest-info,.history-meta{grid-template-columns:1fr}}
@media(max-width:600px){.page{padding:10px}.condolence{flex-direction:column;text-align:center;padding:24px 17px}.wreath{width:120px;height:120px;flex-basis:120px}.condolence-title{font-size:21px}.condolence-group,.condolence-message{font-size:14px}.search-row{grid-template-columns:1fr}.member-row{flex-direction:column;align-items:flex-start}.member-actions{width:100%}.deliver-btn{flex:1}.latest{grid-column:span 2}.latest-name{font-size:23px}.menu{gap:8px}.menu a{min-height:110px}.menu-icon{font-size:31px}}
</style>
</head>
<body>
<div class="page">
<header class="hero">
<div class="logo">🌾</div>
<h1>ระบบกลุ่มข้าวสาร</h1>
<h2>บ้านร่องเข็ม หมู่ที่ 6</h2>
<p id="memberHeader">สมาชิกทั้งหมด 192 ครัวเรือน</p>
</header>

<footer class="footer">🌾 กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6<br>ระบบจัดการสมาชิกและช่วยเหลืองานศพ<br><span class="creator-label">จัดทำโดย</span><span class="creator-name">นายศักรนนทน์ ขัติย์วงศ์</span><span class="creator-role">ผู้ใหญ่บ้าน บ้านร่องเข็ม หมู่ที่ 6</span></footer>
</div>

<script>
'use strict';

const DEMO_FUNERALS=[
{name:'นายเกษมสุข ใฝ่ใจ',age:47,house:'123',death:'22 กรกฎาคม 2569',cremate:'25 กรกฎาคม 2569'},
{name:'นายบูรณพิภพ ผัดดี',age:'',house:'254',death:'3 กรกฎาคม 2569',cremate:'8 กรกฎาคม 2569'}
];

const FOLLOWUPS=[
{name:'นายวุฒิภัทร เตชะวงค์',house:'91/1',pending:1},
{name:'นายต่วน ทาทอง',house:'114',pending:1},
{name:'นายประหยัด ปิงเมือง',house:'120',pending:2},
{name:'นายสมศีล งามจิต',house:'135',pending:1},
{name:'น.ส.ยุพา ใจดี',house:'160',pending:1},
{name:'นายตื่น มิ่งขวัญ',house:'176',pending:2},
{name:'น.ส.สำรอง มหาวรรณศรี',house:'200',pending:2},
{name:'นายบรรพต อินวงค์',house:'212',pending:2},
{name:'นางลวงทิพย์ ใฝ่จิต',house:'315',pending:2},
{name:'นายประทุม ดาวกระจาย',house:'328',pending:2}
];

function readArray(key){
    try{const v=JSON.parse(localStorage.getItem(key));return Array.isArray(v)?v:[];}catch(e){return [];}
}

function readMembers(){
    const keys=['members','memberList','users'];
    for(const key of keys){
        const arr=readArray(key);
        if(arr.length)return arr;
    }
    return [];
}

function parseFuneralDate(value){
    const text=String(value ?? '').trim();
    if(!text) return 0;

    const parts=text.replaceAll('-', '/').split('/');
    if(parts.length===3 && parts.every(Boolean)){
        const day=Number(parts[0]);
        const month=Number(parts[1]);
        let year=Number(parts[2]);
        if(day && month && year){
            if(year>2400) year-=543;
            return new Date(year,month-1,day).getTime();
        }
    }

    const thaiMonths={มกราคม:0,กุมภาพันธ์:1,มีนาคม:2,เมษายน:3,พฤษภาคม:4,มิถุนายน:5,กรกฎาคม:6,สิงหาคม:7,กันยายน:8,ตุลาคม:9,พฤศจิกายน:10,ธันวาคม:11};
    const words=text.split(' ');
    if(words.length===3 && thaiMonths[words[1]]!==undefined){
        const day=Number(words[0]);
        let year=Number(words[2]);
        if(day && year){
            if(year>2400) year-=543;
            return new Date(year,thaiMonths[words[1]],day).getTime();
        }
    }

    const parsed=Date.parse(text);
    return Number.isNaN(parsed)?0:parsed;
}

function parseFuneralDate(value){
    const text=String(value ?? '').trim();
    if(!text) return 0;

    const parts=text.replaceAll('-', '/').split('/');
    if(parts.length===3 && parts.every(Boolean)){
        const day=Number(parts[0]);
        const month=Number(parts[1]);
        let year=Number(parts[2]);
        if(day && month && year){
            if(year>2400) year-=543;
            return new Date(year,month-1,day).getTime();
        }
    }

    const months={
        มกราคม:0,กุมภาพันธ์:1,มีนาคม:2,เมษายน:3,
        พฤษภาคม:4,มิถุนายน:5,กรกฎาคม:6,สิงหาคม:7,
        กันยายน:8,ตุลาคม:9,พฤศจิกายน:10,ธันวาคม:11
    };

    const words=text.split(' ');
    if(words.length===3 && months[words[1]]!==undefined){
        const day=Number(words[0]);
        let year=Number(words[2]);
        if(day && year){
            if(year>2400) year-=543;
            return new Date(year,months[words[1]],day).getTime();
        }
    }

    const parsed=Date.parse(text);
    return Number.isNaN(parsed)?0:parsed;
}

function readFunerals(){
    const data=readArray('funerals');
    if(!data.length) return DEFAULT_FUNERALS;

    return [...data].sort((a,b)=>{
        const dateA=parseFuneralDate(a.death);
        const dateB=parseFuneralDate(b.death);

        if(dateA!==dateB){
            return dateB-dateA;
        }

        return Number(b.timestamp||b.createdAt||0)-Number(a.timestamp||a.createdAt||0);
    });
}

function memberName(item){return String(item.name ?? item.fullName ?? item.fullname ?? item.memberName ?? '').trim();}
function memberHouse(item){return String(item.house ?? item.houseNo ?? item.houseNumber ?? item.house_number ?? '').trim();}
function memberId(item,index){return String(item.id ?? item.memberId ?? ('member-'+index));}
function normalize(value){return String(value ?? '').trim().toLowerCase().split(' ').join('');}
function escapeHTML(value){
    const div=document.createElement('div');
    div.textContent=String(value ?? '');
    return div.innerHTML;
}

function getDeliveries(){return readArray('riceDeliveryRecords');}
function saveDeliveries(value){localStorage.setItem('riceDeliveryRecords',JSON.stringify(value));}

function searchMembers(){
    const input=document.getElementById('memberSearch');
    const box=document.getElementById('memberResults');
    const query=normalize(input.value);
    if(!query){box.innerHTML='<div class="empty">พิมพ์ชื่อหรือบ้านเลขที่เพื่อค้นหาสมาชิก</div>';return;}

    const source=readMembers().map((item,index)=>({id:memberId(item,index),name:memberName(item),house:memberHouse(item)})).filter(item=>item.name||item.house);

    const found=source.filter(item=>normalize(item.name).includes(query)||normalize(item.house).includes(query)).slice(0,20);

    if(!found.length){
        box.innerHTML='<div class="empty">ไม่พบสมาชิกในทะเบียนสมาชิกตามชื่อหรือบ้านเลขที่นี้</div>';
        return;
    }

    box.innerHTML='';

    found.forEach(member=>{
        const history=getDeliveries().filter(record=>String(record.memberId)===String(member.id));
        const row=document.createElement('div');
        row.className='member-row';

        const info=document.createElement('div');
        info.className='member-info';
        info.innerHTML='<strong>👤 '+escapeHTML(member.name||'ไม่ระบุชื่อ')+'</strong><span>🏠 บ้านเลขที่ '+escapeHTML(member.house||'-')+'</span><div class="member-status '+(history.length?'ok':'warn')+'">'+(history.length?'✅ ส่งแล้ว '+history.length+' ครั้ง':'⏳ ยังไม่ได้บันทึกการส่ง')+'</div>';

        const actions=document.createElement('div');
        actions.className='member-actions';

        const amount=document.createElement('input');
        amount.className='amount';
        amount.type='number';
        amount.min='1';
        amount.value='1';

        const button=document.createElement('button');
        button.className='deliver-btn';
        button.type='button';
        button.textContent=history.length?'✅ ส่งแล้ว':'✅ บันทึกส่ง';

        if(history.length){amount.disabled=true;button.disabled=true;}

        button.addEventListener('click',()=>recordDelivery(member,amount));

        actions.appendChild(amount);
        actions.appendChild(button);
        row.appendChild(info);
        row.appendChild(actions);
        box.appendChild(row);
    });
}

function recordDelivery(member,amount){
    const count=Number(amount.value);
    if(!count||count<1){alert('กรุณาระบุจำนวนข้าวสาร');return;}

    const list=getDeliveries();
    const exists=list.some(record=>String(record.memberId)===String(member.id));
    if(exists){alert('สมาชิกนี้บันทึกการส่งแล้ว');searchMembers();return;}

    list.push({id:'rice-'+Date.now(),memberId:member.id,name:member.name,house:member.house,amount:count,date:new Date().toLocaleDateString('th-TH'),timestamp:Date.now()});
    saveDeliveries(list);
    searchMembers();
}

function renderFollowups(){
    const box=document.getElementById('followList');
    box.innerHTML=FOLLOWUPS.map((item,index)=>{
        const danger=item.pending>=2;
        return '<div class="follow-item '+(danger?'danger':'')+'"><div class="follow-name">'+(index+1)+'. '+item.name+'</div><div class="follow-meta">🏠 บ้านเลขที่ '+item.house+' • 📦 ค้างส่ง '+item.pending+' ครั้ง</div><div class="follow-status">'+(danger?'🔴 เสนอพิจารณาตัดสมาชิก':'🟡 แจ้งเตือน 1 ครั้ง')+'</div></div>';
    }).join('');
}

function renderFunerals(){
    const data=readFunerals();
    const latest=data[0]||DEMO_FUNERALS[0];
    document.getElementById('funeralCount').textContent=data.length;
    document.getElementById('latestFuneralName').innerHTML='⚰️ '+escapeHTML(latest.name)+' '+(latest.age?'<span class="latest-age">อายุ '+escapeHTML(latest.age)+' ปี</span>':'');
    document.getElementById('latestFuneralDate').textContent=latest.death||'-';
    document.getElementById('latestFuneralHouse').textContent=latest.house||'-';
    document.getElementById('latestFuneralCremate').textContent=latest.cremate||'-';
    document.getElementById('condolenceName').textContent=latest.name||'ผู้วายชนม์';
    document.getElementById('condolenceAge').textContent=latest.age?'อายุ '+latest.age+' ปี':'';

    const history=document.getElementById('history');
    history.innerHTML='<div class="panel history-card"><h3>📜 ประวัติงานศพย้อนหลัง</h3>'+data.map((item,index)=>'<div class="history-item"><strong>'+String(index+1)+'. ⚰️ '+escapeHTML(item.name||'-')+'</strong> '+(item.age?'อายุ '+escapeHTML(item.age)+' ปี':'')+'<div class="history-meta"><div class="info-box">📅 '+escapeHTML(item.death||'-')+'</div><div class="info-box">🏠 '+escapeHTML(item.house||'-')+'</div><div class="info-box">🔥 '+escapeHTML(item.cremate||'-')+'</div></div></div>').join('')+'</div>';
}

function updateSummary(){
    const total=readMembers().length||192;
    const pending=10;
    const danger=6;
    document.getElementById('memberCount').textContent=total;
    document.getElementById('memberHeader').textContent='สมาชิกทั้งหมด '+total+' ครัวเรือน';
    document.getElementById('normalCount').textContent=Math.max(total-pending,0);
    document.getElementById('pendingCount').textContent=pending;
    document.getElementById('dangerCount').textContent=danger;
    document.getElementById('funeralRice').textContent='182';
}

document.getElementById('searchButton').addEventListener('click',searchMembers);
document.getElementById('memberSearch').addEventListener('input',searchMembers);
document.getElementById('historyBtn').addEventListener('click',()=>document.getElementById('history').classList.toggle('show'));
document.getElementById('printButton').addEventListener('click',()=>window.print());

updateSummary();
renderFunerals();
renderFollowups();
searchMembers();
/* =========================================
   🔊 เสียงต้อนรับสมาชิกกลุ่มข้าวสาร
========================================= */

(function(){
    const welcomeMessage =
        "ยินดีต้อนรับสู่ระบบ สมาชิกกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6";

    let hasSpoken = false;

    function speakWelcome(){
        if(hasSpoken) return;
        if(!("speechSynthesis" in window)) return;

        window.speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(welcomeMessage);

        utterance.lang = "th-TH";
        utterance.rate = 0.9;
        utterance.pitch = 1;
        utterance.volume = 1;

        utterance.onstart = function(){
            hasSpoken = true;
        };

        window.speechSynthesis.speak(utterance);
    }

    function startWelcomeVoice(){
        if(!("speechSynthesis" in window)) return;

        const voices = window.speechSynthesis.getVoices();

        if(voices.length > 0){
            speakWelcome();
        }else{
            window.speechSynthesis.onvoiceschanged = function(){
                speakWelcome();
            };
        }
    }

    window.addEventListener("load",function(){
        setTimeout(startWelcomeVoice,700);
    });

    document.addEventListener("click",startWelcomeVoice,{once:true});
    document.addEventListener("touchstart",startWelcomeVoice,{once:true,passive:true});
    document.addEventListener("keydown",startWelcomeVoice,{once:true});

})();

/* =====================================================
   แยกบัญชีข้าวสารตามงานศพ
===================================================== */

function getFuneralRecordsSeparated(){
    const list = readFunerals();
    return list.map((item,index)=>({
        id:String(item.id ?? ('funeral-'+index)),
        name:String(item.name ?? ''),
        age:item.age ?? '',
        house:String(item.house ?? ''),
        death:String(item.death ?? ''),
        cremate:String(item.cremate ?? '')
    }));
}

function getSelectedFuneralSeparated(){
    const select = document.getElementById('funeralSelect');
    if(!select || !select.value) return null;
    return getFuneralRecordsSeparated().find(item=>String(item.id)===String(select.value)) || null;
}

function populateFuneralSeparated(){
    const select = document.getElementById('funeralSelect');
    if(!select) return;
    const list = getFuneralRecordsSeparated();
    select.innerHTML = '<option value="">-- เลือกงานศพ --</option>' + list.map(item =>
        '<option value="'+escapeHTML(item.id)+'">⚰️ '+escapeHTML(item.name)+' '+(item.age?'(อายุ '+escapeHTML(item.age)+' ปี)':'')+'</option>'
    ).join('');
}

function refreshFuneralDeliverySeparated(){
    const funeral = getSelectedFuneralSeparated();
    const summary = document.getElementById('funeralDeliverySummary');
    const area = document.getElementById('memberSearchArea');
    const results = document.getElementById('memberResults');
    if(!summary || !area) return;

    if(!funeral){
        summary.style.display='none';
        area.style.display='none';
        if(results) results.innerHTML='<div class="empty">เลือกงานศพก่อน แล้วจึงค้นหาสมาชิก</div>';
        return;
    }

    const records = getDeliveryRecords().filter(record=>String(record.funeralId)===String(funeral.id));
    const households = new Set(records.map(record=>String(record.memberId))).size;
    const bags = records.reduce((sum,record)=>sum+Number(record.amount||0),0);

    summary.style.display='block';
    area.style.display='block';
    summary.innerHTML = '⚰️ <strong>'+escapeHTML(funeral.name)+'</strong>'+(funeral.age?' อายุ '+escapeHTML(funeral.age)+' ปี':'')+'<br>📅 '+escapeHTML(funeral.death||'-')+' &nbsp; 🏠 '+escapeHTML(funeral.house||'-')+'<br>✅ นำส่งแล้ว <strong>'+households+'</strong> ครัวเรือน &nbsp; 📦 รวม <strong>'+bags+'</strong> ถุง';
}

function searchMembersSeparated(){
    const input = document.getElementById('memberSearch');
    const result = document.getElementById('memberResults');
    const funeral = getSelectedFuneralSeparated();
    if(!input || !result) return;

    if(!funeral){
        result.innerHTML='<div class="empty">กรุณาเลือกงานศพก่อนค้นหาสมาชิก</div>';
        return;
    }

    const keyword = normalizeSearch(input.value);
    if(!keyword){
        result.innerHTML='<div class="empty">พิมพ์ชื่อสมาชิกหรือบ้านเลขที่เพื่อค้นหา</div>';
        return;
    }

    const members = readMembers().map((item,index)=>({id:getMemberId(item,index),name:getMemberName(item),house:getMemberHouse(item)})).filter(item=>item.name||item.house);
    const found = members.filter(member=>normalizeSearch(member.name).includes(keyword)||normalizeSearch(member.house).includes(keyword)).slice(0,20);

    if(!found.length){
        result.innerHTML='<div class="empty">❌ ไม่พบสมาชิกในทะเบียนสมาชิก<br><br>จำนวนสมาชิกที่ระบบอ่านได้: <strong>'+members.length+'</strong></div>';
        return;
    }

    const records = getDeliveryRecords().filter(record=>String(record.funeralId)===String(funeral.id));
    result.innerHTML='';

    found.forEach(member=>{
        const sent = records.some(record=>String(record.memberId)===String(member.id));
        const row = document.createElement('div');
        row.className='member-row';

        const info=document.createElement('div');
        info.className='member-info';
        info.innerHTML='<strong>👤 '+escapeHTML(member.name||'ไม่ระบุชื่อ')+'</strong><span>🏠 บ้านเลขที่ '+escapeHTML(member.house||'-')+'</span><div class="member-status '+(sent?'ok':'warn')+'">'+(sent?'✅ ส่งงานศพนี้แล้ว':'⏳ ยังไม่ได้ส่งงานศพนี้')+'</div>';

        const actions=document.createElement('div');
        actions.className='member-actions';
        const amount=document.createElement('input');
        amount.className='amount'; amount.type='number'; amount.min='1'; amount.value='1';
        const button=document.createElement('button');
        button.className='deliver-btn'; button.type='button'; button.textContent=sent?'✅ ส่งแล้ว':'✅ บันทึกส่ง';

        if(sent){
            amount.disabled=true;
            button.disabled=true;
        }else{
            button.addEventListener('click',()=>saveRiceForFuneral(member,amount.value,funeral));
        }

        actions.appendChild(amount);
        actions.appendChild(button);
        row.appendChild(info);
        row.appendChild(actions);
        result.appendChild(row);
    });
}

function saveRiceForFuneral(member,amountValue,funeral){
    const amount=Number(amountValue);
    if(!amount || amount<1){alert('กรุณาระบุจำนวนข้าวสาร');return;}

    const records=getDeliveryRecords();
    const already=records.some(record=>String(record.funeralId)===String(funeral.id)&&String(record.memberId)===String(member.id));
    if(already){alert('สมาชิกนี้ส่งข้าวสารสำหรับงานศพนี้แล้ว');searchMembersSeparated();return;}

    records.push({
        id:'rice-'+Date.now(),
        funeralId:String(funeral.id),
        funeralName:funeral.name,
        memberId:String(member.id),
        name:member.name,
        house:member.house,
        amount:amount,
        date:new Date().toLocaleDateString('th-TH'),
        timestamp:Date.now()
    });

    saveDeliveryRecords(records);
    refreshFuneralDeliverySeparated();
    searchMembersSeparated();
}

/* เปลี่ยน input/button เดิมให้ใช้ระบบใหม่โดยไม่พึ่ง event เดิม */
(function setupSeparatedFuneralDelivery(){
    const select=document.getElementById('funeralSelect');
    const open=document.getElementById('openFuneralButton');
    const input=document.getElementById('memberSearch');
    const button=document.getElementById('searchButton');

    populateFuneralSeparated();

    if(select){
        select.onchange=function(){
            if(input) input.value='';
            refreshFuneralDeliverySeparated();
        };
    }

    if(open){
        open.onclick=function(){
            if(input) input.value='';
            refreshFuneralDeliverySeparated();
        };
    }

    if(input){
        input.oninput=searchMembersSeparated;
        input.onkeydown=function(event){if(event.key==='Enter') searchMembersSeparated();};
    }

    if(button){
        button.onclick=searchMembersSeparated;
    }

    refreshFuneralDeliverySeparated();
})();

</script>
</body>
</html>
