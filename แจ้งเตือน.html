<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>แจ้งเตือนสมาชิก</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:#f3f7f0;
    color:#333;
}

.header{
    background:linear-gradient(135deg,#176b2c,#4caf50);
    color:white;
    padding:22px 15px;
    text-align:center;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.card{
    background:white;
    padding:15px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 3px 8px rgba(0,0,0,.08);
}

.number{
    font-size:28px;
    font-weight:bold;
}

.green{
    color:#228B22;
}

.yellow{
    color:#b88600;
}

.red{
    color:#c62828;
}

.member{
    background:white;
    margin-top:10px;
    padding:15px;
    border-radius:14px;
    box-shadow:0 2px 7px rgba(0,0,0,.08);
}

.member.warning{
    border-left:6px solid #b88600;
}

.member.danger{
    border-left:6px solid #c62828;
}

button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#228B22;
    color:white;
    font-size:16px;
}

.back{
    display:block;
    text-align:center;
    padding:18px;
    color:#228B22;
    text-decoration:none;
}

@media(max-width:600px){

    .summary{
        grid-template-columns:1fr 1fr 1fr;
    }

    .card{
        padding:10px 5px;
        font-size:13px;
    }

}

@media print{

    button,
    .back{
        display:none;
    }

}

</style>

</head>

<body>

<div class="header">

    <h1>🔔 แจ้งเตือนสมาชิก</h1>

    <p>กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</p>

</div>


<div class="container">


<div class="summary">

    <div class="card">

        🟢 ปกติ

        <div class="number green" id="normalCount">
            0
        </div>

        ครัวเรือน

    </div>


    <div class="card">

        🟡 ค้าง 1 ครั้ง

        <div class="number yellow" id="warningCount">
            0
        </div>

        ครัวเรือน

    </div>


    <div class="card">

        🔴 ค้าง 2 ครั้งขึ้นไป

        <div class="number red" id="dangerCount">
            0
        </div>

        ครัวเรือน

    </div>

</div>


<div class="card" style="margin-top:15px;">

    <strong>
        สมาชิกทั้งหมด
    </strong>

    <div class="number" id="totalCount">
        0
    </div>

    ครัวเรือน

</div>


<h2>
⚠️ รายชื่อที่ต้องติดตาม
</h2>

<div id="warningList"></div>


<button onclick="window.print()">
🖨️ พิมพ์รายงานแจ้งเตือน
</button>


<a class="back" href="ดัชนี.html">
← กลับหน้าหลัก
</a>


</div>


<script>

let members =
    JSON.parse(
        localStorage.getItem("members")
    ) || [];


/* นับสถานะ */

let normal = 0;

let warning = 0;

let danger = 0;


members.forEach(m => {

    const pending =
        Number(m.pending || 0);


    if(pending >= 2){

        danger++;

    }else if(pending === 1){

        warning++;

    }else{

        normal++;

    }

});


/* แสดงตัวเลข */

document.getElementById("normalCount").innerText =
    normal;

document.getElementById("warningCount").innerText =
    warning;

document.getElementById("dangerCount").innerText =
    danger;

document.getElementById("totalCount").innerText =
    members.length || 185;


/* รายชื่อที่ต้องติดตาม */

let html = "";


const pendingMembers =
    members.filter(
        m => Number(m.pending || 0) > 0
    );


if(pendingMembers.length === 0){

    html = `

        <div class="card">

            ✅ ยังไม่มีสมาชิกค้างส่ง

        </div>

    `;

}else{

    pendingMembers.forEach((m,index)=>{

        const pending =
            Number(m.pending || 0);


        if(pending >= 2){

            html += `

                <div class="member danger">

                    <strong>
                        ${index + 1}. ${m.name}
                    </strong>

                    <br>

                    🏠 บ้านเลขที่:
                    ${m.house}

                    <br>

                    📦 ค้างส่ง:
                    ${pending} งาน

                    <br>

                    ⚰️ งานศพที่ค้าง:
                    ${m.pendingFor || "-"}

                    <br><br>

                    <strong class="red">
                        🔴 เสนอพิจารณาตัดสมาชิก
                    </strong>

                </div>

            `;

        }else{

            html += `

                <div class="member warning">

                    <strong>
                        ${index + 1}. ${m.name}
                    </strong>

                    <br>

                    🏠 บ้านเลขที่:
                    ${m.house}

                    <br>

                    📦 ค้างส่ง:
                    ${pending} งาน

                    <br>

                    ⚰️ งานศพที่ค้าง:
                    ${m.pendingFor || "-"}

                    <br><br>

                    <strong class="yellow">
                        🟡 แจ้งเตือน 1 ครั้ง
                    </strong>

                </div>

            `;

        }

    });

}


document.getElementById("warningList").innerHTML =
    html;

</script>

</body>

</html>
