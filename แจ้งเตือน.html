<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>แจ้งเตือนสมาชิก</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:#f3f7f0;
    color:#333;
}

.header{
    background:linear-gradient(135deg,#176b2c,#4caf50);
    color:white;
    padding:22px 15px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.summary{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
}

.card{
    background:white;
    padding:15px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 3px 8px rgba(0,0,0,.08);
}

.number{
    font-size:28px;
    font-weight:bold;
}

.green{
    color:#228B22;
}

.yellow{
    color:#b88600;
}

.red{
    color:#c62828;
}

.member{
    background:white;
    margin-top:12px;
    padding:16px;
    border-radius:14px;
    box-shadow:0 2px 7px rgba(0,0,0,.08);
    border-left:6px solid #b88600;
}

.member.danger{
    border-left-color:#c62828;
    background:#fff5f5;
}

.member.ok{
    border-left-color:#228B22;
    background:#f5fff5;
}

.status-warning{
    color:#b88600;
    font-weight:bold;
}

.status-danger{
    color:#c62828;
    font-weight:bold;
}

.status-ok{
    color:#228B22;
    font-weight:bold;
}

.notice{
    padding:15px;
    margin-top:15px;
    border-radius:12px;
}

.notice-warning{
    background:#fff3cd;
    color:#856404;
}

.notice-danger{
    background:#ffe5e5;
    color:#c62828;
}

.notice-success{
    background:#e8f7e8;
    color:#1b7a1b;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#228B22;
    color:white;
    font-size:16px;
}

.back{
    display:block;
    text-align:center;
    padding:18px;
    color:#228B22;
    text-decoration:none;
}

hr{
    border:0;
    border-top:1px solid #ddd;
    margin:12px 0;
}

@media(max-width:600px){

    .summary{
        grid-template-columns:1fr 1fr 1fr;
    }

    .card{
        padding:10px 5px;
        font-size:13px;
    }

    .number{
        font-size:22px;
    }

}

@media print{

    button,
    .back{
        display:none;
    }

    body{
        background:white;
    }

    .header{
        background:white;
        color:#333;
        border-bottom:2px solid #333;
    }

}

</style>

</head>

<body>


<div class="header">

<h1>🔔 แจ้งเตือนสมาชิก</h1>

<p>กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</p>

</div>


<div class="container">


<!-- สรุป -->

<div class="summary">


<div class="card">

🟢 ปกติ

<div
    class="number green"
    id="normalCount"
>
0
</div>

ครัวเรือน

</div>


<div class="card">

🟡 ค้าง 1 ครั้ง

<div
    class="number yellow"
    id="warningCount"
>
0
</div>

ครัวเรือน

</div>


<div class="card">

🔴 ค้าง 2 ครั้งขึ้นไป

<div
    class="number red"
    id="dangerCount"
>
0
</div>

ครัวเรือน

</div>


</div>


<div class="card" style="margin-top:15px;">

👥 สมาชิกทั้งหมด

<div
    class="number"
    id="totalCount"
>
185
</div>

ครัวเรือน

</div>


<div id="summaryNotice"></div>


<!-- ค้างส่ง -->

<div class="card" style="margin-top:15px;">

<h2>
⚠️ สมาชิกที่ต้องติดตาม
</h2>

<div id="pendingList"></div>

</div>


<!-- ปุ่ม -->

<button onclick="window.print()">

🖨️ พิมพ์รายงานแจ้งเตือน

</button>


<a
    class="back"
    href="index.html"
>
← กลับหน้าหลัก
</a>


</div>


<script>

/* =====================================================
   โหลดข้อมูล
===================================================== */

const members =
    JSON.parse(
        localStorage.getItem("members")
    ) || [];


/* =====================================================
   จำนวนสถานะ
===================================================== */

let normalCount = 0;

let warningCount = 0;

let dangerCount = 0;


members.forEach(member => {

    const pending =
        Number(member.pending || 0);


    if(pending >= 2){

        dangerCount++;

    }else if(pending === 1){

        warningCount++;

    }else{

        normalCount++;

    }

});


/* =====================================================
   แสดงสรุป
===================================================== */

document.getElementById("normalCount")
    .innerText =
    normalCount;


document.getElementById("warningCount")
    .innerText =
    warningCount;


document.getElementById("dangerCount")
    .innerText =
    dangerCount;


document.getElementById("totalCount")
    .innerText =
    members.length > 0
    ? members.length
    : 185;


/* =====================================================
   แจ้งเตือนด้านบน
===================================================== */

if(dangerCount > 0){

    document.getElementById("summaryNotice")
        .innerHTML = `

        <div class="notice notice-danger">

            🚨 มี
            <strong>
                ${dangerCount}
            </strong>
            ครัวเรือน

            <br>

            ค้างส่งข้าวสารช่วยงานศพ
            2 ครั้งขึ้นไป

            <br>

            🔴 สถานะ:
            <strong>
                เสนอพิจารณาตัดสมาชิก
            </strong>

        </div>

        `;

}else if(warningCount > 0){

    document.getElementById("summaryNotice")
        .innerHTML = `

        <div class="notice notice-warning">

            ⚠️ มี
            <strong>
                ${warningCount}
            </strong>
            ครัวเรือน

            <br>

            ค้างส่งข้าวสารช่วยงานศพ
            1 ครั้ง

        </div>

        `;

}else{

    document.getElementById("summaryNotice")
        .innerHTML = `

        <div class="notice notice-success">

            ✅ ยังไม่มีสมาชิกค้างส่ง

        </div>

        `;

}


/* =====================================================
   รายชื่อค้างส่ง
===================================================== */

const pendingMembers =
    members.filter(
        member =>
        Number(member.pending || 0) > 0
    );


let html = "";


if(pendingMembers.length === 0){

    html = `

        <div class="notice notice-success">

            ✅ สมาชิกทุกครัวเรือนปฏิบัติตามกติกาครบถ้วน

        </div>

    `;

}else{


    pendingMembers.forEach((member,index)=>{

        const pending =
            Number(member.pending || 0);


        const isDanger =
            pending >= 2;


        const cardClass =
            isDanger
            ? "member danger"
            : "member";


        const status =
            isDanger
            ? "🔴 เสนอพิจารณาตัดสมาชิก"
            : "🟡 แจ้งเตือน 1 ครั้ง";


        const statusClass =
            isDanger
            ? "status-danger"
            : "status-warning";


        html += `

        <div class="${cardClass}">

            <strong>

                ${index + 1}.
                ${escapeHTML(member.name)}

            </strong>

            <br>

            🏠 บ้านเลขที่:
            ${escapeHTML(member.house)}

            <hr>

            📦 ค้างส่ง:
            <strong>
                ${pending}
            </strong>
            ครั้ง

            <br><br>

            ${
                member.pendingFor
                ?
                `
                ⚰️ ค้างส่งงานศพ:
                <strong>
                    ${escapeHTML(
                        member.pendingFor
                    )}
                </strong>

                <br><br>
                `
                :
                `
                ⚰️ ค้างส่งงานศพ:
                ไม่ระบุ

                <br><br>
                `
            }

            <span class="${statusClass}">

                ${status}

            </span>

        </div>

        `;

    });

}


document.getElementById("pendingList")
    .innerHTML =
    html;


/* =====================================================
   ป้องกัน HTML
===================================================== */

function escapeHTML(value){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

</script>

</body>

</html>
