<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบงานศพ กลุ่มข้าวสาร</title>

<style>

body{
font-family:Tahoma,sans-serif;
margin:0;
background:#f3f7f0;
}

.header{
background:#555;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:15px;
}

input,button{
width:100%;
padding:12px;
margin:5px 0;
border-radius:10px;
font-size:16px;
}

input{
border:1px solid #ccc;
}

button{
background:#228B22;
color:white;
border:none;
}

.card{
background:white;
padding:15px;
margin-top:10px;
border-radius:15px;
box-shadow:0 3px 8px #ddd;
}

.status{
font-weight:bold;
color:#228B22;
}

</style>

</head>


<body>


<div class="header">

<h2>
⚰️ แจ้งเสียชีวิต / งานศพ
</h2>

<p>
กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6
</p>

</div>



<div class="container">


<input id="name"
placeholder="ชื่อผู้เสียชีวิต">


<input id="age"
placeholder="อายุ (ปี)">



<input id="house"
placeholder="บ้านเลขที่">



<label>
วันที่เสียชีวิต
</label>

<input id="dead"
type="date">



<label>
วันที่ฌาปนกิจ
</label>

<input id="burn"
type="date">



<input id="temple"
placeholder="วัดที่จัดงาน">



<button onclick="saveFuneral()">

➕ บันทึกงานศพ

</button>



<h3>
รายการงานศพ
</h3>


<div id="list"></div>



</div>



<script>


let funeral =
JSON.parse(localStorage.getItem("funeral")) || [];



function show(){


let html="";


funeral.forEach((f,i)=>{


html += `

<div class="card">

<b>
⚰️ ศพ ${f.name}
</b>

<br>

อายุ ${f.age} ปี

<br>

บ้านเลขที่ ${f.house}

<br>

วัด ${f.temple}

<br>

วันที่เสียชีวิต ${f.dead}

<br>

วันที่ฌาปนกิจ ${f.burn}

<br><br>


<span class="status">

🌾 รอจัดส่งข้าวสารช่วยงาน

</span>


</div>

`;

});


document.getElementById("list").innerHTML=html;


}



function saveFuneral(){


let data={

name:
document.getElementById("name").value,

age:
document.getElementById("age").value,

house:
document.getElementById("house").value,

dead:
document.getElementById("dead").value,

burn:
document.getElementById("burn").value,

temple:
document.getElementById("temple").value

};


funeral.push(data);


localStorage.setItem(

"funeral",

JSON.stringify(funeral)

);


alert("บันทึกงานศพแล้ว");


show();

}



show();


</script>


</body>

</html>
