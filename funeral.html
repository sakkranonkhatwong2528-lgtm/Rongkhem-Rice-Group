<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>แจ้งเสียชีวิต / งานศพ</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:#f3f7f0;
    color:#333;
}

.header{
    background:linear-gradient(135deg,#555,#777);
    color:white;
    padding:22px 15px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.box{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:16px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:13px;
    margin:6px 0;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:0;
    border-radius:10px;
    color:white;
    background:#228B22;
    font-size:16px;
}

button.red{
    background:#c62828;
}

button.blue{
    background:#1976d2;
}

.summary{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
}

.summary-card{
    background:#f8fff8;
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.number{
    font-size:26px;
    font-weight:bold;
    color:#228B22;
}

.warning-number{
    color:#c62828;
}

.funeral-card{
    background:#fafafa;
    padding:15px;
    margin-top:10px;
    border-radius:12px;
    border-left:5px solid #555;
}

.member-card{
    background:white;
    padding:14px;
    margin-top:10px;
    border-radius:12px;
    border-left:5px solid #228B22;
}

.sent{
    background:#f1fff1;
    border-left-color:#228B22;
}

.not-sent{
    background:#fff5f5;
    border-left-color:#c62828;
}

.success{
    background:#e8f7e8;
    color:#1b7a1b;
    padding:14px;
    border-radius:12px;
}

.warning{
    background:#fff3cd;
    color:#856404;
    padding:14px;
    border-radius:12px;
}

.danger{
    background:#ffe5e5;
    color:#c62828;
    padding:14px;
    border-radius:12px;
}

.back{
    display:block;
    text-align:center;
    padding:15px;
    text-decoration:none;
    color:#228B22;
}

@media(max-width:600px){

    .summary{
        grid-template-columns:1fr 1fr 1fr;
    }

    .summary-card{
        font-size:13px;
        padding:10px 5px;
    }

    .number{
        font-size:22px;
    }

}

</style>

</head>

<body>


<div class="header">

<h1>⚰️ แจ้งเสียชีวิต / งานศพ</h1>

<p>
กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6
</p>

</div>


<div class="container">


<!-- =============================
     เพิ่มงานศพ
============================= -->

<div class="box">

<h2>➕ แจ้งงานศพ</h2>

<input
    id="name"
    placeholder="ชื่อ-นามสกุลผู้เสียชีวิต"
>

<input
    id="age"
    type="number"
    placeholder="อายุ (ปี)"
>

<input
    id="house"
    placeholder="บ้านเลขที่"
>

<label>วันที่เสียชีวิต</label>

<input
    id="deadDate"
    type="date"
>

<label>วันที่ฌาปนกิจ</label>

<input
    id="burnDate"
    type="date"
>

<input
    id="temple"
    placeholder="วัดที่จัดงาน"
>

<button onclick="addFuneral()">

💾 บันทึกงานศพ

</button>

</div>


<!-- =============================
     รายการงานศพ
============================= -->

<div class="box">

<h2>⚰️ รายการงานศพ</h2>

<div id="funeralList"></div>

</div>


<!-- =============================
     สมาชิกช่วยงาน
============================= -->

<div class="box">

<h2>🌾 การส่งข้าวสารช่วยงานศพ</h2>

<div id="selectedFuneral"></div>

<div id="summary"></div>

<div id="memberList">

กรุณาเลือกงานศพ

</div>

</div>


<!-- =============================
     แจ้งเตือน
============================= -->

<div class="box">

<h2>🔔 สมาชิกที่ยังไม่ส่ง</h2>

<div id="pendingList">

กรุณาเลือกงานศพ

</div>

</div>


<a
    class="back"
    href="index.html"
>
← กลับหน้าหลัก
</a>


</div>


<script>

/* =====================================================
   โหลดข้อมูล
===================================================== */

let members =
    JSON.parse(
        localStorage.getItem("members")
    ) || [];


let funerals =
    JSON.parse(
        localStorage.getItem("funerals")
    ) || [];


let funeralSends =
    JSON.parse(
        localStorage.getItem("funeralSends")
    ) || [];


let selectedFuneralId =
    localStorage.getItem("selectedFuneralId") || "";


/* =====================================================
   เตรียมสมาชิก
===================================================== */

members = members.map((m,index)=>({

    id:
        m.id ||
        "member-" +
        Date.now() +
        "-" +
        index,

    name:
        m.name || "",

    house:
        m.house || "",

    pending:
        Number(m.pending || 0),

    pendingFor:
        m.pendingFor || "",

    status:
        m.status || "ปกติ"

}));


saveMembers();


function saveMembers(){

    localStorage.setItem(
        "members",
        JSON.stringify(members)
    );

}


/* =====================================================
   บันทึกงานศพ
===================================================== */

function addFuneral(){

    const name =
        document.getElementById("name")
        .value
        .trim();


    const age =
        document.getElementById("age")
        .value
        .trim();


    const house =
        document.getElementById("house")
        .value
        .trim();


    const deadDate =
        document.getElementById("deadDate")
        .value;


    const burnDate =
        document.getElementById("burnDate")
        .value;


    const temple =
        document.getElementById("temple")
        .value
        .trim();


    if(!name){

        alert(
            "กรุณากรอกชื่อผู้เสียชีวิต"
        );

        return;

    }


    const funeral = {

        id:Date.now(),

        name:name,

        age:age,

        house:house,

        deadDate:deadDate,

        burnDate:burnDate,

        temple:temple,

        closed:false,

        createdAt:
            new Date()
            .toLocaleDateString("th-TH")

    };


    funerals.push(funeral);


    localStorage.setItem(
        "funerals",
        JSON.stringify(funerals)
    );


    selectedFuneralId =
        String(funeral.id);


    localStorage.setItem(
        "selectedFuneralId",
        selectedFuneralId
    );


    clearFuneralForm();


    showFunerals();

    showSelectedFuneral();

    showMembers();

    showPending();


    alert(
        "บันทึกงานศพเรียบร้อยแล้ว"
    );

}


/* =====================================================
   ล้างแบบฟอร์ม
===================================================== */

function clearFuneralForm(){

    document.getElementById("name").value = "";

    document.getElementById("age").value = "";

    document.getElementById("house").value = "";

    document.getElementById("deadDate").value = "";

    document.getElementById("burnDate").value = "";

    document.getElementById("temple").value = "";

}


/* =====================================================
   แสดงงานศพ
===================================================== */

function showFunerals(){

    let html = "";


    if(funerals.length === 0){

        html = `
            <div class="warning">
                ยังไม่มีงานศพในระบบ
            </div>
        `;

    }else{

        funerals.forEach(f=>{

            html += `

            <div class="funeral-card">

                <strong>
                    ⚰️ ${escapeHTML(f.name)}
                </strong>

                <br>

                👤 อายุ:
                ${escapeHTML(f.age || "-")} ปี

                <br>

                🏠 บ้านเลขที่:
                ${escapeHTML(f.house || "-")}

                <br>

                📅 เสียชีวิต:
                ${formatDate(f.deadDate)}

                <br>

                🔥 ฌาปนกิจ:
                ${formatDate(f.burnDate)}

                <br>

                🛕 วัด:
                ${escapeHTML(f.temple || "-")}

                <br><br>

                ${
                    f.closed
                    ?
                    `
                    <strong>
                        ✅ ปิดงานแล้ว
                    </strong>
                    `
                    :
                    `
                    <strong>
                        🟡 อยู่ระหว่างดำเนินการ
                    </strong>
                    `
                }


                <button
                    class="blue"
                    onclick="
                        selectFuneral(
                            '${f.id}'
                        )
                    "
                >

                    🌾 จัดการส่งข้าวสาร

                </button>


                ${
                    !f.closed
                    ?
                    `
                    <button
                        class="red"
                        onclick="
                            closeFuneral(
                                '${f.id}'
                            )
                        "
                    >

                        🔒 ปิดงานศพ
                        และบันทึกผู้ค้างส่ง

                    </button>
                    `
                    :
                    ""
                }

            </div>

            `;

        });

    }


    document.getElementById("funeralList")
        .innerHTML =
        html;

}


/* =====================================================
   เลือกงานศพ
===================================================== */

function selectFuneral(id){

    selectedFuneralId =
        String(id);


    localStorage.setItem(
        "selectedFuneralId",
        selectedFuneralId
    );


    showSelectedFuneral();

    showMembers();

    showPending();

}


/* =====================================================
   แสดงงานศพที่เลือก
===================================================== */

function showSelectedFuneral(){

    const funeral =
        funerals.find(
            f =>
            String(f.id) ===
            String(selectedFuneralId)
        );


    if(!funeral){

        document.getElementById(
            "selectedFuneral"
        ).innerHTML =
            "กรุณาเลือกงานศพ";

        return;

    }


    document.getElementById(
        "selectedFuneral"
    ).innerHTML = `

        <div class="success">

            ⚰️ งานศพ:
            <strong>
                ${escapeHTML(
                    funeral.name
                )}
            </strong>

            <br>

            🌾 สมาชิก 1 ครัวเรือน
            = ข้าวสาร 1 ถุง

        </div>

    `;

}


/* =====================================================
   แสดงสมาชิก
===================================================== */

function showMembers(){

    if(!selectedFuneralId){

        document.getElementById(
            "memberList"
        ).innerHTML =
            "กรุณาเลือกงานศพ";

        return;

    }


    const funeral =
        funerals.find(
            f =>
            String(f.id) ===
            String(selectedFuneralId)
        );


    if(!funeral){

        return;

    }


    let sentCount = 0;

    let notSentCount = 0;

    let html = "";


    members.forEach((m,index)=>{


        const alreadySent =
            funeralSends.some(
                s =>
                String(s.funeralId) ===
                String(funeral.id)
                &&
                String(s.memberHouse) ===
                String(m.house)
            );


        if(alreadySent){

            sentCount++;


            html += `

            <div class="member-card sent">

                <strong>
                    ${index + 1}.
                    ${escapeHTML(m.name)}
                </strong>

                <br>

                🏠 บ้านเลขที่:
                ${escapeHTML(m.house)}

                <br>

                ✅ ส่งแล้ว 1 ถุง

            </div>

            `;

        }else{

            notSentCount++;


            html += `

            <div class="member-card not-sent">

                <strong>
                    ${index + 1}.
                    ${escapeHTML(m.name)}
                </strong>

                <br>

                🏠 บ้านเลขที่:
                ${escapeHTML(m.house)}

                <br>

                ⏳ ยังไม่ส่ง

                <button
                    onclick="
                        sendRice(
                            '${funeral.id}',
                            '${escapeAttribute(m.id)}'
                        )
                    "
                >

                    🌾 ส่งข้าวสาร 1 ถุง

                </button>

            </div>

            `;

        }

    });


    document.getElementById("memberList")
        .innerHTML =
        html;


    document.getElementById("summary")
        .innerHTML = `

        <div class="summary">

            <div class="summary-card">

                👥 สมาชิก

                <div class="number">
                    ${members.length}
                </div>

                ครัวเรือน

            </div>


            <div class="summary-card">

                ✅ ส่งแล้ว

                <div class="number">
                    ${sentCount}
                </div>

                ถุง

            </div>


            <div class="summary-card">

                ⚠️ ยังไม่ส่ง

                <div
                    class="number warning-number"
                >
                    ${notSentCount}
                </div>

                ครัวเรือน

            </div>

        </div>

    `;

}


/* =====================================================
   ส่งข้าวสาร
===================================================== */

function sendRice(
    funeralId,
    memberId
){

    const funeral =
        funerals.find(
            f =>
            String(f.id) ===
            String(funeralId)
        );


    const member =
        members.find(
            m =>
            String(m.id) ===
            String(memberId)
        );


    if(!funeral || !member){

        alert(
            "ไม่พบข้อมูล"
        );

        return;

    }


    const exists =
        funeralSends.some(
            s =>
            String(s.funeralId) ===
            String(funeralId)
            &&
            String(s.memberId) ===
            String(memberId)
        );


    if(exists){

        alert(
            "สมาชิกบ้านนี้ส่งข้าวสารแล้ว"
        );

        return;

    }


    funeralSends.push({

        id:Date.now(),

        funeralId:
            String(funeralId),

        memberId:
            String(memberId),

        memberName:
            member.name,

        memberHouse:
            member.house,

        amount:1,

        date:
            new Date()
            .toLocaleDateString("th-TH")

    });


    localStorage.setItem(
        "funeralSends",
        JSON.stringify(funeralSends)
    );


    showMembers();

    showPending();

    showFunerals();


    alert(
        member.name +
        "\nส่งข้าวสาร 1 ถุงเรียบร้อยแล้ว"
    );

}


/* =====================================================
   ปิดงานศพ
===================================================== */

function closeFuneral(id){

    const funeral =
        funerals.find(
            f =>
            String(f.id) ===
            String(id)
        );


    if(!funeral){

        alert(
            "ไม่พบงานศพ"
        );

        return;

    }


    if(funeral.closed){

        alert(
            "งานศพนี้ปิดแล้ว"
        );

        return;

    }


    const notSent =
        members.filter(
            member =>
            !funeralSends.some(
                send =>
                String(send.funeralId) ===
                String(funeral.id)
                &&
                String(send.memberId) ===
                String(member.id)
            )
        );


    const confirmClose =
        confirm(
            "ปิดงานศพนี้หรือไม่?\n\n" +
            "ผู้เสียชีวิต: " +
            funeral.name +
            "\n" +
            "ส่งแล้ว: " +
            (
                members.length -
                notSent.length
            ) +
            " ครัวเรือน\n" +
            "ยังไม่ส่ง: " +
            notSent.length +
            " ครัวเรือน"
        );


    if(!confirmClose){

        return;

    }


    /* ============================================
       เพิ่มค้างส่งเฉพาะคนที่ยังไม่ส่ง
    ============================================ */

    notSent.forEach(member=>{

        member.pending =
            Number(member.pending || 0)
            + 1;


        member.pendingFor =
            funeral.name;


        if(member.pending >= 2){

            member.status =
                "เสนอพิจารณาตัดสมาชิก";

        }else{

            member.status =
                "แจ้งเตือน 1 ครั้ง";

        }

    });


    /* ปิดงาน */

    funeral.closed = true;

    funeral.closedDate =
        new Date()
        .toLocaleDateString("th-TH");


    saveMembers();


    localStorage.setItem(
        "funerals",
        JSON.stringify(funerals)
    );


    showFunerals();

    showSelectedFuneral();

    showMembers();

    showPending();


    alert(
        "ปิดงานศพเรียบร้อยแล้ว\n\n" +
        "บันทึกผู้ค้างส่ง " +
        notSent.length +
        " ครัวเรือน"
    );

}


/* =====================================================
   แสดงผู้ค้างส่ง
===================================================== */

function showPending(){

    if(!selectedFuneralId){

        document.getElementById(
            "pendingList"
        ).innerHTML =
            "กรุณาเลือกงานศพ";

        return;

    }


    const funeral =
        funerals.find(
            f =>
            String(f.id) ===
            String(selectedFuneralId)
        );


    if(!funeral){

        return;

    }


    const pending =
        members.filter(
            member =>
            !funeralSends.some(
                send =>
                String(send.funeralId) ===
                String(funeral.id)
                &&
                String(send.memberId) ===
                String(member.id)
            )
        );


    if(pending.length === 0){

        document.getElementById(
            "pendingList"
        ).innerHTML = `

            <div class="success">

                ✅ ทุกครัวเรือนส่งข้าวสารครบแล้ว

            </div>

        `;

        return;

    }


    let html = `

        <div class="warning">

            ⚠️ งานศพนี้มี
            <strong>
                ${pending.length}
            </strong>
            ครัวเรือนยังไม่ส่ง

        </div>

    `;


    pending.forEach((member,index)=>{

        const count =
            Number(
                member.pending || 0
            );


        html += `

        <div class="
            member-card
            not-sent
        ">

            <strong>

                ${index + 1}.
                ${escapeHTML(
                    member.name
                )}

            </strong>

            <br>

            🏠 บ้านเลขที่:
            ${escapeHTML(
                member.house
            )}

            <br>

            📦 ค้างส่งเดิม:
            ${count} ครั้ง

        </div>

        `;

    });


    document.getElementById(
        "pendingList"
    ).innerHTML =
        html;

}


/* =====================================================
   วันที่
===================================================== */

function formatDate(value){

    if(!value){

        return "-";

    }


    const part =
        String(value).split("-");


    if(part.length !== 3){

        return value;

    }


    return (
        part[2] +
        "/" +
        part[1] +
        "/" +
        part[0]
    );

}


/* =====================================================
   ป้องกัน HTML
===================================================== */

function escapeHTML(value){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(value){

    return String(
        value || ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}


/* =====================================================
   เริ่มระบบ
===================================================== */

showFunerals();

showSelectedFuneral();

showMembers();

showPending();

</script>

</body>

</html>
