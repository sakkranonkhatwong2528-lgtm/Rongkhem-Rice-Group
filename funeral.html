<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการงานศพ</title>

<style>

body{
margin:0;
font-family:Tahoma,sans-serif;
background:#f4f7f4;
}

.header{
background:#198754;
color:#fff;
padding:20px;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:10px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#198754;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#157347;
}

.funeral{
padding:15px;
margin-top:15px;
border-left:6px solid #198754;
background:#f8fff8;
border-radius:10px;
}

.summary{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:15px;
}

.box{
background:#ffffff;
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.number{
font-size:30px;
font-weight:bold;
color:#198754;
}

</style>

</head>

<body>

<div class="header">

<h1>⚰️ ระบบจัดการงานศพ</h1>

<p>กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</p>

</div>

<div class="container">

<div class="card">

<h2>เพิ่มงานศพ</h2>

<input id="deadName" placeholder="ชื่อผู้เสียชีวิต">

<input id="deadDate" type="date">

<input id="burnDate" type="date">

<input id="place" placeholder="สถานที่">

<button onclick="saveFuneral()">

💾 บันทึกงานศพ

</button>

</div>

<div class="summary">

<div class="box">

สมาชิกทั้งหมด

<div class="number" id="memberTotal">0</div>

</div>

<div class="box">

รับแล้ว

<div class="number" id="receivedTotal">0</div>

</div>

<div class="box">

ค้างส่ง

<div class="number" id="pendingTotal">0</div>

</div>

</div>

<div id="funeralList"></div>

</div>

<script>

let funerals =
JSON.parse(localStorage.getItem("funerals")) || [];

let members =
JSON.parse(localStorage.getItem("members")) || [];

showFuneral();

function saveFuneral(){

let deadName =
document.getElementById("deadName").value.trim();

if(deadName==""){

alert("กรุณากรอกชื่อผู้เสียชีวิต");

return;

}

funerals.unshift({

id:Date.now(),

name:deadName,

deadDate:
document.getElementById("deadDate").value,

burnDate:
document.getElementById("burnDate").value,

place:
document.getElementById("place").value,

received:[]

});

localStorage.setItem(
"funerals",
JSON.stringify(funerals)
);

showFuneral();

}
    function showFuneral(){

let html="";

document.getElementById("memberTotal").innerHTML=members.length;

if(funerals.length==0){

document.getElementById("receivedTotal").innerHTML=0;
document.getElementById("pendingTotal").innerHTML=members.length;

document.getElementById("funeralList").innerHTML=
"<div class='card'>ยังไม่มีงานศพ</div>";

return;

}

let funeral=funerals[0];

let received=funeral.received||[];

document.getElementById("receivedTotal").innerHTML=received.length;

document.getElementById("pendingTotal").innerHTML=
members.length-received.length;

html+=`

<div class="card">

<h2>⚰️ ${funeral.name}</h2>

<p>เสียชีวิต : ${funeral.deadDate||"-"}</p>

<p>ฌาปนกิจ : ${funeral.burnDate||"-"}</p>

<p>สถานที่ : ${funeral.place||"-"}</p>

<hr>

<h3>รายชื่อสมาชิก</h3>

`;

members.forEach(member=>{

let ok=received.find(r=>r.memberId==member.id);

html+=`

<div class="funeral">

<b>${member.house}</b>

${member.name}

<br><br>

${
ok?

"<button style='background:#0d6efd'>✅ รับแล้ว</button>"

:

`<button onclick="receiveRice(${funeral.id},'${member.id}')">

🌾 รับข้าวสาร

</button>`

}

</div>

`;

});

html+="</div>";

document.getElementById("funeralList").innerHTML=html;

}

function receiveRice(funeralId,memberId){

let funeral=

funerals.find(f=>f.id==funeralId);

if(!funeral)return;

if(!funeral.received)

funeral.received=[];

let exists=

funeral.received.find(r=>r.memberId==memberId);

if(exists){

alert("สมาชิกคนนี้รับแล้ว");

return;

}

funeral.received.push({

memberId:memberId,

date:new Date().toLocaleString("th-TH")

});

localStorage.setItem(

"funerals",

JSON.stringify(funerals)

);

showFuneral();

}

showFuneral();

</script>

</body>

</html>
