<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการข้อมูลงานศพ - กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</title>
  <style>
    body { font-family: 'Sarabun', sans-serif; background: #f4f7f6; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 900px; margin: auto; }
    .header { background: #2c3e50; color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
    
    .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }

    .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; display: inline-block; }
    .btn-save { background: #27ae60; color: white; width: 100%; }
    .btn-save:hover { background: #219150; }
    .btn-delete { background: #e74c3c; color: white; padding: 6px 12px; font-size: 13px; }
    .btn-delete:hover { background: #c0392b; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; overflow-x: auto; display: block; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; white-space: nowrap; }
    th { background: #f8f9fa; color: #2c3e50; }

    .btn-back { display: block; text-align: center; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 style="margin:0;">⚰️ จัดการข้อมูลงานศพ</h2>
    <small>กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</small>
  </div>

  <!-- ฟอร์มเพิ่มงานศพใหม่ -->
  <div class="card">
    <h3>➕ บันทึกข้อมูลงานศพใหม่</h3>
    <form id="funeralForm" onsubmit="saveFuneral(event)">
      <div class="form-group">
        <label>ชื่อ - นามสกุล ผู้เสียชีวิต:</label>
        <input type="text" id="name" required placeholder="เช่น นายเกษมสุข ใฝ่ใจ">
      </div>
      <div class="form-group">
        <label>อายุ (ปี):</label>
        <input type="number" id="age" required placeholder="เช่น 47">
      </div>
      <div class="form-group">
        <label>วันเสียชีวิต:</label>
        <input type="date" id="deathDate" required>
      </div>
      <div class="form-group">
        <label>สถานที่จัดงาน / วัด:</label>
        <input type="text" id="location" placeholder="เช่น วัดร่องเข็ม หรือ บ้านเลขที่ 123" required>
      </div>
      <div class="form-group">
        <label>กำหนดการฌาปนกิจ (วันเผา):</label>
        <input type="date" id="cremationDate" required>
      </div>
      <button type="submit" class="btn btn-save">💾 บันทึกข้อมูลงานศพ</button>
    </form>
  </div>

  <!-- ตารางแสดงประวัติงานศพ -->
  <div class="card">
    <h3>📋 ประวัติงานศพทั้งหมด</h3>
    <table id="funeralTable">
      <thead>
        <tr>
          <th>ลำดับ</th>
          <th>ชื่อ - นามสกุล</th>
          <th>อายุ</th>
          <th>วันเสียชีวิต</th>
          <th>สถานที่</th>
          <th>วันฌาปนกิจ</th>
          <th>จัดการ</th>
        </tr>
      </thead>
      <tbody>
        <!-- ข้อมูลจะถูกแสดงผ่าน JavaScript -->
      </tbody>
    </table>
  </div>

  <a href="dashboard.html" class="btn-back">⬅️ กลับหน้าหลัก</a>
</div>

<script>
// ข้อมูลเริ่มต้นสำหรับทดสอบระบบ
const defaultList = [
  { name: "นายบูรณพิภพ ผัดดี", age: "27", deathDate: "2026-07-03", location: "บ้านเลขที่ 123", cremationDate: "2026-07-05" },
  { name: "นายเกษมสุข ใฝ่ใจ", age: "47", deathDate: "2026-07-22", location: "วัดร่องเข็ม", cremationDate: "2026-07-25" }
];

// แปลงวันที่ YYYY-MM-DD เป็นวันที่ไทย
function formatDateTh(dateStr) {
  if (!dateStr || dateStr === 'undefined') return '-';
  const monthsTh = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  return `${d.getDate()} ${monthsTh[d.getMonth()]} ${d.getFullYear() + 543}`;
}

// วาดตารางแสดงรายการงานศพ
function renderFuneralTable() {
  let funeralList = JSON.parse(localStorage.getItem('funeralList'));
  
  // ถ้าเปิดครั้งแรกและไม่มีข้อมูล ให้ใส่ข้อมูลเริ่มต้น
  if (!funeralList) {
    funeralList = defaultList;
    localStorage.setItem('funeralList', JSON.stringify(funeralList));
  }

  const tbody = document.querySelector("#funeralTable tbody");
  tbody.innerHTML = "";

  if (funeralList.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#999;">ไม่มีข้อมูลงานศพ</td></tr>';
    return;
  }

  funeralList.forEach((item, index) => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${index + 1}</td>
      <td><strong>${item.name || '-'}</strong></td>
      <td>${item.age ? item.age + ' ปี' : '-'}</td>
      <td>${formatDateTh(item.deathDate)}</td>
      <td>${item.location || '-'}</td>
      <td>${formatDateTh(item.cremationDate)}</td>
      <td>
        <button class="btn btn-delete" onclick="deleteFuneral(${index})">🗑️ ลบ</button>
      </td>
    `;
    tbody.appendChild(row);
  });
}

// บันทึกข้อมูลงานศพใหม่
function saveFuneral(e) {
  e.preventDefault();
  
  const name = document.getElementById("name").value.trim();
  const age = document.getElementById("age").value;
  const deathDate = document.getElementById("deathDate").value;
  const location = document.getElementById("location").value.trim();
  const cremationDate = document.getElementById("cremationDate").value;

  if (!name || !age || !deathDate || !cremationDate) {
    alert("กรุณากรอกข้อมูลให้ครบถ้วนก่อนบันทึก!");
    return;
  }

  const newItem = { name, age, deathDate, location, cremationDate };
  let funeralList = JSON.parse(localStorage.getItem('funeralList')) || [];
  
  funeralList.push(newItem);
  localStorage.setItem('funeralList', JSON.stringify(funeralList));

  alert("บันทึกข้อมูลงานศพเรียบร้อยแล้ว!");
  document.getElementById("funeralForm").reset();
  renderFuneralTable();
}

// ฟังก์ชันลบรายการ (กดลบได้แน่นอน 100%)
function deleteFuneral(index) {
  let funeralList = JSON.parse(localStorage.getItem('funeralList')) || [];
  const targetName = funeralList[index] ? funeralList[index].name : "รายการนี้";

  if (confirm(`คุณต้องการลบข้อมูลงานศพของ "${targetName}" ใช่หรือไม่?`)) {
    funeralList.splice(index, 1);
    localStorage.setItem('funeralList', JSON.stringify(funeralList));
    renderFuneralTable();
    alert("ลบข้อมูลเรียบร้อยแล้ว!");
  }
}

// โหลดตารางเมื่อเปิดหน้าเว็บ
document.addEventListener("DOMContentLoaded", renderFuneralTable);
</script>

</body>
</html>
