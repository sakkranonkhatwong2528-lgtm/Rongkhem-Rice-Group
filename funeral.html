<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
⚰️ แจ้งเสียชีวิต / งานศพ
</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:
        Tahoma,
        "Noto Sans Thai",
        sans-serif;

    min-height:100vh;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #06150c,
            #0b4825,
            #0d6733
        );

    padding:20px;

}


/* =====================================================
   Container
===================================================== */

.container{

    max-width:900px;

    margin:auto;

}


/* =====================================================
   Header
===================================================== */

.header{

    text-align:center;

    padding:
        30px 20px;

    margin-bottom:20px;

    border-radius:25px;

    background:
        rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,255,255,.18);

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.25);

}


.header-icon{

    font-size:60px;

    margin-bottom:10px;

}


.header h1{

    margin:0;

    font-size:
        clamp(
            26px,
            5vw,
            42px
        );

}


.header p{

    margin:
        10px 0
        0;

    color:#c8edd2;

}


/* =====================================================
   Card
===================================================== */

.card{

    background:
        rgba(255,255,255,.09);

    border:
        1px solid
        rgba(255,255,255,.17);

    border-radius:25px;

    padding:25px;

    margin-bottom:20px;

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.22);

}


.card h2{

    margin-top:0;

    color:#fff0ad;

}


/* =====================================================
   Form
===================================================== */

.form-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:15px;

}


.field{

    display:flex;

    flex-direction:column;

}


.field.full{

    grid-column:
        1 / -1;

}


label{

    margin-bottom:6px;

    color:#d5efdc;

    font-size:14px;

}


input,
select{

    width:100%;

    padding:14px;

    border:1px solid
        rgba(255,255,255,.20);

    border-radius:12px;

    background:
        rgba(0,0,0,.16);

    color:#fff;

    outline:none;

    font-size:16px;

}


input::placeholder{

    color:
        rgba(255,255,255,.55);

}


input:focus,
select:focus{

    border-color:
        rgba(255,235,150,.8);

    box-shadow:
        0 0 15px
        rgba(255,220,100,.10);

}


select option{

    color:#222;

}


/* =====================================================
   Buttons
===================================================== */

.buttons{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

    margin-top:20px;

}


button{

    width:100%;

    padding:14px;

    border:0;

    border-radius:13px;

    cursor:pointer;

    font-size:16px;

    font-weight:800;

}


.save-btn{

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #1f9d4c,
            #126b31
        );

}


.cancel-btn{

    color:#fff;

    background:
        #666;

    display:none;

}


/* =====================================================
   Search
===================================================== */

.search{

    margin-bottom:15px;

}


/* =====================================================
   Funeral Item
===================================================== */

.funeral-item{

    padding:20px;

    margin-top:15px;

    border-radius:20px;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.12);

    border-left:
        5px solid
        #eac95f;

}


.funeral-name{

    font-size:22px;

    font-weight:900;

    color:#fff;

}


.funeral-age{

    display:inline-block;

    margin-left:8px;

    font-size:15px;

    color:#f2d7dd;

    font-weight:700;

}


.info{

    margin-top:8px;

    line-height:1.8;

    color:#d4edd9;

}


.status{

    display:inline-block;

    margin-top:10px;

    padding:
        6px 12px;

    border-radius:20px;

    font-size:13px;

    font-weight:800;

}


.status.pending{

    color:#442f00;

    background:#ffd95a;

}


.status.done{

    color:#fff;

    background:#2ca45a;

}


/* =====================================================
   Action
===================================================== */

.action-buttons{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;

    margin-top:15px;

}


.edit-btn{

    color:#fff;

    background:#1976d2;

}


.delete-btn{

    color:#fff;

    background:#c62828;

}


/* =====================================================
   Empty
===================================================== */

.empty{

    padding:30px;

    text-align:center;

    color:#b8d6bf;

}


/* =====================================================
   Back
===================================================== */

.back{

    display:block;

    text-align:center;

    color:#d5f0dc;

    text-decoration:none;

    padding:15px;

}


/* =====================================================
   Mobile
===================================================== */

@media(max-width:650px){

    body{

        padding:10px;

    }


    .form-grid{

        grid-template-columns:
            1fr;

    }


    .field.full{

        grid-column:auto;

    }


    .buttons{

        grid-template-columns:
            1fr;

    }


    .action-buttons{

        grid-template-columns:
            1fr;

    }


    .funeral-name{

        font-size:20px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     Header
===================================================== -->

<div class="header">

    <div class="header-icon">
        ⚰️
    </div>

    <h1>
        แจ้งเสียชีวิต / งานศพ
    </h1>

    <p>
        กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6
    </p>

</div>


<!-- =====================================================
     Form
===================================================== -->

<div class="card">

    <h2 id="formTitle">
        ➕ เพิ่มข้อมูลผู้เสียชีวิต
    </h2>


    <div class="form-grid">


        <!-- ชื่อ -->

        <div class="field full">

            <label>
                ชื่อ - นามสกุล
            </label>

            <input
                id="name"
                type="text"
                placeholder="กรอกชื่อ - นามสกุล"
            >

        </div>


        <!-- อายุ -->

        <div class="field">

            <label>
                อายุผู้เสียชีวิต
            </label>

            <input
                id="age"
                type="number"
                min="0"
                max="120"
                placeholder="เช่น 47"
            >

        </div>


        <!-- บ้านเลขที่ -->

        <div class="field">

            <label>
                บ้านเลขที่
            </label>

            <input
                id="house"
                type="text"
                placeholder="เช่น 123"
            >

        </div>


        <!-- วันที่เสียชีวิต -->

        <div class="field">

            <label>
                วันที่เสียชีวิต
            </label>

            <input
                id="death"
                type="text"
                placeholder="วว/ดด/ปปปป"
            >

        </div>


        <!-- วันที่ฌาปนกิจ -->

        <div class="field">

            <label>
                วันที่ฌาปนกิจ
            </label>

            <input
                id="cremate"
                type="text"
                placeholder="วว/ดด/ปปปป"
            >

        </div>


        <!-- สถานะ -->

        <div class="field full">

            <label>
                สถานะ
            </label>

            <select id="status">

                <option value="ยังไม่ดำเนินการ">
                    ยังไม่ดำเนินการ
                </option>

                <option value="ดำเนินการแล้ว">
                    ดำเนินการแล้ว
                </option>

            </select>

        </div>


    </div>


    <div class="buttons">

        <button
            class="save-btn"
            onclick="saveFuneral()"
        >
            💾 บันทึกข้อมูล
        </button>


        <button
            id="cancelButton"
            class="cancel-btn"
            onclick="cancelEdit()"
        >
            ยกเลิกแก้ไข
        </button>

    </div>

</div>


<!-- =====================================================
     List
===================================================== -->

<div class="card">

    <h2>
        📋 รายการแจ้งเสียชีวิต
    </h2>


    <input
        class="search"
        id="search"
        type="text"
        placeholder="🔎 ค้นหาชื่อหรือบ้านเลขที่"
        oninput="showList()"
    >


    <div id="list"></div>

</div>


<a
    class="back"
    href="index.html"
>
    ← กลับหน้าหลัก
</a>


</div>


<script>

/* =====================================================
   โหลดข้อมูล
===================================================== */

let funerals =
    JSON.parse(
        localStorage.getItem(
            "funerals"
        )
    ) || [];


let editId = null;


/* =====================================================
   แปลงข้อมูลเดิม
===================================================== */

funerals =
    funerals.map(
        (item,index) => ({

            ...item,

            id:
                item.id ||
                "funeral-" +
                Date.now() +
                "-" +
                index,

            name:
                item.name ||
                "",

            age:
                Number(
                    item.age ||
                    item.years ||
                    item.ageYears ||
                    0
                ),

            house:
                item.house ||
                "",

            death:
                item.death ||
                "",

            cremate:
                item.cremate ||
                "",

            status:
                item.status ||
                "ยังไม่ดำเนินการ"

        })
    );


saveData();


/* =====================================================
   บันทึก
===================================================== */

function saveData(){

    localStorage.setItem(
        "funerals",
        JSON.stringify(
            funerals
        )
    );

}


/* =====================================================
   เพิ่ม / แก้ไข
===================================================== */

function saveFuneral(){

    const name =
        document.getElementById(
            "name"
        )
        .value
        .trim();


    const age =
        Number(
            document.getElementById(
                "age"
            )
            .value
        );


    const house =
        document.getElementById(
            "house"
        )
        .value
        .trim();


    const death =
        document.getElementById(
            "death"
        )
        .value
        .trim();


    const cremate =
        document.getElementById(
            "cremate"
        )
        .value
        .trim();


    const status =
        document.getElementById(
            "status"
        )
        .value;


    /* =========================
       ตรวจสอบ
    ========================= */

    if(!name){

        alert(
            "กรุณากรอกชื่อผู้เสียชีวิต"
        );

        return;

    }


    if(
        !age ||
        age < 0 ||
        age > 120
    ){

        alert(
            "กรุณากรอกอายุผู้เสียชีวิต"
        );

        return;

    }


    if(!house){

        alert(
            "กรุณากรอกบ้านเลขที่"
        );

        return;

    }


    if(!death){

        alert(
            "กรุณากรอกวันที่เสียชีวิต"
        );

        return;

    }


    /* =========================
       แก้ไข
    ========================= */

    if(
        editId !== null
    ){

        const item =
            funerals.find(
                r =>
                    String(r.id) ===
                    String(editId)
            );


        if(!item){

            alert(
                "ไม่พบรายการ"
            );

            cancelEdit();

            return;

        }


        item.name =
            name;

        item.age =
            age;

        item.house =
            house;

        item.death =
            death;

        item.cremate =
            cremate;

        item.status =
            status;


        saveData();

        alert(
            "แก้ไขข้อมูลเรียบร้อยแล้ว"
        );


        cancelEdit();

        showList();

        return;

    }


    /* =========================
       เพิ่มข้อมูลใหม่
    ========================= */

    funerals.push({

        id:
            "funeral-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(
                    2,
                    8
                ),

        name:
            name,

        age:
            age,

        house:
            house,

        death:
            death,

        cremate:
            cremate,

        status:
            status

    });


    saveData();

    clearForm();

    showList();


    alert(
        "บันทึกข้อมูลผู้เสียชีวิตเรียบร้อยแล้ว"
    );

}


/* =====================================================
   แก้ไข
===================================================== */

function editFuneral(id){

    const item =
        funerals.find(
            r =>
                String(r.id) ===
                String(id)
        );


    if(!item){

        alert(
            "ไม่พบรายการ"
        );

        return;

    }


    editId =
        id;


    document.getElementById(
        "name"
    )
    .value =
        item.name || "";


    document.getElementById(
        "age"
    )
    .value =
        item.age || "";


    document.getElementById(
        "house"
    )
    .value =
        item.house || "";


    document.getElementById(
        "death"
    )
    .value =
        item.death || "";


    document.getElementById(
        "cremate"
    )
    .value =
        item.cremate || "";


    document.getElementById(
        "status"
    )
    .value =
        item.status ||
        "ยังไม่ดำเนินการ";


    document.getElementById(
        "formTitle"
    )
    .innerText =
        "✏️ แก้ไขข้อมูลผู้เสียชีวิต";


    document.getElementById(
        "cancelButton"
    )
    .style.display =
        "block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =====================================================
   ยกเลิกแก้ไข
===================================================== */

function cancelEdit(){

    editId = null;


    clearForm();


    document.getElementById(
        "formTitle"
    )
    .innerText =
        "➕ เพิ่มข้อมูลผู้เสียชีวิต";


    document.getElementById(
        "cancelButton"
    )
    .style.display =
        "none";

}


/* =====================================================
   ล้างฟอร์ม
===================================================== */

function clearForm(){

    document.getElementById(
        "name"
    ).value = "";


    document.getElementById(
        "age"
    ).value = "";


    document.getElementById(
        "house"
    ).value = "";


    document.getElementById(
        "death"
    ).value = "";


    document.getElementById(
        "cremate"
    ).value = "";


    document.getElementById(
        "status"
    ).value =
        "ยังไม่ดำเนินการ";

}


/* =====================================================
   ลบ
===================================================== */

function deleteFuneral(id){

    const item =
        funerals.find(
            r =>
                String(r.id) ===
                String(id)
        );


    if(!item){

        return;

    }


    const confirmed =
        confirm(

            "ต้องการลบข้อมูลนี้หรือไม่?\n\n" +

            item.name +
            "\n" +

            "อายุ " +
            item.age +
            " ปี\n" +

            "บ้านเลขที่ " +
            item.house

        );


    if(!confirmed){

        return;

    }


    funerals =
        funerals.filter(
            r =>
                String(r.id) !==
                String(id)
        );


    saveData();

    showList();


    alert(
        "ลบข้อมูลเรียบร้อยแล้ว"
    );

}


/* =====================================================
   แสดงรายการ
===================================================== */

function showList(){

    const keyword =
        document.getElementById(
            "search"
        )
        .value
        .trim()
        .toLowerCase();


    const filtered =
        funerals
        .filter(
            item => {

                const name =
                    String(
                        item.name ||
                        ""
                    )
                    .toLowerCase();


                const house =
                    String(
                        item.house ||
                        ""
                    )
                    .toLowerCase();


                return (
                    name.includes(
                        keyword
                    )
                    ||
                    house.includes(
                        keyword
                    )
                );

            }
        );


    let html = "";


    filtered.forEach(
        (item,index) => {

            const statusClass =
                item.status ===
                "ดำเนินการแล้ว"
                    ? "done"
                    : "pending";


            html += `

                <div
                    class="funeral-item"
                >

                    <div
                        class="funeral-name"
                    >

                        ${index + 1}.
                        ${escapeHTML(
                            item.name
                        )}

                        <span
                            class="funeral-age"
                        >
                            อายุ
                            ${Number(
                                item.age || 0
                            )}
                            ปี
                        </span>

                    </div>


                    <div
                        class="info"
                    >

                        🏠 บ้านเลขที่:
                        ${escapeHTML(
                            item.house
                        )}

                        <br>


                        📅 วันที่เสียชีวิต:
                        ${escapeHTML(
                            item.death
                        )}

                        <br>


                        🔥 วันที่ฌาปนกิจ:
                        ${escapeHTML(
                            item.cremate ||
                            "-"
                        )}

                        <br>


                        📌 สถานะ:

                        <span
                            class="
                                status
                                ${statusClass}
                            "
                        >
                            ${escapeHTML(
                                item.status
                            )}
                        </span>

                    </div>


                    <div
                        class="action-buttons"
                    >

                        <button
                            class="edit-btn"
                            onclick="
                                editFuneral(
                                    '${escapeAttribute(
                                        item.id
                                    )}'
                                )
                            "
                        >
                            ✏️ แก้ไข
                        </button>


                        <button
                            class="delete-btn"
                            onclick="
                                deleteFuneral(
                                    '${escapeAttribute(
                                        item.id
                                    )}'
                                )
                            "
                        >
                            🗑️ ลบ
                        </button>

                    </div>

                </div>

            `;

        }
    );


    if(
        filtered.length === 0
    ){

        html = `

            <div class="empty">

                📭 ยังไม่มีข้อมูลการแจ้งเสียชีวิต

            </div>

        `;

    }


    document.getElementById(
        "list"
    )
    .innerHTML =
        html;

}


/* =====================================================
   ป้องกัน HTML
===================================================== */

function escapeHTML(value){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(value){

    return String(
        value || ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}


/* =====================================================
   เริ่มระบบ
===================================================== */

showList();

</script>

</body>

</html>
