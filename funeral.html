<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
แจ้งเสียชีวิต / งานศพ
</title>


<style>

body{

font-family:Tahoma,sans-serif;
margin:0;
background:#f3f7f0;

}


.header{

background:#555;
color:white;
padding:20px;
text-align:center;

}


.container{

padding:15px;

}


input,button,select{

width:100%;
padding:12px;
margin:5px 0;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;

}


button{

background:#228B22;
color:white;
border:none;

}


.card{

background:white;
padding:15px;
margin-top:10px;
border-radius:15px;
box-shadow:0 3px 8px #ddd;

}


</style>


</head>


<body>


<div class="header">

<h2>
⚰️ แจ้งเสียชีวิต / งานศพ
</h2>

<p>
กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6
</p>

</div>



<div class="container">


<input id="name"
placeholder="ชื่อ - นามสกุล ผู้เสียชีวิต">


<input id="age"
placeholder="อายุ (ปี)">



<input id="house"
placeholder="บ้านเลขที่">



<label>
วันที่เสียชีวิต
</label>

<input id="deadDate"
type="date">



<label>
วันที่ฌาปนกิจ
</label>

<input id="burnDate"
type="date">



<input id="temple"
placeholder="วัดที่จัดงาน">



<input id="rice"
placeholder="ปริมาณข้าวสารช่วยงาน (ถุง)">



<select id="status">

<option>
สถานะการส่ง
</option>

<option>
ส่งแล้ว
</option>

<option>
รอส่ง
</option>

</select>



<button onclick="addFuneral()">

➕ บันทึกข้อมูล

</button>



<h3>
รายการงานศพ
</h3>


<div id="list"></div>


</div>



<script>


let funerals =
JSON.parse(localStorage.getItem("funerals")) || [];



function show(){


let html="";


funerals.forEach((f,i)=>{


html += `

<div class="card">

<b>
${i+1}. ศพ ${f.name}
</b>

<br>
อายุ ${f.age} ปี

<br>
บ้านเลขที่ ${f.house}

<br>
เสียชีวิต ${f.deadDate}

<br>
ฌาปนกิจ ${f.burnDate}

<br>
วัด ${f.temple}

<br>
ข้าวสารช่วยงาน ${f.rice} ถุง

<br>
สถานะ ${f.status}


</div>

`;


});


document.getElementById("list").innerHTML=html;


}




function addFuneral(){


let data={

name:
document.getElementById("name").value,

age:
document.getElementById("age").value,

house:
document.getElementById("house").value,

deadDate:
document.getElementById("deadDate").value,

burnDate:
document.getElementById("burnDate").value,

temple:
document.getElementById("temple").value,

rice:
document.getElementById("rice").value,

status:
document.getElementById("status").value

};



funerals.push(data);


localStorage.setItem(

"funerals",

JSON.stringify(funerals)

);



alert("บันทึกข้อมูลเรียบร้อย");


show();


}



show();


</script>


</body>

</html>
