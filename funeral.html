<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แจ้งผู้เสียชีวิตและไว้อาลัย - ระบบกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #09130d;
      --glass-surface: rgba(18, 38, 27, 0.85);
      --glass-border: rgba(212, 175, 55, 0.3);
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --shadow-premium: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; font-family: 'Sarabun', 'Plus Jakarta Sans', sans-serif; transition: all 0.3s ease; }

    body {
      background: radial-gradient(circle at 50% 0%, #132e1e 0%, var(--bg-deep) 100%);
      min-height: 100vh;
      margin: 0;
      padding: 30px 15px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .container { max-width: 800px; margin: auto; width: 100%; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      text-decoration: none;
    }

    .back-btn:hover {
      background: var(--gold-primary);
      color: #09130d;
    }

    /* กล่องฟอร์มกรอกข้อมูล (สำหรับผู้ใหญ่บ้านระบุข้อมูล) */
    .form-box {
      background: rgba(10, 20, 14, 0.7);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-premium);
    }

    .form-box h3 { margin: 0 0 12px 0; font-size: 16px; color: var(--gold-light); }
    
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 120px;
      gap: 10px;
    }

    @media(max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .form-control {
      background: rgba(18, 38, 27, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 14px;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }
    .form-control:focus { border-color: var(--gold-primary); }

    .btn-update {
      background: linear-gradient(135deg, #d4af37, #aa8c2c);
      color: #09130d;
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-update:hover { background: #e6c555; }

    /* การ์ดไว้อาลัยอนิเมชั่นหรูหรา */
    .condolence-card {
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 40px 30px;
      box-shadow: var(--shadow-premium);
      border: 1px solid var(--glass-border);
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ribbon {
      font-size: 50px;
      margin-bottom: 15px;
      animation: floatIcon 3s ease-in-out infinite;
    }

    .title-anim {
      font-size: 22px;
      color: var(--gold-light);
      margin-bottom: 15px;
      font-weight: 700;
    }

    .marquee-box {
      background: rgba(10, 20, 14, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 25px;
      margin: 25px 0;
    }

    .marquee-text {
      font-size: 20px;
      line-height: 1.8;
      color: #fff;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      min-height: 60px;
    }

    .signature {
      margin-top: 30px;
      font-size: 16px;
      color: var(--gold-primary);
      font-weight: 600;
      letter-spacing: 1px;
      animation: pulseGlow 2.5s infinite;
    }

    .footer {
      background: rgba(10, 20, 14, 0.6);
      backdrop-filter: blur(15px);
      color: var(--text-muted);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; text-shadow: 0 0 10px rgba(212, 175, 55, 0.6); }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- แถบบน -->
  <div class="top-bar">
    <a href="แดชบอร์ด.html" class="back-btn">⬅️ กลับหน้าหลัก</a>
    <div style="font-size: 13px; color: var(--gold-light);">🕯️ ระบบแจ้งข่าวและไว้อาลัย</div>
  </div>

  <!-- ส่วนผู้ใหญ่บ้านกรอกข้อมูลผู้เสียชีวิต -->
  <div class="form-box">
    <h3>📝 บันทึกข้อมูลผู้เสียชีวิต (สำหรับแสดงผลหน้าจอ)</h3>
    <div class="form-grid">
      <input type="text" id="inputName" class="form-control" placeholder="ชื่อ - นามสกุล ผู้เสียชีวิต">
      <input type="text" id="inputAge" class="form-control" placeholder="อายุ (เช่น 72 ปี)">
      <button onclick="updateCondolence()" class="btn-update">แสดงผล 📢</button>
    </div>
  </div>

  <!-- การ์ดไว้อาลัยอนิเมชั่นหรูหรา -->
  <div class="condolence-card">
    <div class="ribbon">🕯️</div>
    <div class="title-anim">ด้วยความอาลัยและเสียใจอย่างยิ่ง</div>
    
    <div class="marquee-box">
      <div id="typingText" class="marquee-text">
        กำลังโหลดข้อมูล...
      </div>
    </div>

    <div class="signature">
      — จากทีมผู้นำหมู่บ้าน และคณะกรรมการหมู่บ้านร่องเข็ม หมู่ที่ 6 —
    </div>
  </div>

</div>

<div class="footer container">
  <div><strong>ระบบกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</strong></div>
  <div style="margin-top: 4px; opacity: 0.8;">พัฒนาโดย นายศักรนนทน์ ขัติย์วงศ์ (ผู้ใหญ่บ้าน)</div>
</div>

<script>
  // โหลดข้อมูลล่าสุดจาก localStorage (ถ้ามี)
  window.onload = function() {
    const savedName = localStorage.getItem('funeral_name') || "คุณพ่อ/คุณแม่ (ตัวอย่าง)";
    const savedAge = localStorage.getItem('funeral_age') || "75 ปี";
    
    document.getElementById('inputName').value = savedName === "คุณพ่อ/คุณแม่ (ตัวอย่าง)" ? "" : savedName;
    document.getElementById('inputAge').value = savedAge === "75 ปี" ? "" : savedAge;
    
    displayMessage(savedName, savedAge);
  };

  function updateCondolence() {
    const name = document.getElementById('inputName').value.trim() || "ผู้วายชนม์";
    const age = document.getElementById('inputAge').value.trim() || "";
    
    // บันทึกเก็บไว้
    localStorage.setItem('funeral_name', name);
    localStorage.setItem('funeral_age', age);
    
    displayMessage(name, age);
  }

  function displayMessage(name, age) {
    const textElement = document.getElementById("typingText");
    let ageText = age ? ` อายุ ${age}` : "";
    const message = `ขอแสดงความเสียใจกับครอบครัว ต่อการจากไปของ ${name}${ageText} ขอให้ดวงวิญญาณไปสู่สุคติในสัมปรายภพอันสงบสุขร่มเย็นเบื้องสรวงสวรรค์`;
    
    textElement.innerHTML = "";
    let i = 0;
    
    function typeWriter() {
      if (i < message.length) {
        textElement.innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 50);
      }
    }
    typeWriter();
  }
</script>

</body>
</html>
