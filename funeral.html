<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>งานศพ - กลุ่มข้าวสาร หมู่ 6</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:#f3f7f0;
    color:#333;
}

.header{
    background:linear-gradient(135deg,#555,#777);
    color:white;
    padding:22px 15px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.box{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:16px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

input,
button{
    width:100%;
    padding:13px;
    margin:6px 0;
    border-radius:10px;
    font-size:16px;
}

input{
    border:1px solid #ccc;
}

button{
    border:0;
    background:#228B22;
    color:white;
}

button.red{
    background:#c62828;
}

button.gray{
    background:#666;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.summary-card{
    background:#f8fff8;
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.number{
    font-size:27px;
    font-weight:bold;
    color:#228B22;
}

.warning-number{
    color:#c62828;
}

.funeral-card{
    background:#fafafa;
    padding:15px;
    margin-top:10px;
    border-radius:12px;
    border-left:5px solid #555;
}

.member-card{
    background:#fff;
    padding:14px;
    margin-top:10px;
    border-radius:12px;
    border-left:5px solid #228B22;
}

.sent{
    border-left-color:#228B22;
    background:#f1fff1;
}

.not-sent{
    border-left-color:#c62828;
    background:#fff5f5;
}

.status-ok{
    color:#1b7a1b;
    font-weight:bold;
}

.status-warning{
    color:#b88600;
    font-weight:bold;
}

.status-danger{
    color:#c62828;
    font-weight:bold;
}

.notice{
    padding:15px;
    border-radius:12px;
    margin-top:10px;
}

.notice-green{
    background:#e8f7e8;
    color:#1b7a1b;
}

.notice-yellow{
    background:#fff3cd;
    color:#856404;
}

.notice-red{
    background:#ffe5e5;
    color:#c62828;
}

.back{
    display:block;
    text-align:center;
    padding:15px;
    color:#228B22;
    text-decoration:none;
}

@media(max-width:600px){

    .summary{
        grid-template-columns:1fr 1fr 1fr;
    }

    .summary-card{
        padding:10px 5px;
        font-size:13px;
    }

    .number{
        font-size:22px;
    }

}

</style>

</head>

<body>

<div class="header">

    <h1>⚰️ แจ้งเสียชีวิต / งานศพ</h1>

    <p>กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</p>

</div>


<div class="container">


<!-- สร้างงานศพ -->

<div class="box">

    <h2>➕ แจ้งงานศพ</h2>

    <input
        id="name"
        type="text"
        placeholder="ชื่อ-นามสกุลผู้เสียชีวิต"
    >

    <input
        id="age"
        type="number"
        placeholder="อายุ (ปี)"
    >

    <input
        id="house"
        type="text"
        placeholder="บ้านเลขที่"
    >

    <label>วันที่เสียชีวิต</label>

    <input
        id="deadDate"
        type="date"
    >

    <label>วันที่ฌาปนกิจ</label>

    <input
        id="burnDate"
        type="date"
    >

    <input
        id="temple"
        type="text"
        placeholder="วัดที่จัดงาน"
    >

    <button onclick="addFuneral()">
        💾 บันทึกงานศพ
    </button>

</div>


<!-- รายการงานศพ -->

<div class="box">

    <h2>⚰️ รายการงานศพ</h2>

    <div id="funeralList"></div>

</div>


<!-- รายชื่อสมาชิก -->

<div class="box">

    <h2>🌾 สมาชิกที่นำข้าวสารช่วยงาน</h2>

    <div id="selectedFuneralText">
        กรุณาเลือกงานศพก่อน
    </div>

    <div id="summary"></div>

    <div id="memberList">
        กรุณาเลือกงานศพก่อน
    </div>

</div>


<!-- แจ้งเตือน -->

<div class="box">

    <h2>🔔 แจ้งเตือนสมาชิก</h2>

    <div id="alertBox">
        ยังไม่มีข้อมูล
    </div>

</div>


</div>


<script>

/* --------------------------------
   โหลดข้อมูล
-------------------------------- */

let members =
    JSON.parse(localStorage.getItem("members")) || [];

let funerals =
    JSON.parse(localStorage.getItem("funerals")) || [];

let funeralSends =
    JSON.parse(localStorage.getItem("funeralSends")) || [];

let selectedFuneralId =
    localStorage.getItem("selectedFuneralId") || "";


/* --------------------------------
   เตรียมข้อมูลสมาชิก
-------------------------------- */

members = members.map(m => ({

    ...m,

    pending: Number(m.pending || 0),

    pendingFor: m.pendingFor || "",

    status: m.status || "ปกติ"

}));


function saveMembers(){

    localStorage.setItem(
        "members",
        JSON.stringify(members)
    );

}


/* --------------------------------
   เพิ่มงานศพ
-------------------------------- */

function addFuneral(){

    const name =
        document.getElementById("name").value.trim();

    const age =
        document.getElementById("age").value.trim();

    const house =
        document.getElementById("house").value.trim();

    const deadDate =
        document.getElementById("deadDate").value;

    const burnDate =
        document.getElementById("burnDate").value;

    const temple =
        document.getElementById("temple").value.trim();


    if(!name){

        alert("กรุณากรอกชื่อผู้เสียชีวิต");

        return;

    }


    const funeral = {

        id:Date.now(),

        name:name,

        age:age,

        house:house,

        deadDate:deadDate,

        burnDate:burnDate,

        temple:temple,

        closed:false,

        createdAt:
            new Date().toLocaleDateString("th-TH")

    };


    funerals.push(funeral);


    localStorage.setItem(
        "funerals",
        JSON.stringify(funerals)
    );


    document.getElementById("name").value = "";
    document.getElementById("age").value = "";
    document.getElementById("house").value = "";
    document.getElementById("deadDate").value = "";
    document.getElementById("burnDate").value = "";
    document.getElementById("temple").value = "";


    selectedFuneralId = String(funeral.id);

    localStorage.setItem(
        "selectedFuneralId",
        selectedFuneralId
    );


    showFunerals();

    showMembers();

    alert("บันทึกงานศพเรียบร้อยแล้ว");

}


/* --------------------------------
   แสดงงานศพ
-------------------------------- */

function showFunerals(){

    let html = "";


    if(funerals.length === 0){

        html = `
            <div class="notice notice-yellow">
                ยังไม่มีข้อมูลการแจ้งงานศพ
            </div>
        `;

    }else{

        funerals.forEach(f => {

            const isSelected =
                String(f.id) ===
                String(selectedFuneralId);


            html += `

                <div class="funeral-card">

                    <strong>
                        ⚰️ ${f.name}
                    </strong>

                    <br>

                    อายุ:
                    ${f.age || "-"} ปี

                    <br>

                    🏠 บ้านเลขที่:
                    ${f.house || "-"}

                    <br>

                    📅 วันที่เสียชีวิต:
                    ${formatDate(f.deadDate)}

                    <br>

                    🔥 วันที่ฌาปนกิจ:
                    ${formatDate(f.burnDate)}

                    <br>

                    🛕 วัด:
                    ${f.temple || "-"}

                    <br><br>

                    <strong>
                        ${f.closed
                            ? "✅ ปิดงานแล้ว"
                            : "🟡 อยู่ระหว่างดำเนินการ"}
                    </strong>

                    <button
                        onclick="selectFuneral(${f.id})">

                        🌾 จัดการการส่งข้าวสาร

                    </button>

                    ${
                        !f.closed
                        ? `
                        <button
                            class="red"
                            onclick="closeFuneral(${f.id})">

                            🔒 ปิดงานศพและบันทึกผู้ค้างส่ง

                        </button>
                        `
                        : ""
                    }

                </div>

            `;

        });

    }


    document.getElementById("funeralList").innerHTML =
        html;

}


/* --------------------------------
   เลือกงานศพ
-------------------------------- */

function selectFuneral(id){

    selectedFuneralId = String(id);

    localStorage.setItem(
        "selectedFuneralId",
        selectedFuneralId
    );

    showMembers();

}


/* --------------------------------
   แสดงสมาชิก
-------------------------------- */

function showMembers(){

    if(!selectedFuneralId){

        document.getElementById(
            "selectedFuneralText"
        ).innerHTML =
            "กรุณาเลือกงานศพก่อน";

        document.getElementById(
            "memberList"
        ).innerHTML =
            "";

        document.getElementById(
            "summary"
        ).innerHTML =
            "";

        return;

    }


    const funeral =
        funerals.find(
            f =>
                String(f.id) ===
                String(selectedFuneralId)
        );


    if(!funeral){

        return;

    }


    document.getElementById(
        "selectedFuneralText"
    ).innerHTML = `

        <div class="notice notice-green">

            ⚰️ งานศพ:
            <strong>
                ${funeral.name}
            </strong>

            <br>

            🌾 กติกา:
            สมาชิก 1 ครัวเรือน = ข้าวสาร 1 ถุง

        </div>

    `;


    let sentCount = 0;


    let notSentCount = 0;


    let html = "";


    members.forEach((m,index)=>{

        const alreadySent =
            funeralSends.some(s =>
                String(s.funeralId) ===
                String(funeral.id)
                &&
                String(s.memberHouse) ===
                String(m.house)
            );


        if(alreadySent){

            sentCount++;


            html += `

                <div class="member-card sent">

                    <strong>
                        ${index + 1}. ${m.name}
                    </strong>

                    <br>

                    🏠 บ้านเลขที่:
                    ${m.house}

                    <br>

                    <span class="status-ok">
                        ✅ ส่งแล้ว 1 ถุง
                    </span>

                </div>

            `;

        }else{

            notSentCount++;


            html += `

                <div class="member-card not-sent">

                    <strong>
                        ${index + 1}. ${m.name}
                    </strong>

                    <br>

                    🏠 บ้านเลขที่:
                    ${m.house}

                    <br>

                    <span class="status-warning">
                        ⏳ ยังไม่ส่ง
                    </span>

                    <button
                        onclick="sendRice(
                            ${funeral.id},
                            '${escapeJS(m.name)}',
                            '${escapeJS(m.house)}'
                        )">

                        🌾 ส่งข้าวสาร 1 ถุง

                    </button>

                </div>

            `;

        }

    });


    document.getElementById(
        "memberList"
    ).innerHTML =
        html ||
        "<p>ยังไม่มีสมาชิกในทะเบียน</p>";


    document.getElementById(
        "summary"
    ).innerHTML = `

        <div class="summary">

            <div class="summary-card">

                👥 สมาชิก

                <div class="number">
                    ${members.length}
                </div>

                ครัวเรือน

            </div>

            <div class="summary-card">

                ✅ ส่งแล้ว

                <div class="number">
                    ${sentCount}
                </div>

                ถุง

            </div>

            <div class="summary-card">

                ⚠️ ยังไม่ส่ง

                <div class="number warning-number">
                    ${notSentCount}
                </div>

                ครัวเรือน

            </div>

        </div>

    `;


    showAlert();

}


/* --------------------------------
   บันทึกการส่งข้าวสาร
-------------------------------- */

function sendRice(
    funeralId,
    name,
    house
){

    const exists =
        funeralSends.some(s =>
            String(s.funeralId) ===
            String(funeralId)
            &&
            String(s.memberHouse) ===
            String(house)
        );


    if(exists){

        alert("บ้านนี้ส่งข้าวสารงานนี้แล้ว");

        return;

    }


    funeralSends.push({

        id:Date.now(),

        funeralId:String(funeralId),

        memberName:name,

        memberHouse:house,

        amount:1,

        date:new Date()
            .toLocaleDateString("th-TH")

    });


    localStorage.setItem(
        "funeralSends",
        JSON.stringify(funeralSends)
    );


    showMembers();

}


/* --------------------------------
   ปิดงานศพ
-------------------------------- */

function closeFuneral(id){

    const funeral =
        funerals.find(
            f =>
                String(f.id) ===
                String(id)
        );


    if(!funeral){

        alert("ไม่พบข้อมูลการงานศพ");

        return;

    }


    if(funeral.closed){

        alert("งานศพนี้ปิดไปแล้ว");

        return;

    }


    const confirmed =
        confirm(
            "ยืนยันปิดงานศพและบันทึกสมาชิกที่ยังไม่ส่งข้าวสาร?"
        );


    if(!confirmed){

        return;

    }


    let notSentMembers = [];


    members.forEach(m => {

        const alreadySent =
            funeralSends.some(s =>
                String(s.funeralId) ===
                String(funeral.id)
                &&
                String(s.memberHouse) ===
                String(m.house)
            );


        if(!alreadySent){

            notSentMembers.push(m);

        }

    });


    notSentMembers.forEach(m => {

        m.pending =
            Number(m.pending || 0) + 1;

        m.pendingFor =
            funeral.name;


        if(m.pending >= 2){

            m.status =
                "เสนอพิจารณาตัดสมาชิก";

        }else{

            m.status =
                "แจ้งเตือน 1 ครั้ง";

        }

    });


    funeral.closed = true;


    saveMembers();


    localStorage.setItem(
        "funerals",
        JSON.stringify(funerals)
    );


    showFunerals();

    showMembers();

    showAlert();


    alert(
        `ปิดงานศพเรียบร้อย\n` +
        `พบสมาชิกค้างส่ง ${notSentMembers.length} ครัวเรือน`
    );

}


/* --------------------------------
   แจ้งเตือน
-------------------------------- */

function showAlert(){

    if(!selectedFuneralId){

        return;

    }


    const funeral =
        funerals.find(
            f =>
                String(f.id) ===
                String(selectedFuneralId)
        );


    if(!funeral){

        return;

    }


    const pendingMembers =
        members.filter(m =>
            !funeralSends.some(s =>
                String(s.funeralId) ===
                String(funeral.id)
                &&
                String(s.memberHouse) ===
                String(m.house)
            )
        );


    if(pendingMembers.length === 0){

        document.getElementById(
            "alertBox"
        ).innerHTML = `

            <div class="notice notice-green">

                ✅ ทุกครัวเรือนส่งข้าวสารครบแล้ว

            </div>

        `;

        return;

    }


    let html = `

        <div class="notice notice-yellow">

            ⚠️ งานนี้ยังมี
            <strong>
                ${pendingMembers.length}
            </strong>
            ครัวเรือนที่ยังไม่ส่ง

        </div>

    `;


    pendingMembers.forEach(m => {

        const pending =
            Number(m.pending || 0);


        let status =
            "🟢 ปกติ";

        if(pending === 1){

            status =
                "🟡 แจ้งเตือน 1 ครั้ง";

        }

        if(pending >= 2){

            status =
                "🔴 เสนอพิจารณาตัดสมาชิก";

        }


        html += `

            <div class="member-card not-sent">

                🏠 <strong>
                    ${m.name}
                </strong>

                <br>

                บ้านเลขที่:
                ${m.house}

                <br>

                📦 ค้างส่ง:
                ${pending} งาน

                <br>

                📌 สถานะ:
                ${status}

            </div>

        `;

    });


    document.getElementById(
        "alertBox"
    ).innerHTML =
        html;

}


/* --------------------------------
   ฟังก์ชันช่วย
-------------------------------- */

function formatDate(value){

    if(!value){

        return "-";

    }


    const parts =
        String(value).split("-");


    if(parts.length !== 3){

        return value;

    }


    return `
        ${parts[2]}/${parts[1]}/${parts[0]}
    `;

}


function escapeJS(value){

    return String(value || "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\n/g," ");

}


/* --------------------------------
   เริ่มระบบ
-------------------------------- */

showFunerals();
showMembers();

</script>

</body>

</html>
