<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
⚰️ แจ้งเสียชีวิต / งานศพ
</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:
        Tahoma,
        "Noto Sans Thai",
        sans-serif;

    min-height:100vh;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #06150c,
            #0b4825,
            #0d6733
        );

    padding:20px;
}

.container{

    max-width:1000px;

    margin:auto;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    text-align:center;

    padding:30px 20px;

    margin-bottom:20px;

    border-radius:25px;

    background:
        rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,255,255,.18);

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.25);

}

.header-icon{

    font-size:60px;

    margin-bottom:10px;

}

.header h1{

    margin:0;

    font-size:
        clamp(
            27px,
            5vw,
            42px
        );

}

.header p{

    margin:
        10px 0 0;

    color:#c8edd2;

}


/* =====================================================
   CARD
===================================================== */

.card{

    background:
        rgba(255,255,255,.09);

    border:
        1px solid
        rgba(255,255,255,.17);

    border-radius:25px;

    padding:25px;

    margin-bottom:20px;

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.22);

}

.card h2{

    margin-top:0;

    color:#fff0ad;

}


/* =====================================================
   FORM
===================================================== */

.form-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:15px;

}

.field{

    display:flex;

    flex-direction:column;

}

.field.full{

    grid-column:
        1 / -1;

}

label{

    margin-bottom:7px;

    color:#d5efdc;

    font-size:14px;

    font-weight:600;

}

input,
select{

    width:100%;

    padding:14px;

    border:
        1px solid
        rgba(255,255,255,.20);

    border-radius:12px;

    background:
        rgba(0,0,0,.16);

    color:#fff;

    outline:none;

    font-size:16px;

}

input::placeholder{

    color:
        rgba(255,255,255,.55);

}

input:focus,
select:focus{

    border-color:#fff0a8;

    box-shadow:
        0 0 15px
        rgba(255,230,120,.15);

}

select option{

    color:#222;

}


/* =====================================================
   BUTTON
===================================================== */

.buttons{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

    margin-top:20px;

}

button{

    width:100%;

    padding:14px;

    border:0;

    border-radius:13px;

    font-size:16px;

    font-weight:900;

}

.save-btn{

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #1f9d4c,
            #126b31
        );

}

.cancel-btn{

    color:#fff;

    background:#666;

    display:none;

}


/* =====================================================
   SEARCH
===================================================== */

.search{

    width:100%;

    margin-bottom:15px;

}


/* =====================================================
   TABLE
===================================================== */

.table-wrap{

    width:100%;

    overflow-x:auto;

}

table{

    width:100%;

    border-collapse:collapse;

    min-width:850px;

}

th{

    padding:13px;

    text-align:left;

    background:
        rgba(255,255,255,.10);

    color:#fff0ad;

    border-bottom:
        1px solid
        rgba(255,255,255,.16);

}

td{

    padding:13px;

    border-bottom:
        1px solid
        rgba(255,255,255,.10);

    color:#dff4e4;

    vertical-align:middle;

}

tr:hover td{

    background:
        rgba(255,255,255,.04);

}


/* =====================================================
   NAME
===================================================== */

.deceased-name{

    font-weight:900;

    color:#fff;

}

.deceased-age{

    display:block;

    margin-top:4px;

    color:#f0ccd8;

    font-size:13px;

    font-weight:700;

}


/* =====================================================
   STATUS
===================================================== */

.status{

    display:inline-block;

    padding:
        6px 10px;

    border-radius:18px;

    font-size:12px;

    font-weight:800;

}

.status.pending{

    color:#483800;

    background:#ffd95a;

}

.status.done{

    color:#fff;

    background:#269b54;

}


/* =====================================================
   ACTIONS
===================================================== */

.action-buttons{

    display:flex;

    gap:7px;

}

.edit-btn{

    width:auto;

    padding:
        8px 12px;

    color:#fff;

    background:#1976d2;

    font-size:13px;

}

.delete-btn{

    width:auto;

    padding:
        8px 12px;

    color:#fff;

    background:#c62828;

    font-size:13px;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

    padding:30px;

    text-align:center;

    color:#b8d6bf;

}


/* =====================================================
   BACK
===================================================== */

.back{

    display:block;

    text-align:center;

    color:#d5f0dc;

    text-decoration:none;

    padding:15px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

    body{

        padding:10px;

    }

    .form-grid{

        grid-template-columns:
            1fr;

    }

    .field.full{

        grid-column:auto;

    }

    .buttons{

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="header-icon">
        ⚰️
    </div>

    <h1>
        แจ้งเสียชีวิต / งานศพ
    </h1>

    <p>
        กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6
    </p>

</div>


<!-- =====================================================
     FORM
===================================================== -->

<div class="card">

    <h2 id="formTitle">
        ➕ เพิ่มข้อมูลผู้เสียชีวิต
    </h2>


    <div class="form-grid">


        <!-- ชื่อผู้เสียชีวิต -->

        <div class="field full">

            <label>
                👤 ชื่อ - นามสกุลผู้เสียชีวิต
            </label>

            <input
                id="name"
                type="text"
                placeholder="กรอกชื่อ - นามสกุลผู้เสียชีวิต"
            >

        </div>


        <!-- อายุ -->

        <div class="field">

            <label>
                🎂 อายุผู้เสียชีวิต
            </label>

            <input
                id="age"
                type="number"
                min="0"
                max="120"
                placeholder="เช่น 47"
            >

        </div>


        <!-- บ้านเลขที่ -->

        <div class="field">

            <label>
                🏠 บ้านเลขที่
            </label>

            <input
                id="house"
                type="text"
                placeholder="เช่น 123"
            >

        </div>


        <!-- ผู้แจ้ง -->

        <div class="field full">

            <label>
                👨‍👩‍👧 ชื่อผู้แจ้งการเสียชีวิต (ญาติ)
            </label>

            <input
                id="reporter"
                type="text"
                placeholder="ระบุชื่อ - นามสกุลญาติผู้แจ้ง"
            >

        </div>


        <!-- วันที่เสียชีวิต -->

        <div class="field">

            <label>
                📅 วันที่เสียชีวิต
            </label>

            <input
                id="death"
                type="date"
            >

        </div>


        <!-- วันที่ฌาปนกิจ -->

        <div class="field">

            <label>
                🔥 วันที่ฌาปนกิจ
            </label>

            <input
                id="cremate"
                type="date"
            >

        </div>


        <!-- สถานะ -->

        <div class="field full">

            <label>
                📌 สถานะ
            </label>

            <select id="status">

                <option value="ยังไม่ดำเนินการ">
                    ยังไม่ดำเนินการ
                </option>

                <option value="นำข้าวสารช่วยเหลือแล้ว">
                    นำข้าวสารช่วยเหลือแล้ว
                </option>

            </select>

        </div>


    </div>


    <div class="buttons">


        <button
            id="saveButton"
            class="save-btn"
            type="button"
        >
            💾 บันทึกข้อมูล
        </button>


        <button
            id="cancelButton"
            class="cancel-btn"
            type="button"
        >
            ยกเลิกแก้ไข
        </button>


    </div>

</div>


<!-- =====================================================
     LIST
===================================================== -->

<div class="card">

    <h2>
        📋 รายการแจ้งเสียชีวิต
    </h2>


    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 ค้นหาชื่อ บ้านเลขที่ หรือผู้แจ้ง"
    >


    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>
                        ลำดับ
                    </th>

                    <th>
                        ผู้เสียชีวิต
                    </th>

                    <th>
                        บ้านเลขที่
                    </th>

                    <th>
                        ผู้แจ้ง
                    </th>

                    <th>
                        วันที่เสียชีวิต
                    </th>

                    <th>
                        วันที่ฌาปนกิจ
                    </th>

                    <th>
                        สถานะ
                    </th>

                    <th>
                        จัดการ
                    </th>

                </tr>

            </thead>


            <tbody id="funeralList">

            </tbody>

        </table>

    </div>

</div>


<a
    href="index.html"
    class="back"
>
    ⬅ กลับหน้าหลัก
</a>


</div>


<script>

/* =====================================================
   DATA
===================================================== */

let funerals =
    loadFunerals();


let editingId =
    null;


/* =====================================================
   LOAD
===================================================== */

function loadFunerals(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(
                    "funerals"
                )
            );


        if(
            Array.isArray(data)
        ){

            return data.map(
                (
                    item,
                    index
                ) => normalizeFuneral(
                    item,
                    index
                )
            );

        }

    }
    catch(error){

        console.error(
            error
        );

    }


    return [];

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalizeFuneral(
    item,
    index
){

    return {

        id:

            String(
                item.id ??
                item.funeralId ??
                (
                    "funeral-" +
                    Date.now() +
                    "-" +
                    index
                )
            ),

        name:

            String(
                item.name ??
                ""
            ).trim(),

        age:

            item.age ??
            "",

        house:

            String(
                item.house ??
                ""
            ).trim(),

        reporter:

            String(
                item.reporter ??
                item.informer ??
                item.contact ??
                ""
            ).trim(),

        death:

            normalizeDate(
                item.death
            ),

        cremate:

            normalizeDate(
                item.cremate
            ),

        status:

            item.status ??
            "ยังไม่ดำเนินการ",

        timestamp:

            Number(
                item.timestamp ??
                item.createdAt ??
                Date.now()
            )

    };

}


/* =====================================================
   DATE
===================================================== */

function normalizeDate(
    value
){

    if(!value){

        return "";

    }


    const text =
        String(
            value
        );


    if(
        /^\d{4}-\d{2}-\d{2}$/
        .test(text)
    ){

        return text;

    }


    return text;

}


/* =====================================================
   SAVE
===================================================== */

function saveAll(){

    localStorage.setItem(

        "funerals",

        JSON.stringify(
            funerals
        )

    );

}


/* =====================================================
   DATE DISPLAY THAI
===================================================== */

function displayDate(
    value
){

    if(!value){

        return "-";

    }


    if(
        /^\d{4}-\d{2}-\d{2}$/
        .test(value)
    ){

        const parts =
            value.split("-");


        const year =
            Number(
                parts[0]
            );


        const month =
            Number(
                parts[1]
            );


        const day =
            Number(
                parts[2]
            );


        return (
            day
            .toString()
            .padStart(
                2,
                "0"
            )
            +

            "/" +

            month
            .toString()
            .padStart(
                2,
                "0"
            )

            +

            "/" +

            year
        );

    }


    return value;

}


/* =====================================================
   DATE SORT
===================================================== */

function dateValue(
    value
){

    if(!value){

        return 0;

    }


    if(
        /^\d{4}-\d{2}-\d{2}$/
        .test(value)
    ){

        return new Date(
            value
        ).getTime();

    }


    const parts =
        value
        .replaceAll(
            "-",
            "/"
        )
        .split("/");


    if(
        parts.length === 3
    ){

        let year =
            Number(
                parts[2]
            );


        if(
            year > 2400
        ){

            year -= 543;

        }


        return new Date(
            year,
            Number(
                parts[1]
            ) - 1,
            Number(
                parts[0]
            )
        ).getTime();

    }


    return 0;

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(
    value
){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(
            value ??
            ""
        );

    return div.innerHTML;

}


/* =====================================================
   RENDER
===================================================== */

function render(){

    const tbody =
        document.getElementById(
            "funeralList"
        );


    const keyword =
        document
        .getElementById(
            "search"
        )
        .value
        .trim()
        .toLowerCase();


    const filtered =

        funerals
        .slice()
        .sort(
            (
                a,
                b
            ) =>

                dateValue(
                    b.death
                )
                -
                dateValue(
                    a.death
                )
        )
        .filter(
            item => {

                const text = (

                    item.name +
                    " " +
                    item.house +
                    " " +
                    item.reporter

                )
                .toLowerCase();


                return text.includes(
                    keyword
                );

            }
        );


    if(
        filtered.length === 0
    ){

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    style="text-align:center;padding:30px"
                >

                    📭 ยังไม่มีรายการแจ้งเสียชีวิต

                </td>

            </tr>

        `;

        return;

    }


    tbody.innerHTML =

        filtered
        .map(
            (
                item,
                index
            ) => `

                <tr>

                    <td>
                        ${index + 1}
                    </td>


                    <td>

                        <div
                            class="deceased-name"
                        >

                            ${escapeHTML(
                                item.name
                            )}

                        </div>


                        ${
                            item.age

                            ?

                            `
                                <span
                                    class="deceased-age"
                                >

                                    🎂 อายุ
                                    ${escapeHTML(
                                        item.age
                                    )}
                                    ปี

                                </span>

                            `

                            :

                            ""

                        }

                    </td>


                    <td>
                        ${escapeHTML(
                            item.house ||
                            "-"
                        )}
                    </td>


                    <td>

                        ${
                            escapeHTML(
                                item.reporter ||
                                "-"
                            )
                        }

                    </td>


                    <td>

                        ${escapeHTML(
                            displayDate(
                                item.death
                            )
                        )}

                    </td>


                    <td>

                        ${escapeHTML(
                            displayDate(
                                item.cremate
                            )
                        )}

                    </td>


                    <td>

                        <span
                            class="
                                status
                                ${
                                    item.status ===
                                    "นำข้าวสารช่วยเหลือแล้ว"

                                    ?

                                    "done"

                                    :

                                    "pending"
                                }
                            "
                        >

                            ${escapeHTML(
                                item.status
                            )}

                        </span>

                    </td>


                    <td>

                        <div
                            class="action-buttons"
                        >

                            <button
                                class="edit-btn"
                                type="button"
                                onclick="
                                    editFuneral(
                                        '${item.id}'
                                    )
                                "
                            >

                                ✏️ แก้ไข

                            </button>


                            <button
                                class="delete-btn"
                                type="button"
                                onclick="
                                    deleteFuneral(
                                        '${item.id}'
                                    )
                                "
                            >

                                🗑️ ลบ

                            </button>

                        </div>

                    </td>

                </tr>

            `
        )
        .join("");

}


/* =====================================================
   CLEAR
===================================================== */

function clearForm(){

    document
    .getElementById(
        "name"
    )
    .value =
        "";


    document
    .getElementById(
        "age"
    )
    .value =
        "";


    document
    .getElementById(
        "house"
    )
    .value =
        "";


    document
    .getElementById(
        "reporter"
    )
    .value =
        "";


    document
    .getElementById(
        "death"
    )
    .value =
        "";


    document
    .getElementById(
        "cremate"
    )
    .value =
        "";


    document
    .getElementById(
        "status"
    )
    .value =
        "ยังไม่ดำเนินการ";


    editingId =
        null;


    document
    .getElementById(
        "formTitle"
    )
    .innerText =
        "➕ เพิ่มข้อมูลผู้เสียชีวิต";


    document
    .getElementById(
        "cancelButton"
    )
    .style.display =
        "none";

}


/* =====================================================
   SAVE
===================================================== */

function saveFuneral(){

    const name =
        document
        .getElementById(
            "name"
        )
        .value
        .trim();


    const age =
        Number(
            document
            .getElementById(
                "age"
            )
            .value
        );


    const house =
        document
        .getElementById(
            "house"
        )
        .value
        .trim();


    const reporter =
        document
        .getElementById(
            "reporter"
        )
        .value
        .trim();


    const death =
        document
        .getElementById(
            "death"
        )
        .value;


    const cremate =
        document
        .getElementById(
            "cremate"
        )
        .value;


    const status =
        document
        .getElementById(
            "status"
        )
        .value;


    /* =========================
       CHECK
    ========================= */

    if(!name){

        alert(
            "กรุณากรอกชื่อผู้เสียชีวิต"
        );

        return;

    }


    if(
        !age ||
        age < 0 ||
        age > 120
    ){

        alert(
            "กรุณากรอกอายุผู้เสียชีวิต"
        );

        return;

    }


    if(!house){

        alert(
            "กรุณากรอกบ้านเลขที่"
        );

        return;

    }


    if(!reporter){

        alert(
            "กรุณาระบุชื่อผู้แจ้งการเสียชีวิต (ญาติ)"
        );

        return;

    }


    if(!death){

        alert(
            "กรุณากรอกวันที่เสียชีวิต"
        );

        return;

    }


    /* =========================
       EDIT
    ========================= */

    if(
        editingId !== null
    ){

        const item =
            funerals.find(
                row =>
                    String(
                        row.id
                    ) ===
                    String(
                        editingId
                    )
            );


        if(!item){

            alert(
                "ไม่พบข้อมูลที่ต้องการแก้ไข"
            );

            return;

        }


        item.name =
            name;


        item.age =
            age;


        item.house =
            house;


        item.reporter =
            reporter;


        item.death =
            death;


        item.cremate =
            cremate;


        item.status =
            status;


        saveAll();


        alert(
            "แก้ไขข้อมูลเรียบร้อยแล้ว"
        );


        clearForm();

        render();

        return;

    }


    /* =========================
       NEW
    ========================= */

    funerals.push({

        id:
            "funeral-" +
            Date.now() +
            "-" +
            Math.random()
            .toString(36)
            .slice(
                2,
                8
            ),

        name:
            name,

        age:
            age,

        house:
            house,

        reporter:
            reporter,

        death:
            death,

        cremate:
            cremate,

        status:
            status,

        timestamp:
            Date.now()

    });


    saveAll();


    clearForm();

    render();


    alert(
        "บันทึกข้อมูลผู้เสียชีวิตเรียบร้อยแล้ว"
    );

}


/* =====================================================
   EDIT
===================================================== */

function editFuneral(
    id
){

    const item =
        funerals.find(
            row =>
                String(
                    row.id
                ) ===
                String(
                    id
                )
        );


    if(!item){

        alert(
            "ไม่พบข้อมูล"
        );

        return;

    }


    editingId =
        id;


    document
    .getElementById(
        "name"
    )
    .value =
        item.name || "";


    document
    .getElementById(

}


/* =====================================================
   DELETE
===================================================== */

function deleteFuneral(
    id
){

    const item =
        funerals.find(
            row =>
                String(
                    row.id
                ) ===
                String(
                    id
                )
        );


    if(!item){

        return;

    }


    const confirmDelete =
        confirm(

            "ต้องการลบงานศพนี้หรือไม่?\n\n" +

            item.name +

            "\nอายุ " +

            item.age +

            " ปี" +

            "\nบ้านเลขที่ " +

            item.house

        );


    if(!confirmDelete){

        return;

    }


    funerals =
        funerals.filter(
            row =>
                String(
                    row.id
                ) !==
                String(
                    id
                )
        );


    saveAll();

    render();

}
