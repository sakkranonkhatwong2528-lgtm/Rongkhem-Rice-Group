<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ลงทะเบียนรับข้าวสาร | ระบบกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Tahoma,sans-serif;
}

body{
  background: linear-gradient(-45deg, #0b3d26, #0f5132, #198754, #20c997);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  min-height:100vh;
  display: flex;
  flex-direction: column;
  color: #fff;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(10px);
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  animation: slideDown 0.6s ease-out;
}

.btn-back {
  background: rgba(255,255,255,0.2);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.4);
  padding: 8px 16px;
  border-radius: 10px;
  cursor: pointer;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.btn-back:hover {
  background: rgba(255,255,255,0.35);
  transform: translateX(-3px);
}

.container{
  max-width:1000px;
  margin:auto;
  padding:25px;
  flex: 1;
  width: 100%;
}

.card {
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:25px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  border: 1px solid rgba(255,255,255,0.2);
  margin-bottom: 25px;
  animation: fadeInUp 0.8s ease-out;
}

/* ส่วนสรุปข้อมูลงานศพล่าสุด */
.funeral-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  background: rgba(0,0,0,0.15);
  padding: 15px 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  border-left: 4px solid #ffc107;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
  margin-bottom: 20px;
}

.stat-box {
  background: rgba(255,255,255,0.1);
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}

.stat-box h2 {
  font-size: 28px;
  margin-top: 5px;
}

input[type="text"] {
  width: 100%;
  padding: 12px 15px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.2);
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: 0.3s;
}

input[type="text"]::placeholder {
  color: rgba(255,255,255,0.7);
}

/* ตารางเช็กชื่อ */
.table-responsive {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  padding: 14px;
  text-align: left;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}

th {
  background: rgba(0,0,0,0.15);
  font-size: 16px;
}

tr {
  transition: 0.2s;
}

tr:hover {
  background: rgba(255,255,255,0.1);
}

/* ปุ่มสถานะ Checkbox สไตล์ Glass */
.checkbox-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 8px 16px;
  border-radius: 8px;
  background: rgba(220, 53, 69, 0.25);
  border: 1px solid rgba(220, 53, 69, 0.5);
  color: #ff868d;
  font-weight: bold;
  transition: 0.3s;
  user-select: none;
}

.checkbox-btn.checked {
  background: rgba(25, 135, 84, 0.35);
  border-color: rgba(25, 135, 84, 0.8);
  color: #75b798;
}

.checkbox-btn input {
  display: none;
}

@keyframes slideDown {
  from { transform: translateY(-100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes fadeInUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

footer {
  text-align: center;
  padding: 15px;
  background: rgba(0, 0, 0, 0.15);
  font-size: 13px;
  color: rgba(255,255,255,0.7);
}
</style>
</head>

<body>

<header>
  <h2>🌾 เช็กชื่อรับข้าวสาร (งานศพ)</h2>
  <a href="dashboard.html" class="btn-back">⬅️ กลับหน้าหลัก</a>
</header>

<div class="container">

  <div class="card">
    <!-- รายละเอียดงานศพล่าสุด -->
    <div class="funeral-info" id="funeralDetails">
      <div>
        <span style="font-size:12px; color:#ffc107; font-weight:bold;">งานศพล่าสุด</span>
        <h3 id="targetFuneralName" style="font-size: 22px; margin-top:2px;">กำลังโหลด...</h3>
      </div>
      <div id="targetFuneralDate" style="font-size: 14px; opacity:0.9;">-</div>
    </div>

    <!-- สรุปสถานะ -->
    <div class="stat-grid">
      <div class="stat-box">
        <div>สมาชิกทั้งหมด</div>
        <h2 id="totalMem">0</h2>
      </div>
      <div class="stat-box" style="background: rgba(25, 135, 84, 0.2);">
        <div>รับแล้ว</div>
        <h2 id="receivedCount" style="color:#75b798;">0</h2>
      </div>
      <div class="stat-box" style="background: rgba(220, 53, 69, 0.2);">
        <div>ยังไม่ได้รับ (ค้าง)</div>
        <h2 id="pendingCount" style="color:#ff868d;">0</h2>
      </div>
    </div>

    <!-- ช่องค้นหา -->
    <div style="margin-bottom: 15px;">
      <input type="text" id="searchInput" onkeyup="searchMember()" placeholder="🔍 ค้นหาชื่อสมาชิก หรือ บ้านเลขที่...">
    </div>

    <!-- ตารางเช็กรายชื่อ -->
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ลำดับ</th>
            <th>ชื่อ - นามสกุล</th>
            <th>บ้านเลขที่</th>
            <th style="text-align:center;">สถานะการรับข้าวสาร</th>
          </tr>
        </thead>
        <tbody id="receiveTableBody">
          <!-- ข้อมูลจะแสดงที่นี่ -->
        </tbody>
      </table>
    </div>
  </div>

</div>

<footer>
  © 2569 ระบบกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6
</footer>

<script>
// ตรวจสอบการ Login
if(sessionStorage.getItem("loggedIn") !== "true" && localStorage.getItem("loggedIn") !== "true"){
  location.href = "index.html";
}

// โหลดข้อมูล
let members = JSON.parse(localStorage.getItem("members")) || [];
let funerals = JSON.parse(localStorage.getItem("funerals")) || [];

let currentFuneral = null;

// ตรวจสอบงานศพล่าสุด
if(funerals.length > 0) {
  currentFuneral = funerals[funerals.length - 1]; // เลือกงานศพล่าสุด
  if(!Array.isArray(currentFuneral.received)) {
    currentFuneral.received = [];
  }
}

// แสดงรายละเอียดงานศพบนหัวการ์ด
function initFuneralHeader() {
  const nameEl = document.getElementById("targetFuneralName");
  const dateEl = document.getElementById("targetFuneralDate");

  if(currentFuneral) {
    nameEl.textContent = "⚰️ " + currentFuneral.name + " (อายุ " + currentFuneral.age + " ปี)";
    dateEl.textContent = "📅 วันฌาปนกิจ : " + (currentFuneral.burnDate || "-");
  } else {
    nameEl.textContent = "❌ ยังไม่มีการบันทึกงานศพในระบบ";
    dateEl.textContent = "กรุณาไปที่หน้า 'จัดการงานศพ' เพื่อเพิ่มข้อมูลก่อน";
  }
}

// แสดงตารางเช็กชื่อ
function displayChecklist(data) {
  const tbody = document.getElementById("receiveTableBody");
  tbody.innerHTML = "";

  if(!currentFuneral) {
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; opacity:0.7;">กรุณาเพิ่มข้อมูลงานศพก่อนเช็กชื่อ</td></tr>`;
    updateStats();
    return;
  }

  if(data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; opacity:0.7;">ไม่พบรายชื่อสมาชิก</td></tr>`;
    updateStats();
    return;
  }

  data.forEach((member, index) => {
    // เช็กว่าสมาชิกร่างนี้รับข้าวสารไปหรือยัง (เช็กจาก member.id)
    const isReceived = currentFuneral.received.includes(member.id);

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td><strong>${member.name}</strong></td>
      <td>หมู่ 6 บ้านเลขที่ ${member.houseNo}</td>
      <td style="text-align:center;">
        <label class="checkbox-btn ${isReceived ? 'checked' : ''}" id="btn-${member.id}">
          <input type="checkbox" ${isReceived ? 'checked' : ''} onchange="toggleReceive(${member.id})">
          <span id="text-${member.id}">${isReceived ? '✅ รับแล้ว' : '❌ ยังไม่ได้รับ'}</span>
        </label>
      </td>
    `;
    tbody.appendChild(tr);
  });

  updateStats();
}

// ฟังก์ชันเปิด/ปิด สวิตช์รับข้าวสาร
function toggleReceive(memberId) {
  if(!currentFuneral) return;

  const index = currentFuneral.received.indexOf(memberId);
  const btn = document.getElementById(`btn-${memberId}`);
  const text = document.getElementById(`text-${memberId}`);

  if (index === -1) {
    // ถ้ายังไม่มี ให้เพิ่มเข้าไป (รับแล้ว)
    currentFuneral.received.push(memberId);
    btn.classList.add("checked");
    text.textContent = "✅ รับแล้ว";
  } else {
    // ถ้ามีแล้ว ให้เอาออก (ยกเลิกการรับ)
    currentFuneral.received.splice(index, 1);
    btn.classList.remove("checked");
    text.textContent = "❌ ยังไม่ได้รับ";
  }

  // อัปเดตกลับลง LocalStorage
  funerals[funerals.length - 1] = currentFuneral;
  localStorage.setItem("funerals", JSON.stringify(funerals));

  // อัปเดตตัวเลขสรุป
  updateStats();
}

// อัปเดตตัวเลขสรุปด้านบน
function updateStats() {
  const total = members.length;
  const received = currentFuneral ? currentFuneral.received.length : 0;
  const pending = Math.max(total - received, 0);

  document.getElementById("totalMem").textContent = total;
  document.getElementById("receivedCount").textContent = received;
  document.getElementById("pendingCount").textContent = pending;
}

// ค้นหา
function searchMember() {
  const keyword = document.getElementById("searchInput").value.toLowerCase();
  const filtered = members.filter(item => 
    item.name.toLowerCase().includes(keyword) || 
    item.houseNo.toLowerCase().includes(keyword)
  );
  displayChecklist(filtered);
}

// เริ่มทำงานเมื่อเปิดหน้า
initFuneralHeader();
displayChecklist(members);
</script>

</body>
</html>
