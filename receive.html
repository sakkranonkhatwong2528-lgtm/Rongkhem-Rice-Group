<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>รับข้าวสารเข้ากลุ่ม</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:#f3f7f0;
    color:#333;
}

.header{
    background:linear-gradient(135deg,#176b2c,#4caf50);
    color:white;
    padding:22px 15px;
    text-align:center;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.box{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:16px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:13px;
    margin:6px 0;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:0;
    border-radius:10px;
    font-size:16px;
    color:white;
    background:#228B22;
}

button.edit{
    background:#1976d2;
}

button.delete{
    background:#c62828;
}

button.cancel{
    background:#777;
}

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.summary-card{
    background:#f8fff8;
    padding:16px;
    border-radius:12px;
    text-align:center;
}

.number{
    font-size:30px;
    font-weight:bold;
    color:#228B22;
}

.item{
    background:#fafafa;
    padding:15px;
    margin-top:10px;
    border-radius:12px;
    border-left:5px solid #228B22;
}

.item.editing{
    border-left-color:#1976d2;
    background:#f0f7ff;
}

.back{
    display:block;
    text-align:center;
    padding:15px;
    color:#228B22;
    text-decoration:none;
}

.hidden{
    display:none;
}

</style>

</head>

<body>


<div class="header">

<h1>📥 รับข้าวสารเข้ากลุ่ม</h1>

<p>
กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6
</p>

</div>


<div class="container">


<!-- =========================
     สรุป
========================= -->

<div class="box">

<div class="summary">

<div class="summary-card">

📥 รับเข้าทั้งหมด

<div
    class="number"
    id="totalRice"
>
0
</div>

ถุง

</div>


<div class="summary-card">

📋 รายการทั้งหมด

<div
    class="number"
    id="totalItems"
>
0
</div>

รายการ

</div>

</div>

</div>


<!-- =========================
     เพิ่ม / แก้ไข
========================= -->

<div
    class="box"
    id="formBox"
>

<h2 id="formTitle">
➕ บันทึกข้าวสารที่ได้รับ
</h2>


<input
    id="name"
    type="text"
    placeholder="ชื่อ-นามสกุล ผู้ส่งข้าวสาร"
>


<input
    id="house"
    type="text"
    placeholder="บ้านเลขที่"
>


<input
    id="amount"
    type="number"
    min="1"
    placeholder="จำนวนข้าวสาร (ถุง)"
>


<input
    id="note"
    type="text"
    placeholder="หมายเหตุ"
>


<button
    id="saveButton"
    onclick="saveRice()"
>

💾 บันทึกข้าวสารเข้ากลุ่ม

</button>


<button
    id="cancelButton"
    class="cancel hidden"
    onclick="cancelEdit()"
>

ยกเลิกแก้ไข

</button>

</div>


<!-- =========================
     รายการ
========================= -->

<div class="box">

<h2>
📋 ประวัติการรับข้าวสาร
</h2>


<input
    id="search"
    type="text"
    placeholder="ค้นหาชื่อหรือบ้านเลขที่"
    oninput="showList()"
>


<div id="list"></div>

</div>


<a
    class="back"
    href="index.html"
>
← กลับหน้าหลัก
</a>


</div>


<script>

/* =====================================================
   โหลดข้อมูล
===================================================== */

let rice =
    JSON.parse(
        localStorage.getItem("rice")
    ) || [];


let editId = null;


/* =====================================================
   ให้ข้อมูลเดิมมี ID
===================================================== */

rice = rice.map((item,index)=>({

    ...item,

    id:
        item.id ||
        "rice-" +
        Date.now() +
        "-" +
        index,

    type:
        item.type || "รับ",

    amount:
        Number(item.amount || 0),

    name:
        item.name || "",

    house:
        item.house || "",

    note:
        item.note || "",

    date:
        item.date ||
        new Date()
            .toLocaleDateString("th-TH")

}));


saveData();


function saveData(){

    localStorage.setItem(
        "rice",
        JSON.stringify(rice)
    );

}


/* =====================================================
   เพิ่ม / แก้ไข
===================================================== */

function saveRice(){

    const name =
        document.getElementById("name")
            .value.trim();


    const house =
        document.getElementById("house")
            .value.trim();


    const amount =
        Number(
            document.getElementById("amount")
                .value
        );


    const note =
        document.getElementById("note")
            .value.trim();


    if(!name){

        alert(
            "กรุณากรอกชื่อผู้ส่งข้าวสาร"
        );

        return;

    }


    if(!house){

        alert(
            "กรุณากรอกบ้านเลขที่"
        );

        return;

    }


    if(!amount || amount < 1){

        alert(
            "กรุณากรอกจำนวนข้าวสาร"
        );

        return;

    }


    /* =========================
       แก้ไขรายการ
    ========================= */

    if(editId !== null){

        const item =
            rice.find(
                r =>
                String(r.id) ===
                String(editId)
            );


        if(!item){

            alert(
                "ไม่พบรายการ"
            );

            cancelEdit();

            return;

        }


        item.name =
            name;

        item.house =
            house;

        item.amount =
            amount;

        item.note =
            note;


        saveData();


        alert(
            "แก้ไขรายการเรียบร้อยแล้ว"
        );


        cancelEdit();

        showList();

        return;

    }


    /* =========================
       เพิ่มรายการใหม่
    ========================= */

    rice.push({

        id:
            "rice-" +
            Date.now() +
            "-" +
            Math.random()
            .toString(36)
            .substring(2,8),

        type:"รับ",

        name:name,

        house:house,

        amount:amount,

        note:note,

        date:
            new Date()
            .toLocaleDateString("th-TH")

    });


    saveData();


    clearForm();

    showList();


    alert(
        "บันทึกข้าวสารเข้ากลุ่มเรียบร้อยแล้ว"
    );

}


/* =====================================================
   แก้ไข
===================================================== */

function editRice(id){

    const item =
        rice.find(
            r =>
            String(r.id) ===
            String(id)
        );


    if(!item){

        alert(
            "ไม่พบรายการ"
        );

        return;

    }


    editId = id;


    document.getElementById("name")
        .value =
        item.name || "";


    document.getElementById("house")
        .value =
        item.house || "";


    document.getElementById("amount")
        .value =
        item.amount || "";


    document.getElementById("note")
        .value =
        item.note || "";


    document.getElementById("formTitle")
        .innerText =
        "✏️ แก้ไขรายการรับข้าวสาร";


    document.getElementById("saveButton")
        .innerText =
        "💾 บันทึกการแก้ไข";


    document.getElementById("cancelButton")
        .classList
        .remove("hidden");


    document.getElementById("formBox")
        .style.border =
        "2px solid #1976d2";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =====================================================
   ยกเลิกแก้ไข
===================================================== */

function cancelEdit(){

    editId = null;


    clearForm();


    document.getElementById("formTitle")
        .innerText =
        "➕ บันทึกข้าวสารที่ได้รับ";


    document.getElementById("saveButton")
        .innerText =
        "💾 บันทึกข้าวสารเข้ากลุ่ม";


    document.getElementById("cancelButton")
        .classList
        .add("hidden");


    document.getElementById("formBox")
        .style.border =
        "none";

}


/* =====================================================
   ล้างฟอร์ม
===================================================== */

function clearForm(){

    document.getElementById("name")
        .value = "";

    document.getElementById("house")
        .value = "";

    document.getElementById("amount")
        .value = "";

    document.getElementById("note")
        .value = "";

}


/* =====================================================
   ลบรายการ
===================================================== */

function deleteRice(id){

    const item =
        rice.find(
            r =>
            String(r.id) ===
            String(id)
        );


    if(!item){

        return;

    }


    const confirmed =
        confirm(
            "ต้องการลบรายการนี้หรือไม่?\n\n" +
            item.name +
            "\n" +
            "บ้านเลขที่ " +
            item.house +
            "\n" +
            "จำนวน " +
            item.amount +
            " ถุง"
        );


    if(!confirmed){

        return;

    }


    rice =
        rice.filter(
            r =>
            String(r.id) !==
            String(id)
        );


    saveData();

    showList();


    alert(
        "ลบรายการเรียบร้อยแล้ว"
    );

}


/* =====================================================
   แสดงรายการ
===================================================== */

function showList(){

    const keyword =
        document.getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const received =
        rice.filter(
            r =>
            r.type === "รับ"
        );


    const filtered =
        received.filter(item=>{

            const name =
                String(item.name || "")
                    .toLowerCase();


            const house =
                String(item.house || "")
                    .toLowerCase();


            return(
                name.includes(keyword)
                ||
                house.includes(keyword)
            );

        });


    let total = 0;


    received.forEach(item=>{

        total +=
            Number(item.amount || 0);

    });


    document.getElementById("totalRice")
        .innerText =
        total;


    document.getElementById("totalItems")
        .innerText =
        received.length;


    let html = "";


    filtered.forEach((item,index)=>{

        html += `

        <div class="item">

            <strong>

                ${index + 1}.
                ${escapeHTML(item.name)}

            </strong>

            <br>

            🏠 บ้านเลขที่:
            ${escapeHTML(item.house)}

            <br>

            📦 จำนวน:
            <strong>
                ${Number(item.amount)}
                ถุง
            </strong>

            <br>

            📅 วันที่:
            ${escapeHTML(item.date)}

            <br>

            📝 หมายเหตุ:
            ${escapeHTML(item.note || "-")}

            <br>

            <button
                class="edit"
                onclick="
                    editRice(
                        '${escapeAttribute(item.id)}'
                    )
                "
            >

                ✏️ แก้ไข

            </button>


            <button
                class="delete"
                onclick="
                    deleteRice(
                        '${escapeAttribute(item.id)}'
                    )
                "
            >

                🗑 ลบรายการ

            </button>

        </div>

        `;

    });


    if(filtered.length === 0){

        html = `

        <div
            style="
                text-align:center;
                color:#777;
                padding:20px;
            "
        >

            ยังไม่มีรายการรับข้าวสาร

        </div>

        `;

    }


    document.getElementById("list")
        .innerHTML =
        html;

}


/* =====================================================
   ป้องกัน HTML
===================================================== */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value || "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}


/* =====================================================
   เริ่มระบบ
===================================================== */

showList();

</script>

</body>

</html>
