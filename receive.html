<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
รับ-จ่ายข้าวสาร
</title>


<style>

body{
font-family:Tahoma,sans-serif;
margin:0;
background:#f3f7f0;
}


.header{

background:#228B22;
color:white;
padding:20px;
text-align:center;

}


.container{

padding:15px;

}


input,select,button{

width:100%;
padding:12px;
margin:5px 0;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;

}


button{

background:#228B22;
color:white;
border:none;

}


.card{

background:white;
padding:15px;
margin-top:10px;
border-radius:15px;
box-shadow:0 3px 8px #ddd;

}


.summary{

background:#fff;
padding:15px;
border-radius:15px;
text-align:center;
font-size:20px;

}

</style>


</head>


<body>


<div class="header">

<h2>
📦 รับ-จ่ายข้าวสาร
</h2>

<p>
กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6
</p>

</div>



<div class="container">



<div class="summary">

🌾 ข้าวสารคงเหลือ

<br>

<b id="total">
0
</b>

ถุง

</div>



<select id="type">

<option value="รับ">
รับข้าวสารเข้า
</option>


<option value="จ่าย">
จ่ายข้าวสาร
</option>


</select>



<input id="amount"
placeholder="จำนวน (ถุง)"
type="number">



<input id="detail"
placeholder="รายละเอียด เช่น ซื้อเข้า / ช่วยงานศพ">



<button onclick="saveRice()">

💾 บันทึก

</button>



<h3>
รายการรับ-จ่าย
</h3>


<div id="list"></div>



</div>




<script>


let rice =
JSON.parse(localStorage.getItem("rice")) || [];



function show(){


let total=0;

let html="";


rice.forEach((r,i)=>{


if(r.type=="รับ"){

total += Number(r.amount);

}else{

total -= Number(r.amount);

}



html += `

<div class="card">

<b>
${i+1}. ${r.type}
</b>

<br>

จำนวน ${r.amount} ถุง

<br>

${r.detail}

<br>

วันที่ ${r.date}

</div>

`;


});



document.getElementById("total").innerHTML=total;


document.getElementById("list").innerHTML=html;


}



function saveRice(){


let data={

type:
document.getElementById("type").value,


amount:
document.getElementById("amount").value,


detail:
document.getElementById("detail").value,


date:
new Date().toLocaleDateString("th-TH")

};



rice.push(data);


localStorage.setItem(

"rice",

JSON.stringify(rice)

);



document.getElementById("amount").value="";

document.getElementById("detail").value="";


show();


}



show();


</script>


</body>

</html>
