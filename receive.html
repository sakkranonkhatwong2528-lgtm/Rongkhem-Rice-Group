<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>รับข้าวสารเข้ากลุ่ม</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:#f3f7f0;
    color:#333;
}

.header{
    background:linear-gradient(135deg,#176b2c,#4caf50);
    color:white;
    padding:22px 15px;
    text-align:center;
}

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

.box{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:16px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

input,
button{
    width:100%;
    padding:13px;
    margin:7px 0;
    border-radius:10px;
    font-size:16px;
}

input{
    border:1px solid #ccc;
}

button{
    border:0;
    background:#228B22;
    color:white;
}

.summary{
    text-align:center;
    background:#f4fff4;
}

.total{
    font-size:32px;
    font-weight:bold;
    color:#228B22;
}

.item{
    background:#fafafa;
    padding:15px;
    margin-top:10px;
    border-radius:12px;
    border-left:5px solid #228B22;
}

.back{
    display:block;
    text-align:center;
    margin-top:15px;
    text-decoration:none;
    color:#228B22;
}

</style>

</head>

<body>

<div class="header">

<h1>📥 รับข้าวสารเข้ากลุ่ม</h1>

<p>กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</p>

</div>

<div class="container">

<div class="box summary">

<h2>🌾 ข้าวสารในคลัง</h2>

<div class="total" id="totalRice">
0
</div>

ถุง

</div>


<div class="box">

<h2>➕ บันทึกข้าวสารที่ได้รับ</h2>

<input
    id="name"
    type="text"
    placeholder="ชื่อ-นามสกุล ผู้ส่งมอบ"
>

<input
    id="house"
    type="text"
    placeholder="บ้านเลขที่"
>

<input
    id="amount"
    type="number"
    min="1"
    placeholder="จำนวนข้าวสาร (ถุง)"
>

<input
    id="note"
    type="text"
    placeholder="หมายเหตุ"
>

<button onclick="saveRice()">
💾 บันทึกข้าวสารเข้ากลุ่ม
</button>

</div>


<div class="box">

<h2>📋 ประวัติการรับข้าวสาร</h2>

<div id="list"></div>

</div>


<a class="back" href="ดัชนี.html">
← กลับหน้าหลัก
</a>

</div>


<script>

let rice =
    JSON.parse(localStorage.getItem("rice")) || [];


/* แสดงข้อมูล */

function showData(){

    let total = 0;
    let html = "";

    rice.forEach((item,index)=>{

        if(item.type === "รับ"){
            total += Number(item.amount || 0);
        }

        if(item.type === "จ่าย"){
            total -= Number(item.amount || 0);
        }

        if(item.type === "รับ"){

            html += `

                <div class="item">

                    <strong>
                        ${index + 1}. ${item.name || "-"}
                    </strong>

                    <br>

                    🏠 บ้านเลขที่:
                    ${item.house || "-"}

                    <br>

                    📦 จำนวน:
                    ${item.amount} ถุง

                    <br>

                    📅 วันที่:
                    ${item.date}

                    <br>

                    📝 หมายเหตุ:
                    ${item.note || "-"}

                </div>

            `;

        }

    });


    if(total < 0){
        total = 0;
    }

    document.getElementById("totalRice").innerText =
        total;

    document.getElementById("list").innerHTML =
        html || "<p>ยังไม่มีรายการรับข้าวสาร</p>";

}


/* บันทึก */

function saveRice(){

    const name =
        document.getElementById("name").value.trim();

    const house =
        document.getElementById("house").value.trim();

    const amount =
        Number(document.getElementById("amount").value);

    const note =
        document.getElementById("note").value.trim();


    if(!name){

        alert("กรุณากรอกชื่อผู้ส่งมอบ");
        return;

    }


    if(!house){

        alert("กรุณากรอกบ้านเลขที่");
        return;

    }


    if(!amount || amount < 1){

        alert("กรุณากรอกจำนวนข้าวสาร");
        return;

    }


    const item = {

        type:"รับ",

        name:name,

        house:house,

        amount:amount,

        note:note,

        date:new Date().toLocaleDateString("th-TH")

    };


    rice.push(item);


    localStorage.setItem(
        "rice",
        JSON.stringify(rice)
    );


    document.getElementById("name").value = "";
    document.getElementById("house").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("note").value = "";


    showData();

    alert("บันทึกข้าวสารเข้ากลุ่มเรียบร้อยแล้ว");

}


showData();

</script>

</body>

</html>
