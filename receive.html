<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รับข้าวสาร - กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</title>
  <style>
    body { font-family: 'Sarabun', sans-serif; background: #f4f7f6; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 800px; margin: auto; }
    .header { background: #2c3e50; color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
    
    .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
    .search-box input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #ddd; font-size: 15px; }
    th { background: #f8f9fa; color: #2c3e50; }

    .btn-status { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-pending { background: #e74c3c; color: white; }
    .btn-done { background: #27ae60; color: white; cursor: default; }

    .btn-back { display: block; text-align: center; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 style="margin: 0;">🌾 ลงทะเบียนรับข้าวสาร</h2>
    <small>กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</small>
  </div>

  <div class="card">
    <div class="search-box">
      <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="🔍 ค้นหาชื่อ หรือ บ้านเลขที่...">
    </div>

    <table id="receiveTable">
      <thead>
        <tr>
          <th>บ้านเลขที่</th>
          <th>ชื่อ - สกุล</th>
          <th>สถานะ</th>
          <th>การจัดการ</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>91/1</td>
          <td>นายวุฒิภัทร เตชะวงค์</td>
          <td><span style="color:#e74c3c; font-weight:bold;">ค้างส่ง</span></td>
          <td><button class="btn-status btn-pending" onclick="markAsReceived(this)">บันทึกรับข้าว</button></td>
        </tr>
        <tr>
          <td>114</td>
          <td>นายต่วน ทาทอง</td>
          <td><span style="color:#e74c3c; font-weight:bold;">ค้างส่ง</span></td>
          <td><button class="btn-status btn-pending" onclick="markAsReceived(this)">บันทึกรับข้าว</button></td>
        </tr>
        <tr>
          <td>123</td>
          <td>นายเกษมสุข ใฝ่ใจ (ผู้เสียชีวิต)</td>
          <td><span style="color:#7f8c8d; font-weight:bold;">ยกเว้น</span></td>
          <td><button class="btn-status" style="background:#bdc3c7; color:#fff;" disabled>ยกเว้นการส่ง</button></td>
        </tr>
        <tr>
          <td>125</td>
          <td>นายสมชาย ใจดี</td>
          <td><span style="color:#27ae60; font-weight:bold;">รับแล้ว</span></td>
          <td><button class="btn-status btn-done" disabled>✓ ส่งแล้ว</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <a href="index.html" class="btn-back">← กลับหน้าหลัก</a>
</div>

<script>
function filterTable() {
  const input = document.getElementById("searchInput").value.toLowerCase();
  const rows = document.querySelectorAll("#receiveTable tbody tr");

  rows.forEach(row => {
    const text = row.innerText.toLowerCase();
    row.style.display = text.includes(input) ? "" : "none";
  });
}

function markAsReceived(btn) {
  if (confirm("ยืนยันรับข้าวสาร 1 ถัง จากครัวเรือนนี้หรือไม่?")) {
    const row = btn.parentElement.parentElement;
    const statusCell = row.cells[2];
    
    statusCell.innerHTML = '<span style="color:#27ae60; font-weight:bold;">รับแล้ว</span>';
    btn.className = 'btn-status btn-done';
    btn.innerHTML = '✓ ส่งแล้ว';
    btn.disabled = true;
    alert("บันทึกรับข้าวสารเรียบร้อยแล้ว!");
  }
}
</script>

</body>
</html>
