<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌾 รับข้าวสาร - ระบบกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</title>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Sarabun',sans-serif;
}

body{
background:#eef2f5;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.header{
background:linear-gradient(135deg,#0f5132,#198754);
color:#fff;
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.header h1{
font-size:32px;
}

.header p{
margin-top:5px;
opacity:.9;
}

.card{
background:#fff;
padding:20px;
border-radius:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
margin-bottom:20px;
}

.search-box{
display:flex;
gap:10px;
margin-bottom:20px;
}

.search-box input{
flex:1;
padding:14px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

.btn{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.btn-green{
background:#198754;
color:#fff;
}

.btn-red{
background:#dc3545;
color:#fff;
}

.btn-blue{
background:#0d6efd;
color:#fff;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#198754;
color:white;
padding:14px;
}

td{
padding:12px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#f5fff8;
}

.status-pending{
color:#dc3545;
font-weight:bold;
}

.status-success{
color:#198754;
font-weight:bold;
}

.status-disable{
color:#777;
font-weight:bold;
}

#reader{
display:none;
width:320px;
margin:auto;
margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>🌾 ลงทะเบียนรับข้าวสาร</h1>

<p>

กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6

</p>

</div>

<div class="card">

<h2>🔍 ค้นหาสมาชิก</h2>

<br>

<div class="search-box">

<input
id="searchInput"
type="text"
placeholder="ค้นหาชื่อ หรือ บ้านเลขที่..."
onkeyup="filterTable()">

<button
class="btn btn-blue"
onclick="startScanner()">

📷 QR

</button>

</div>

<table id="receiveTable">

<thead>

<tr>

<th>บ้านเลขที่</th>

<th>ชื่อสมาชิก</th>

<th>สถานะ</th>

<th>จัดการ</th>

</tr>

</thead>

<tbody>

<tr>

<td>91/1</td>

<td>นายวุฒิภัทร เตชะวงค์</td>

<td class="status-pending">

ค้างส่ง

</td>

<td>

<button
class="btn btn-green"
onclick="markAsReceived(this)">

รับข้าวสาร

</button>

</td>

</tr>

<tr>

<td>114</td>

<td>นายต่วน ทาทอง</td>

<td class="status-pending">

ค้างส่ง

</td>

<td>

<button
class="btn btn-green"
onclick="markAsReceived(this)">

รับข้าวสาร

</button>

</td>

</tr>

<tr>

<td>123</td>

<td>นายเกษมสุข ใฝ่ใจ (ผู้เสียชีวิต)</td>

<td class="status-disable">

ยกเว้น

</td>

<td>

<button
class="btn btn-red"
disabled>

ยกเว้น

</button>

</td>

</tr>
<tr>

<td>125</td>

<td>นายสมชาย ใจดี</td>

<td class="status-success">

รับแล้ว

</td>

<td>

<button
class="btn btn-green"
disabled>

✓ ส่งแล้ว

</button>

</td>

</tr>

</tbody>

</table>

</div>

<!-- QR Scanner -->

<div class="card">

<h2>📷 สแกน QR สมาชิก</h2>

<br>

<div id="reader"></div>

<br>

<button
class="btn btn-green"
onclick="startScanner()">

📷 เปิดกล้อง

</button>

<button
class="btn btn-red"
onclick="stopScanner()">

❌ ปิดกล้อง

</button>

</div>

<a href="index.html"

style="
display:block;
text-align:center;
margin-top:25px;
text-decoration:none;
font-weight:bold;
color:#555;
">

← กลับหน้าหลัก

</a>

</div>

<script>

function filterTable(){

const input=document
.getElementById("searchInput")
.value
.toLowerCase();

const rows=document.querySelectorAll(

"#receiveTable tbody tr"

);

rows.forEach(row=>{

const txt=row.innerText.toLowerCase();

row.style.display=

txt.includes(input)

?

""

:

"none";

});

}



function markAsReceived(btn){

if(!confirm(

"ยืนยันรับข้าวสาร 1 ถุง จากครัวเรือนนี้หรือไม่?"

))

return;

const row=btn.parentElement.parentElement;

row.cells[2].innerHTML=

'<span class="status-success">รับแล้ว</span>';

btn.innerHTML="✓ ส่งแล้ว";

btn.disabled=true;

alert("บันทึกรับข้าวสารเรียบร้อย");

}

</script>

<script src="js/app.js"></script>

<script src="js/receive.js"></script>

<script src="js/scanner.js"></script>

</body>
</html>
