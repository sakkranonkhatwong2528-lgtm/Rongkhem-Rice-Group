<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>รับข้าวสารเข้ากลุ่ม</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:#f3f7f0;
    color:#333;
}

.header{
    background:linear-gradient(135deg,#176b2c,#4caf50);
    color:white;
    padding:22px 15px;
    text-align:center;
}

.container{
    max-width:800px;
    margin:auto;
    padding:15px;
}

.box{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:16px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:8px;
    border:0;
    border-radius:10px;
    background:#228B22;
    color:white;
    font-size:17px;
}

.summary{
    text-align:center;
    background:#f4fff4;
}

.total{
    font-size:34px;
    font-weight:bold;
    color:#228B22;
}

.item{
    background:#fafafa;
    padding:15px;
    margin-top:10px;
    border-radius:12px;
    border-left:5px solid #228B22;
}

.delete{
    background:#c62828;
}

.back{
    display:block;
    text-align:center;
    padding:15px;
    color:#228B22;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="header">

    <h1>📥 รับข้าวสารเข้ากลุ่ม</h1>

    <p>กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</p>

</div>


<div class="container">


<div class="box summary">

    <h2>🌾 ข้าวสารคงเหลือ</h2>

    <div
        class="total"
        id="balance"
    >
        0
    </div>

    ถุง

</div>


<div class="box">

    <h2>➕ บันทึกการรับข้าวสาร</h2>

    <input
        id="name"
        type="text"
        placeholder="ชื่อ-นามสกุล ผู้ส่งข้าวสาร"
    >

    <input
        id="house"
        type="text"
        placeholder="บ้านเลขที่"
    >

    <input
        id="amount"
        type="number"
        min="1"
        placeholder="จำนวนข้าวสาร (ถุง)"
    >

    <input
        id="note"
        type="text"
        placeholder="หมายเหตุ เช่น สมาชิกนำมาสมทบ"
    >

    <button onclick="saveRice()">
        💾 บันทึกข้าวสารเข้ากลุ่ม
    </button>

</div>


<div class="box">

    <h2>📋 ประวัติการรับข้าวสาร</h2>

    <div id="list"></div>

</div>


<a
    class="back"
    href="index.html"
>
    ← กลับหน้าหลัก
</a>


</div>


<script>

let rice = [];

try{

    rice =
        JSON.parse(
            localStorage.getItem("rice")
        ) || [];

}catch(error){

    rice = [];

}


/* แสดงยอด */

function showData(){

    let total = 0;

    let html = "";


    rice.forEach((item,index)=>{

        if(item.type === "รับ"){

            total +=
                Number(item.amount || 0);

        }


        if(item.type === "จ่าย"){

            total -=
                Number(item.amount || 0);

        }


    });


    if(total < 0){
        total = 0;
    }


    document.getElementById("balance")
        .innerText = total;


    const received =
        rice.filter(
            item =>
            item.type === "รับ"
        );


    received.forEach((item,index)=>{

        html += `

        <div class="item">

            <strong>
                ${index + 1}. ${escapeHTML(item.name)}
            </strong>

            <br>

            🏠 บ้านเลขที่:
            ${escapeHTML(item.house)}

            <br>

            📦 รับเข้า:
            ${Number(item.amount)} ถุง

            <br>

            📅 วันที่:
            ${escapeHTML(item.date)}

            <br>

            📝 หมายเหตุ:
            ${escapeHTML(item.note || "-")}

        </div>

        `;

    });


    document.getElementById("list")
        .innerHTML =
        html ||
        "<p>ยังไม่มีรายการรับข้าวสาร</p>";

}


/* บันทึก */

function saveRice(){

    const name =
        document.getElementById("name")
            .value.trim();


    const house =
        document.getElementById("house")
            .value.trim();


    const amount =
        Number(
            document.getElementById("amount")
                .value
        );


    const note =
        document.getElementById("note")
            .value.trim();


    if(!name){

        alert(
            "กรุณากรอกชื่อผู้ส่งข้าวสาร"
        );

        return;

    }


    if(!house){

        alert(
            "กรุณากรอกบ้านเลขที่"
        );

        return;

    }


    if(!amount || amount < 1){

        alert(
            "กรุณากรอกจำนวนข้าวสาร"
        );

        return;

    }


    rice.push({

        id:Date.now(),

        type:"รับ",

        name:name,

        house:house,

        amount:amount,

        note:note,

        date:
            new Date()
            .toLocaleDateString("th-TH")

    });


    localStorage.setItem(
        "rice",
        JSON.stringify(rice)
    );


    document.getElementById("name")
        .value = "";

    document.getElementById("house")
        .value = "";

    document.getElementById("amount")
        .value = "";

    document.getElementById("note")
        .value = "";


    showData();


    alert(
        "บันทึกข้าวสารเข้ากลุ่มเรียบร้อยแล้ว"
    );

}


/* ป้องกัน HTML */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


showData();

</script>

</body>

</html>
