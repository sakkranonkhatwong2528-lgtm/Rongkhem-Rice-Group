<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายงานและสรุปภาพรวม | ระบบกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Tahoma,sans-serif;
}

body{
  background: linear-gradient(-45deg, #0b3d26, #0f5132, #198754, #20c997);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  min-height:100vh;
  display: flex;
  flex-direction: column;
  color: #fff;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(10px);
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  animation: slideDown 0.6s ease-out;
}

.btn-back {
  background: rgba(255,255,255,0.2);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.4);
  padding: 8px 16px;
  border-radius: 10px;
  cursor: pointer;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.btn-back:hover {
  background: rgba(255,255,255,0.35);
  transform: translateX(-3px);
}

.container{
  max-width:1000px;
  margin:auto;
  padding:25px;
  flex: 1;
  width: 100%;
}

.card {
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:25px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  border: 1px solid rgba(255,255,255,0.2);
  margin-bottom: 25px;
  animation: fadeInUp 0.8s ease-out;
}

/* สรุปตัวเลขสถิติ */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 20px;
}

.stat-card {
  background: rgba(0,0,0,0.15);
  padding: 20px;
  border-radius: 14px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.1);
}

.stat-card h2 {
  font-size: 32px;
  margin-top: 8px;
  color: #ffda6a;
}

/* ตารางรายงาน */
.table-responsive {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  padding: 14px;
  text-align: left;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}

th {
  background: rgba(0,0,0,0.15);
  font-size: 16px;
}

tr:hover {
  background: rgba(255,255,255,0.1);
}

.btn-print {
  background: #ffc107;
  color: #000;
  border: none;
  padding: 10px 20px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  font-size: 15px;
  transition: 0.3s;
  box-shadow: 0 4px 10px rgba(255, 193, 7, 0.3);
}

.btn-print:hover {
  background: #e0a800;
  transform: translateY(-2px);
}

@keyframes slideDown {
  from { transform: translateY(-100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes fadeInUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

footer {
  text-align: center;
  padding: 15px;
  background: rgba(0, 0, 0, 0.15);
  font-size: 13px;
  color: rgba(255,255,255,0.7);
}

/* สำหรับเวลาสั่งพิมพ์ PDF/กระดาษ */
@media print {
  body {
    background: #fff !important;
    color: #000 !important;
  }
  header, .btn-back, .btn-print, footer {
    display: none !important;
  }
  .card {
    background: #fff !important;
    color: #000 !important;
    box-shadow: none !important;
    border: none !important;
  }
  th, td {
    border-bottom: 1px solid #ccc !important;
    color: #000 !important;
  }
  th {
    background: #eee !important;
  }
  .stat-card {
    border: 1px solid #ccc !important;
    background: #fff !important;
  }
  .stat-card h2 {
    color: #000 !important;
  }
}
</style>
</head>

<body>

<header>
  <h2>📊 รายงานและสรุปภาพรวม</h2>
  <a href="dashboard.html" class="btn-back">⬅️ กลับหน้าหลัก</a>
</header>

<div class="container">

  <!-- ปุ่มพิมพ์รายงาน -->
  <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
    <button class="btn-print" onclick="window.print()">🖨️ พิมพ์รายงาน / บันทึก PDF</button>
  </div>

  <!-- การ์ดสรุปตัวเลขรวม -->
  <div class="card">
    <h3>📈 สถิติภาพรวมระบบ</h3>
    <div class="stats-grid" style="margin-top:15px;">
      <div class="stat-card">
        <div>สมาชิกทั้งหมด</div>
        <h2 id="totalMembers">0</h2>
      </div>
      <div class="stat-card">
        <div>ประวัติงานศพทั้งหมด</div>
        <h2 id="totalFunerals">0</h2>
      </div>
      <div class="stat-card">
        <div>ข้าวสารในคลัง</div>
        <h2 id="stockBalance">0</h2>
      </div>
    </div>
  </div>

  <!-- ตารางสรุปประวัติงานศพและการแจกจ่าย -->
  <div class="card">
    <h3>📋 สรุปการแจกจ่ายข้าวสารตามงานศพ</h3>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ลำดับ</th>
            <th>ชื่อผู้วายชนม์</th>
            <th>วันฌาปนกิจ</th>
            <th>จำนวนสมาชิกที่รับแล้ว</th>
            <th>คงค้างรับ</th>
          </tr>
        </thead>
        <tbody id="reportTableBody">
          <!-- ข้อมูลจะแสดงที่นี่ -->
        </tbody>
      </table>
    </div>
  </div>

</div>

<footer>
  © 2569 ระบบกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6
</footer>

<script>
// ตรวจสอบการ Login
if(sessionStorage.getItem("loggedIn") !== "true" && localStorage.getItem("loggedIn") !== "true"){
  location.href = "index.html";
}

// โหลดข้อมูล
const members = JSON.parse(localStorage.getItem("members")) || [];
const funerals = JSON.parse(localStorage.getItem("funerals")) || [];
const stockList = JSON.parse(localStorage.getItem("stockList")) || [];

// คำนวณสรุปสต็อก
let inSum = 0;
let outSum = 0;
stockList.forEach(item => {
  if (item.type === "in") inSum += item.amount;
  else outSum += item.amount;
});
const balance = inSum - outSum;

// แสดงผลตัวเลขสถิติ
document.getElementById("totalMembers").textContent = members.length + " ครัวเรือน";
document.getElementById("totalFunerals").textContent = funerals.length + " งาน";
document.getElementById("stockBalance").textContent = balance + " ถุง";

// แสดงตารางสรุป
function displayReport() {
  const tbody = document.getElementById("reportTableBody");
  tbody.innerHTML = "";

  if (funerals.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; opacity:0.7;">ยังไม่มีประวัติงานศพ</td></tr>`;
    return;
  }

  funerals.forEach((item, index) => {
    const receivedArray = Array.isArray(item.received) ? item.received : [];
    const receivedCount = receivedArray.length;
    const pendingCount = Math.max(members.length - receivedCount, 0);

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td><strong>${item.name}</strong></td>
      <td>${item.burnDate || '-'}</td>
      <td style="color:#75b798;"><strong>${receivedCount}</strong> ครัวเรือน</td>
      <td style="color:#ff868d;"><strong>${pendingCount}</strong> ครัวเรือน</td>
    `;
    tbody.appendChild(tr);
  });
}

displayReport();
</script>

</body>
</html>
