<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
📊 รายงานข้อมูลกลุ่มข้าวสาร
</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    padding:15px;

    font-family:
        Tahoma,
        "Noto Sans Thai",
        sans-serif;

    color:#fff;

    min-height:100vh;

    background:
        linear-gradient(
            135deg,
            #03140b,
            #07351d 45%,
            #0f7a3b
        );

}

.container{

    max-width:1200px;

    margin:auto;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    text-align:center;

    padding:30px 20px;

    border-radius:25px;

    background:
        rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,255,255,.18);

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.25);

    margin-bottom:20px;

}

.header-icon{

    font-size:55px;

}

.header h1{

    margin:
        10px 0 5px;

    font-size:
        clamp(
            28px,
            5vw,
            45px
        );

}

.header p{

    margin:0;

    color:#b9e9c7;

}


/* =====================================================
   CARD
===================================================== */

.card{

    padding:22px;

    margin-bottom:20px;

    border-radius:24px;

    background:
        rgba(255,255,255,.09);

    border:
        1px solid
        rgba(255,255,255,.16);

    backdrop-filter:
        blur(14px);

    box-shadow:
        0 18px 50px
        rgba(0,0,0,.20);

}

.card h2{

    margin-top:0;

    color:#fff0b0;

}


/* =====================================================
   SELECT
===================================================== */

.select-row{

    display:grid;

    grid-template-columns:
        1fr 140px;

    gap:10px;

}

select{

    width:100%;

    padding:14px;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:13px;

    background:
        rgba(0,0,0,.20);

    color:#fff;

    outline:none;

}

select option{

    color:#222;

}

button{

    padding:13px;

    border:0;

    border-radius:13px;

    color:#fff;

    font-weight:900;

    background:#1b8543;

    cursor:pointer;

}


/* =====================================================
   FUNERAL HEADER
===================================================== */

.funeral-head{

    padding:20px;

    border-radius:18px;

    background:
        rgba(255,255,255,.07);

}

.funeral-name{

    font-size:
        clamp(
            25px,
            4vw,
            38px
        );

    font-weight:900;

}

.funeral-age{

    font-size:.55em;

    margin-left:8px;

    color:#e9ced8;

}

.funeral-info{

    margin-top:12px;

    line-height:2;

    color:#c7ecd0;

}


/* =====================================================
   SUMMARY
===================================================== */

.summary{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;

    margin-top:15px;

}

.summary-box{

    padding:18px;

    border-radius:18px;

    text-align:center;

    background:
        rgba(255,255,255,.07);

}

.summary-icon{

    font-size:32px;

}

.summary-number{

    margin-top:5px;

    font-size:35px;

    font-weight:900;

}

.summary-label{

    color:#b9e9c7;

    font-size:13px;

}

.red{

    color:#ff8f8f;

}

.green{

    color:#9ef0b2;

}

.gold{

    color:#ffe27b;

}


/* =====================================================
   TABLE
===================================================== */

.table-wrap{

    overflow-x:auto;

}

table{

    width:100%;

    min-width:700px;

    border-collapse:
        collapse;

}

th{

    padding:12px;

    text-align:left;

    color:#fff0b0;

    background:
        rgba(255,255,255,.08);

}

td{

    padding:12px;

    border-bottom:
        1px solid
        rgba(255,255,255,.09);

}

.sent-status{

    color:#9ef0b2;

    font-weight:900;

}

.not-sent-status{

    color:#ff8f8f;

    font-weight:900;

}


/* =====================================================
   SECTION
===================================================== */

.section{

    margin-top:25px;

}

.section h3{

    margin-bottom:10px;

}

.sent-title{

    color:#9ef0b2;

}

.not-title{

    color:#ff8f8f;

}

.empty{

    padding:20px;

    text-align:center;

    border-radius:15px;

    background:
        rgba(255,255,255,.05);

    color:#a9ceb1;

}


/* =====================================================
   BUTTON
===================================================== */

.print-button{

    width:100%;

    margin-top:20px;

    padding:14px;

    background:#1766ad;

}

.back-button{

    display:block;

    width:100%;

    margin-top:10px;

    text-align:center;

    text-decoration:none;

    padding:14px;

    border-radius:13px;

    color:#fff;

    background:#555;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    .summary{

        grid-template-columns:
            repeat(2,1fr);

    }

}

@media(max-width:600px){

    body{

        padding:8px;

    }

    .select-row{

        grid-template-columns:
            1fr;

    }

    .summary{

        grid-template-columns:
            1fr 1fr;

    }

}

@media print{

    body{

        background:#fff;

        color:#000;

    }

    .header,
    .card{

        background:#fff;

        color:#000;

        box-shadow:none;

        border:
            1px solid
            #ddd;

    }

    .select-row,
    .print-button,
    .back-button{

        display:none;

    }

    .funeral-head{

        background:#f5f5f5;

    }

    .summary-box{

        background:#f5f5f5;

        color:#000;

    }

    th{

        color:#000;

        background:#eee;

    }

    td{

        color:#000;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="header-icon">
        📊
    </div>

    <h1>
        รายงานข้อมูลกลุ่มข้าวสาร
    </h1>

    <p>
        บ้านร่องเข็ม หมู่ที่ 6
    </p>

</div>


<!-- =====================================================
     SELECT FUNERAL
===================================================== -->

<div class="card">

    <h2>
        ⚰️ เลือกงานศพ
    </h2>

    <div class="select-row">

        <select
            id="funeralSelect"
        >

            <option value="">
                -- เลือกงานศพ --
            </option>

        </select>


        <button
            id="showButton"
            type="button"
        >

            📊 ดูรายงาน

        </button>

    </div>

</div>


<!-- =====================================================
     REPORT
===================================================== -->

<div
    id="reportArea"
>

    <div class="card">

        <div class="empty">

            กรุณาเลือกงานศพ
            เพื่อดูรายงาน

        </div>

    </div>

</div>


<a
    href="index.html"
    class="back-button"
>

    ⬅ กลับหน้าหลัก

</a>


</div>


<script>

/* =====================================================
   READ ARRAY
===================================================== */

function readArray(
    key
){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(
                    key
                )
            );


        return Array.isArray(
            data
        )
        ? data
        : [];

    }
    catch(error){

        console.error(
            error
        );

        return [];

    }

}


/* =====================================================
   MEMBERS
===================================================== */

function readMembers(){

    const keys = [

        "members",
        "memberList",
        "membersData",
        "memberData",
        "users"

    ];


    for(
        const key
        of keys
    ){

        const data =
            readArray(
                key
            );


        if(
            data.length
        ){

            return data;

        }

    }


    return [];

}


function getMemberName(
    item
){

    return String(

        item.name ??
        item.fullName ??
        item.fullname ??
        item.memberName ??
        item.member_name ??
        item["ชื่อ-นามสกุล"] ??
        item["ชื่อ"] ??
        ""

    ).trim();

}


function getMemberHouse(
    item
){

    return String(

        item.house ??
        item.houseNo ??
        item.houseNumber ??
        item.house_number ??
        item.address ??
        item.household ??
        item["บ้านเลขที่"] ??
        ""

    ).trim();

}


function getMemberId(
    item,
    index
){

    return String(

        item.id ??
        item.memberId ??
        item.member_id ??
        item.code ??
        (
            "member-" +
            index
        )

    );

}


/* =====================================================
   FUNERAL
===================================================== */

function readFunerals(){

    const data =
        readArray(
            "funerals"
        );


    return data.map(
        (
            item,
            index
        ) => ({

            id:
                String(
                    item.id ??
                    item.funeralId ??
                    (
                        "funeral-" +
                        index
                    )
                ),

            name:
                String(
                    item.name ??
                    ""
                ),

            age:
                item.age ??
                "",

            house:
                String(
                    item.house ??
                    ""
                ),

            reporter:
                String(
                    item.reporter ??
                    ""
                ),

            death:
                String(
                    item.death ??
                    ""
                ),

            cremate:
                String(
                    item.cremate ??
                    ""
                )

        })

    )
    .sort(
        (
            a,
            b
        ) =>

            parseFuneralDate(
                b.death
            )
            -
            parseFuneralDate(
                a.death
            )

    );

}


/* =====================================================
   DATE
===================================================== */

function parseFuneralDate(
    value
){

    const text =
        String(
            value ??
            ""
        )
        .trim();


    if(
        !text
    ){

        return 0;

    }


    const parts =
        text
        .replaceAll(
            "-",
            "/"
        )
        .split(
            "/"
        );


    if(
        parts.length === 3
    ){

        const day =
            Number(
                parts[0]
            );

        const month =
            Number(
                parts[1]
            );

        let year =
            Number(
                parts[2]
            );


        if(
            year > 2400
        ){

            year -= 543;

        }


        return new Date(
            year,
            month - 1,
            day
        )
        .getTime();

    }


    const months = {

        มกราคม:0,
        กุมภาพันธ์:1,
        มีนาคม:2,
        เมษายน:3,
        พฤษภาคม:4,
        มิถุนายน:5,
        กรกฎาคม:6,
        สิงหาคม:7,
        กันยายน:8,
        ตุลาคม:9,
        พฤศจิกายน:10,
        ธันวาคม:11

    };


    const words =
        text.split(" ");


    if(
        words.length === 3 &&
        months[
            words[1]
        ] !== undefined
    ){

        const day =
            Number(
                words[0]
            );

        let year =
            Number(
                words[2]
            );


        if(
            year > 2400
        ){

            year -= 543;

        }


        return new Date(
            year,
            months[
                words[1]
            ],
            day
        )
        .getTime();

    }


    return 0;

}


/* =====================================================
   DELIVERY
===================================================== */

function readDeliveries(){

    return readArray(
        "riceDeliveryRecords"
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(
    value
){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            value ??
            ""
        );


    return div.innerHTML;

}


/* =====================================================
   POPULATE FUNERAL
===================================================== */

function populateFunerals(){

    const select =
        document.getElementById(
            "funeralSelect"
        );


    const funerals =
        readFunerals();


    select.innerHTML =

        `
            <option value="">
                -- เลือกงานศพ --
            </option>
        `

        +

        funerals
        .map(
            funeral => `

                <option
                    value="${escapeHTML(
                        funeral.id
                    )}"
                >

                    ⚰️
                    ${escapeHTML(
                        funeral.name
                    )}

                    ${
                        funeral.age
                        ?
                        " อายุ " +
                        escapeHTML(
                            funeral.age
                        ) +
                        " ปี"
                        :
                        ""
                    }

                </option>

            `
        )
        .join("");

}


/* =====================================================
   RENDER REPORT
===================================================== */

function renderReport(){

    const select =
        document.getElementById(
            "funeralSelect"
        );


    const area =
        document.getElementById(
            "reportArea"
        );


    const funeral =
        readFunerals()
        .find(
            item =>

                String(
                    item.id
                ) ===

                String(
                    select.value
                )

        );


    if(
        !funeral
    ){

        area.innerHTML = `

            <div class="card">

                <div class="empty">

                    กรุณาเลือกงานศพ
                    เพื่อดูรายงาน

                </div>

            </div>

        `;

        return;

    }


    /* =================================================
       สมาชิก
    ================================================= */

    const members =
        readMembers()
        .map(
            (
                item,
                index
            ) => ({

                id:
                    getMemberId(
                        item,
                        index
                    ),

                name:
                    getMemberName(
                        item
                    ),

                house:
                    getMemberHouse(
                        item
                    )

            })
        )
        .filter(
            item =>
                item.name ||
                item.house
        );


    /* =================================================
       ข้าวสารของศพนี้เท่านั้น
    ================================================= */

    const deliveries =
        readDeliveries()
        .filter(
            record =>

                String(
                    record.funeralId
                ) ===

                String(
                    funeral.id
                )

        );


    const sentIds =
        new Set(
            deliveries.map(
                record =>
                    String(
                        record.memberId
                    )
            )
        );


    const sentMembers =
        members.filter(
            member =>
                sentIds.has(
                    String(
                        member.id
                    )
                )
        );


    const notSentMembers =
        members.filter(
            member =>
                !sentIds.has(
                    String(
                        member.id
                    )
                )
        );


    const totalBags =
        deliveries.reduce(
            (
                total,
                record
            ) =>

                total +
                Number(
                    record.amount ||
                    0
                ),

            0
        );


    const sentCount =
        sentMembers.length;


    const notSentCount =
        notSentMembers.length;


    /* =================================================
       REPORT HTML
    ================================================= */

    area.innerHTML = `

        <!-- ==========================
             ชื่องานศพ
        =========================== -->

        <div class="card">

            <div class="funeral-head">

                <div class="funeral-name">

                    ⚰️
                    ${escapeHTML(
                        funeral.name
                    )}

                    ${
                        funeral.age

                        ?

                        `<span
                            class="funeral-age"
                        >

                            อายุ
                            ${escapeHTML(
                                funeral.age
                            )}
                            ปี

                        </span>`

                        :

                        ""

                    }

                </div>


                <div class="funeral-info">

                    🏠 บ้านเลขที่
                    ${escapeHTML(
                        funeral.house ||
                        "-"
                    )}

                    <br>

                    📅 วันที่เสียชีวิต
                    ${escapeHTML(
                        funeral.death ||
                        "-"
                    )}

                    <br>

                    🔥 วันที่ฌาปนกิจ
                    ${escapeHTML(
                        funeral.cremate ||
                        "-"
                    )}

                </div>

            </div>


            <!-- =====================
                 SUMMARY
            ====================== -->

            <div class="summary">


                <div class="summary-box">

                    <div class="summary-icon">
                        👥
                    </div>

                    <span
                        class="summary-number"
                    >

                        ${members.length}

                    </span>

                    <span
                        class="summary-label"
                    >

                        สมาชิกทั้งหมด

                    </span>

                </div>


                <div class="summary-box">

                    <div class="summary-icon">
                        ✅
                    </div>

                    <span
                        class="
                            summary-number
                            green
                        "
                    >

                        ${sentCount}

                    </span>

                    <span
                        class="summary-label"
                    >

                        ส่งแล้ว

                    </span>

                </div>


                <div class="summary-box">

                    <div class="summary-icon">
                        ❌
                    </div>

                    <span
                        class="
                            summary-number
                            red
                        "
                    >

                        ${notSentCount}

                    </span>

                    <span
                        class="summary-label"
                    >

                        ยังไม่ส่ง

                    </span>

                </div>


                <div class="summary-box">

                    <div class="summary-icon">
                        🌾
                    </div>

                    <span
                        class="
                            summary-number
                            gold
                        "
                    >

                        ${totalBags}

                    </span>

                    <span
                        class="summary-label"
                    >

                        ข้าวสาร (ถุง)

                    </span>

                </div>

            </div>

        </div>


        <!-- ==========================
             ผู้ส่ง
        =========================== -->

        <div class="card section">

            <h2 class="sent-title">

                ✅ รายชื่อสมาชิกที่ส่งข้าวสารแล้ว

            </h2>


            ${
                sentMembers.length

                ?

                `

                <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ลำดับ
                            </th>

                            <th>
                                ชื่อสมาชิก
                            </th>

                            <th>
                                บ้านเลขที่
                            </th>

                            <th>
                                จำนวนข้าว
                            </th>

                            <th>
                                วันที่ส่ง
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${
                            sentMembers
                            .map(
                                (
                                    member,
                                    index
                                ) => {

                                    const records =
                                        deliveries
                                        .filter(
                                            record =>

                                                String(
                                                    record.memberId
                                                ) ===

                                                String(
                                                    member.id
                                                )

                                        );


                                    const amount =
                                        records.reduce(
                                            (
                                                total,
                                                record
                                            ) =>
                                                total +
                                                Number(
                                                    record.amount ||
                                                    0
                                                ),
                                            0
                                        );


                                    const last =
                                        records[
                                            records.length -
                                            1
                                        ];


                                    return `

                                        <tr>

                                            <td>
                                                ${
                                                    index + 1
                                                }
                                            </td>

                                            <td>
                                                ${escapeHTML(
                                                    member.name
                                                )}
                                            </td>

                                            <td>
                                                ${escapeHTML(
                                                    member.house ||
                                                    "-"
                                                )}
                                            </td>

                                            <td
                                                class="
                                                    sent-status
                                                "
                                            >

                                                ${amount}
                                                ถุง

                                            </td>

                                            <td>
                                                ${escapeHTML(
                                                    last?.date ||
                                                    "-"
                                                )}
                                            </td>

                                        </tr>

                                    `;

                                }
                            )
                            .join("")
                        }

                    </tbody>

                </table>

                </div>

                `

                :

                `

                <div class="empty">

                    ยังไม่มีสมาชิกนำข้าวสาร
                    มาส่งสำหรับงานศพนี้

                </div>

                `

            }

        </div>


        <!-- ==========================
             ไม่ส่ง
        =========================== -->

        <div class="card section">

            <h2 class="not-title">

                ❌ รายชื่อสมาชิกที่ยังไม่ส่ง

            </h2>


            ${
                notSentMembers.length

                ?

                `

                <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ลำดับ
                            </th>

                            <th>
                                ชื่อสมาชิก
                            </th>

                            <th>
                                บ้านเลขที่
                            </th>

                            <th>
                                สถานะ
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${
                            notSentMembers
                            .map(
                                (
                                    member,
                                    index
                                ) => `

                                    <tr>

                                        <td>
                                            ${
                                                index + 1
                                            }
                                        </td>

                                        <td>
                                            ${escapeHTML(
                                                member.name
                                            )}
                                        </td>

                                        <td>
                                            ${escapeHTML(
                                                member.house ||
                                                "-"
                                            )}
                                        </td>

                                        <td
                                            class="
                                                not-sent-status
                                            "
                                        >

                                            ❌ ยังไม่ส่ง

                                        </td>

                                    </tr>

                                `
                            )
                            .join("")
                        }

                    </tbody>

                </table>

                </div>

                `

                :

                `

                <div class="empty">

                    ✅ สมาชิกทุกครัวเรือน
                    ส่งข้าวสารสำหรับงานศพนี้แล้ว

                </div>

                `

            }

        </div>


        <button
            class="print-button"
            type="button"
            onclick="window.print()"
        >

            🖨️ พิมพ์รายงานงานศพนี้

        </button>

    `;

}


/* =====================================================
   EVENTS
===================================================== */

document
.getElementById(
    "showButton"
)
.addEventListener(
    "click",
    renderReport
);


document
.getElementById(
    "funeralSelect"
)
.addEventListener(
    "change",
    renderReport
);


/* =====================================================
   INIT
===================================================== */

populateFunerals();

</script>

</body>

</html>
