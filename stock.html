<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>คลังข้าวสาร</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:#f3f7f0;
    color:#333;
}

.header{
    background:linear-gradient(135deg,#176b2c,#4caf50);
    color:white;
    padding:22px 15px;
    text-align:center;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.box{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:16px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.summary-card{
    background:#f8fff8;
    padding:18px;
    border-radius:14px;
    text-align:center;
}

.icon{
    font-size:35px;
}

.number{
    font-size:30px;
    font-weight:bold;
    color:#228B22;
}

.red{
    color:#c62828;
}

.balance{
    grid-column:1 / -1;
    background:#e8f7e8;
}

.item{
    background:#fafafa;
    padding:15px;
    margin-top:10px;
    border-radius:12px;
    border-left:5px solid #228B22;
}

.out-item{
    border-left-color:#c62828;
    background:#fff8f8;
}

.empty{
    text-align:center;
    color:#777;
    padding:15px;
}

.back{
    display:block;
    text-align:center;
    padding:15px;
    color:#228B22;
    text-decoration:none;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#228B22;
    color:white;
    font-size:16px;
}

@media(max-width:600px){

    .summary{
        grid-template-columns:1fr 1fr;
    }

}

@media print{

    button,
    .back{
        display:none;
    }

    body{
        background:white;
    }

    .header{
        background:white;
        color:#333;
    }

}

</style>

</head>

<body>


<div class="header">

<h1>🌾 คลังข้าวสาร</h1>

<p>กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</p>

</div>


<div class="container">


<div class="box">

<div class="summary">


<div class="summary-card">

<div class="icon">📥</div>

รับเข้าทั้งหมด

<div
    class="number"
    id="riceIn"
>
0
</div>

ถุง

</div>


<div class="summary-card">

<div class="icon">📤</div>

นำออกทั้งหมด

<div
    class="number red"
    id="riceOut"
>
0
</div>

ถุง

</div>


<div class="summary-card balance">

<div class="icon">🌾</div>

ข้าวสารคงเหลือ

<div
    class="number"
    id="riceBalance"
>
0
</div>

ถุง

</div>


</div>

</div>


<div class="box">

<h2>📋 รายการรับข้าวสาร</h2>

<div id="receiveList"></div>

</div>


<div class="box">

<h2>⚰️ รายการนำข้าวสารช่วยงานศพ</h2>

<div id="funeralList"></div>

</div>


<div class="box">

<h2>📤 รายการจ่ายข้าวสารอื่น ๆ</h2>

<div id="outList"></div>

</div>


<button onclick="window.print()">

🖨️ พิมพ์รายงานคลังข้าวสาร

</button>


<a
    class="back"
    href="index.html"
>
← กลับหน้าหลัก
</a>


</div>


<script>

/* =====================================================
   โหลดข้อมูล
===================================================== */

const rice =
    JSON.parse(
        localStorage.getItem("rice")
    ) || [];


const funeralSends =
    JSON.parse(
        localStorage.getItem("funeralSends")
    ) || [];


const funerals =
    JSON.parse(
        localStorage.getItem("funerals")
    ) || [];


/* =====================================================
   คำนวณยอดรับ
===================================================== */

let totalIn = 0;

let normalOut = 0;


rice.forEach(item => {

    if(item.type === "รับ"){

        totalIn +=
            Number(item.amount || 0);

    }

    if(item.type === "จ่าย"){

        normalOut +=
            Number(item.amount || 0);

    }

});


/* =====================================================
   คำนวณยอดช่วยงานศพ
===================================================== */

let funeralOut = 0;

funeralSends.forEach(item => {

    funeralOut +=
        Number(item.amount || 0);

});


/* =====================================================
   รวมยอดนำออก
===================================================== */

const totalOut =
    normalOut +
    funeralOut;


/* =====================================================
   คงเหลือ
===================================================== */

let balance =
    totalIn -
    totalOut;


if(balance < 0){

    balance = 0;

}


/* =====================================================
   แสดงยอด
===================================================== */

document.getElementById("riceIn")
    .innerText =
    totalIn;


document.getElementById("riceOut")
    .innerText =
    totalOut;


document.getElementById("riceBalance")
    .innerText =
    balance;


/* =====================================================
   รายการรับ
===================================================== */

let receiveHTML = "";

const receives =
    rice.filter(
        item =>
        item.type === "รับ"
    );


receives.forEach((item,index)=>{

    receiveHTML += `

    <div class="item">

        <strong>
            ${index + 1}. ${escapeHTML(item.name)}
        </strong>

        <br>

        🏠 บ้านเลขที่:
        ${escapeHTML(item.house)}

        <br>

        📦 รับเข้า:
        ${Number(item.amount || 0)}
        ถุง

        <br>

        📅 วันที่:
        ${escapeHTML(item.date)}

        <br>

        📝 หมายเหตุ:
        ${escapeHTML(item.note || "-")}

    </div>

    `;

});


document.getElementById("receiveList")
    .innerHTML =
    receiveHTML ||
    `<div class="empty">
        ยังไม่มีรายการรับข้าวสาร
    </div>`;


/* =====================================================
   รายการช่วยงานศพ
===================================================== */

let funeralHTML = "";


funeralSends.forEach((item,index)=>{

    const funeral =
        funerals.find(
            f =>
            String(f.id) ===
            String(item.funeralId)
        );


    funeralHTML += `

    <div class="item out-item">

        <strong>
            ${index + 1}.
            ${escapeHTML(
                item.memberName || "-"
            )}
        </strong>

        <br>

        🏠 บ้านเลขที่:
        ${escapeHTML(
            item.memberHouse || "-"
        )}

        <br>

        ⚰️ งานศพ:
        ${
            funeral
            ?
            escapeHTML(funeral.name)
            :
            "-"
        }

        <br>

        🌾 จำนวน:
        ${Number(item.amount || 1)}
        ถุง

        <br>

        📅 วันที่:
        ${escapeHTML(item.date || "-")}

    </div>

    `;

});


document.getElementById("funeralList")
    .innerHTML =
    funeralHTML ||
    `<div class="empty">
        ยังไม่มีรายการช่วยงานศพ
    </div>`;


/* =====================================================
   รายการจ่ายอื่น
===================================================== */

let outHTML = "";


const outs =
    rice.filter(
        item =>
        item.type === "จ่าย"
    );


outs.forEach((item,index)=>{

    outHTML += `

    <div class="item out-item">

        <strong>
            ${index + 1}.
            ${escapeHTML(
                item.name || "-"
            )}
        </strong>

        <br>

        🏠 บ้านเลขที่:
        ${escapeHTML(
            item.house || "-"
        )}

        <br>

        📤 จ่ายออก:
        ${Number(item.amount || 0)}
        ถุง

        <br>

        📅 วันที่:
        ${escapeHTML(
            item.date || "-"
        )}

        <br>

        📝 หมายเหตุ:
        ${escapeHTML(
            item.note || "-"
        )}

    </div>

    `;

});


document.getElementById("outList")
    .innerHTML =
    outHTML ||
    `<div class="empty">
        ยังไม่มีรายการจ่ายข้าวสารอื่น
    </div>`;


/* =====================================================
   ป้องกัน HTML
===================================================== */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>

</html>
