<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌾 คลังข้าวสาร</title>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Sarabun',sans-serif;
}

body{
background:#eef2f5;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.header{

background:linear-gradient(135deg,#0f5132,#198754);

color:#fff;

padding:25px;

border-radius:20px;

margin-bottom:20px;

}

.grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

margin-bottom:20px;

}

.card{

background:#fff;

padding:20px;

border-radius:15px;

box-shadow:0 8px 20px rgba(0,0,0,.08);

text-align:center;

}

.card h2{

font-size:18px;

margin-bottom:10px;

}

.number{

font-size:40px;

font-weight:bold;

color:#198754;

}

table{

width:100%;

border-collapse:collapse;

background:#fff;

border-radius:15px;

overflow:hidden;

}

th{

background:#198754;

color:#fff;

padding:15px;

}

td{

padding:12px;

border-bottom:1px solid #eee;

}

.btn{

padding:12px 18px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

margin:5px;

}

.btn-green{

background:#198754;

color:white;

}

.btn-red{

background:#dc3545;

color:white;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>

🌾 คลังข้าวสาร

</h1>

<p>

ระบบกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6

</p>

</div>

<div class="grid">

<div class="card">

<h2>

รับเข้าทั้งหมด

</h2>

<div

class="number"

id="totalRice">

0

</div>

</div>

<div class="card">

<h2>

จ่ายออก

</h2>

<div

class="number"

id="outRice">

0

</div>

</div>

<div class="card">

<h2>

คงเหลือ

</h2>

<div

class="number"

id="stockRice">

0

</div>

</div>

<div class="card">

<h2>

งานศพ

</h2>

<div

class="number"

id="funeralCount">

0

</div>

</div>

</div>

<div class="card">

<button

class="btn btn-green"

onclick="addStock()">

📥 รับเข้าคลัง

</button>

<button

class="btn btn-red"

onclick="outStock()">

📤 เบิกออก

</button>

</div>

<div class="card">

<h2>

ประวัติคลังข้าวสาร

</h2>

<br>

<table>

<thead>

<tr>

<th>วันที่</th>

<th>รายการ</th>

<th>จำนวน</th>

<th>คงเหลือ</th>

</tr>

</thead>

<tbody id="stockTable">

</tbody>

</table>

</div>
</div>

<a href="index.html"
style="
display:block;
margin-top:25px;
text-align:center;
text-decoration:none;
font-weight:bold;
color:#666;
">

🏠 กลับหน้าหลัก

</a>

</div>

<script src="js/app.js"></script>
<script src="js/stock.js"></script>

</body>
</html>
