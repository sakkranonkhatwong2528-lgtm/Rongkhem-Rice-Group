<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
คลังข้าวสาร
</title>


<style>

body{

margin:0;
font-family:Tahoma,sans-serif;
background:#f4f7f2;

}


.header{

background:#8B7500;
color:white;
padding:20px;
text-align:center;

}


.box{

background:white;
margin:15px;
padding:20px;
border-radius:15px;

}


input,select{

width:100%;
padding:12px;
margin:8px 0;
box-sizing:border-box;
border-radius:8px;
border:1px solid #ccc;

}


button{

width:100%;
padding:15px;
background:#228B22;
color:white;
border:0;
border-radius:10px;
font-size:18px;

}


.item{

background:#fffbe6;
padding:15px;
margin-top:10px;
border-radius:10px;

}


.balance{

text-align:center;
font-size:25px;
color:#228B22;

}

</style>


</head>


<body>


<div class="header">

<h1>🌾 คลังข้าวสาร</h1>

<p>
กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6
</p>

</div>



<div class="box">

<h2>
📦 ยอดคงเหลือ
</h2>


<div class="balance">

<span id="total">
0
</span>

ถุง

</div>


</div>




<div class="box">


<h2>
เพิ่มรายการ
</h2>


<select id="type">

<option value="in">
รับเข้าข้าวสาร
</option>

<option value="out">
จ่ายข้าวสาร
</option>

</select>



<input id="amount"
placeholder="จำนวนถุง">



<button onclick="saveStock()">

บันทึก

</button>



</div>




<div class="box">

<h2>
📋 รายการย้อนหลัง
</h2>


<div id="list"></div>


</div>




<script>


let stock =
JSON.parse(localStorage.getItem("stock")) || [];



function showStock(){


let total=0;

let html="";


stock.forEach((s,i)=>{


if(s.type=="in"){

total += Number(s.amount);

}else{

total -= Number(s.amount);

}



html +=`

<div class="item">

<b>${i+1}</b>

<br>

${s.type=="in"?"📥 รับเข้า":"📤 จ่ายออก"}

<br>

จำนวน ${s.amount} ถุง

</div>

`;

});


document.getElementById("total").innerHTML=total;


document.getElementById("list").innerHTML=html;


}



function saveStock(){


let data={

type:
document.getElementById("type").value,

amount:
document.getElementById("amount").value

};


stock.push(data);


localStorage.setItem(
"stock",
JSON.stringify(stock)
);


showStock();


alert("บันทึกคลังข้าวสารแล้ว");


}



showStock();


</script>


</body>

</html>
