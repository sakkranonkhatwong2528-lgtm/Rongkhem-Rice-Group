<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌾 คลังข้าวสาร - บ้านร่องเข็ม หมู่ที่ 6</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background: #eef2f5;
            color: #333;
            padding-bottom: 40px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #0f5132, #198754);
            color: #fff;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .08);
            text-align: center;
        }

        .card h2 {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }

        .number {
            font-size: 36px;
            font-weight: bold;
            color: #198754;
        }

        .card.out .number {
            color: #dc3545;
        }

        .action-card {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .btn-green {
            background: #198754;
            color: white;
        }

        .btn-red {
            background: #dc3545;
            color: white;
        }

        .btn-gray {
            background: #6c757d;
            color: white;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 13px;
            border-radius: 6px;
            margin: 2px;
        }

        .btn-edit {
            background: #ffc107;
            color: #212529;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        /* ส่วนค้นหาและกรองข้อมูล */
        .filter-section {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .08);
            margin-bottom: 20px;
        }

        .filter-section h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #0f5132;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }

        .form-control {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #198754;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 15px;
        }

        th {
            background: #198754;
            color: #fff;
            padding: 15px;
            text-align: center;
            font-weight: 600;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge-in {
            color: #198754;
            font-weight: bold;
        }

        .badge-out {
            color: #dc3545;
            font-weight: bold;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            color: #666;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #198754;
        }

        /* Responsive สำหรับมือถือ */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .card {
                padding: 15px;
            }

            .number {
                font-size: 28px;
            }

            .action-card {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- หัวข้อระบบ -->
    <div class="header">
        <h1>🌾 คลังข้าวสาร</h1>
        <p>ระบบจัดการกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</p>
    </div>

    <!-- การ์ดแสดงผลสถิติ -->
    <div class="grid">
        <div class="card">
            <h2>รับเข้าทั้งหมด</h2>
            <div class="number" id="totalRice">0</div>
        </div>
        <div class="card out">
            <h2>จ่ายออก</h2>
            <div class="number" id="outRice">0</div>
        </div>
        <div class="card">
            <h2>คงเหลือ</h2>
            <div class="number" id="stockRice">0</div>
        </div>
        <div class="card">
            <h2>งานศพ (ครั้ง)</h2>
            <div class="number" id="funeralCount">0</div>
        </div>
    </div>

    <!-- ปุ่มทำรายการ -->
    <div class="card action-card">
        <button class="btn btn-green" onclick="addStock()">📥 รับเข้าคลัง</button>
        <button class="btn btn-red" onclick="outStock()">📤 เบิกออก</button>
    </div>

    <!-- ส่วนกรองและค้นหาข้อมูล -->
    <div class="filter-section">
        <h3>🔍 ค้นหาและกรองข้อมูล</h3>
        <div class="filter-grid">
            <div class="form-group">
                <label for="startDate">ตั้งแต่วันที่:</label>
                <input type="date" id="startDate" class="form-control" onchange="updateDashboard()">
            </div>
            <div class="form-group">
                <label for="endDate">ถึงวันที่:</label>
                <input type="date" id="endDate" class="form-control" onchange="updateDashboard()">
            </div>
            <div class="form-group">
                <label for="searchQuery">คำค้นหา (ประเภท/รายการ):</label>
                <input type="text" id="searchQuery" class="form-control" placeholder="เช่น รับเข้า, งานศพ..." oninput="updateDashboard()">
            </div>
            <div class="form-group">
                <button class="btn btn-gray" onclick="resetFilter()">🔄 ล้างตัวกรอง</button>
            </div>
        </div>
    </div>

    <!-- ตารางประวัติรายการ -->
    <div class="card">
        <h2>ประวัติคลังข้าวสาร</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>วันที่</th>
                        <th>รายการ</th>
                        <th>จำนวน</th>
                        <th>คงเหลือ</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="stockTable">
                    <!-- รายการจะถูกแทรกโดย JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ปุ่มย้อนกลับ -->
    <a href="index.html" class="back-link">🏠 กลับหน้าหลัก</a>

</div>

<!-- สคริปต์การทำงาน -->
<script>
    // ดึงข้อมูลจาก LocalStorage หรือตั้งค่าข้อมูลเริ่มต้น
    let stockData = JSON.parse(localStorage.getItem('riceStockData')) || [
        { date: "2026-08-01", type: "รับเข้า", amount: 50, funeral: false },
        { date: "2026-08-02", type: "จ่ายออก (งานศพ)", amount: 10, funeral: true }
    ];

    // ฟังก์ชันคำนวณสถิติและวาดตารางประวัติ (พร้อมตัวกรอง)
    function updateDashboard() {
        let total = 0;
        let out = 0;
        let funeralCount = 0;
        let currentStock = 0;

        const tableBody = document.getElementById("stockTable");
        tableBody.innerHTML = "";

        // ดึงค่าจากตัวกรอง
        const startDate = document.getElementById("startDate").value;
        const endDate = document.getElementById("endDate").value;
        const query = document.getElementById("searchQuery").value.trim().toLowerCase();

        // กรองข้อมูลตามเงื่อนไข
        const filteredData = stockData.filter((item) => {
            const matchStartDate = !startDate || item.date >= startDate;
            const matchEndDate = !endDate || item.date <= endDate;
            const matchQuery = !query || 
                item.type.toLowerCase().includes(query) || 
                item.date.includes(query);

            return matchStartDate && matchEndDate && matchQuery;
        });

        if (filteredData.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="5" style="color: #888;">ไม่พบข้อมูลตามเงื่อนไขที่ระบุ</td></tr>`;
        } else {
            filteredData.forEach((item) => {
                // ค้นหาดัชนีจริงในอาร์เรย์หลัก stockData สำหรับใช้แก้ไข/ลบ
                const originalIndex = stockData.indexOf(item);
                const isAdd = item.type.includes("รับเข้า");

                if (isAdd) {
                    total += item.amount;
                    currentStock += item.amount;
                } else {
                    out += item.amount;
                    currentStock -= item.amount;
                    if (item.funeral) {
                        funeralCount++;
                    }
                }

                // เพิ่มแถวข้อมูลเข้าตาราง
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${item.date}</td>
                    <td>${item.type}</td>
                    <td class="${isAdd ? 'badge-in' : 'badge-out'}">
                        ${isAdd ? '+' : '-'}${item.amount.toLocaleString()}
                    </td>
                    <td><b>${currentStock.toLocaleString()}</b></td>
                    <td>
                        <button class="btn btn-sm btn-edit" onclick="editItem(${originalIndex})">✏️ แก้ไข</button>
                        <button class="btn btn-sm btn-delete" onclick="deleteItem(${originalIndex})">🗑️ ลบ</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // อัปเดตตัวเลขแสดงผลบน Cards
        document.getElementById("totalRice").innerText = total.toLocaleString();
        document.getElementById("outRice").innerText = out.toLocaleString();
        document.getElementById("stockRice").innerText = currentStock.toLocaleString();
        document.getElementById("funeralCount").innerText = funeralCount.toLocaleString();

        // บันทึกข้อมูลลงเบราว์เซอร์
        localStorage.setItem('riceStockData', JSON.stringify(stockData));
    }

    // ฟังก์ชันล้างตัวกรอง
    function resetFilter() {
        document.getElementById("startDate").value = "";
        document.getElementById("endDate").value = "";
        document.getElementById("searchQuery").value = "";
        updateDashboard();
    }

    // ฟังก์ชันรับเข้าคลัง
    function addStock() {
        const input = prompt("กรอกจำนวนข้าวสารที่รับเข้า (กระสอบ/ถุง):");
        if (input === null) return;
        
        const amount = Number(input);
        if (!isNaN(amount) && amount > 0) {
            const today = new Date().toISOString().split("T")[0];
            stockData.push({
                date: today,
                type: "รับเข้า",
                amount: amount,
                funeral: false
            });
            updateDashboard();
        } else {
            alert("⚠️ กรุณากรอกตัวเลขจำนวนที่ถูกต้อง");
        }
    }

    // ฟังก์ชันเบิกออก
    function outStock() {
        const input = prompt("กรอกจำนวนข้าวสารที่ต้องการเบิกออก:");
        if (input === null) return;

        const amount = Number(input);
        if (!isNaN(amount) && amount > 0) {
            const isFuneral = confirm("กด 'ตกลง' หากเป็นการเบิกสำหรับงานศพ\nกด 'ยกเลิก' สำหรับเบิกจ่ายทั่วไป");
            const today = new Date().toISOString().split("T")[0];
            
            stockData.push({
                date: today,
                type: isFuneral ? "จ่ายออก (งานศพ)" : "จ่ายออก",
                amount: amount,
                funeral: isFuneral
            });
            updateDashboard();
        } else {
            alert("⚠️ กรุณากรอกตัวเลขจำนวนที่ถูกต้อง");
        }
    }

    // ฟังก์ชันแก้ไขรายการ
    function editItem(index) {
        const item = stockData[index];
        const newAmountInput = prompt(`แก้ไขจำนวนข้าวสาร (${item.type}):`, item.amount);
        
        if (newAmountInput === null) return;
        
        const newAmount = Number(newAmountInput);
        if (!isNaN(newAmount) && newAmount > 0) {
            stockData[index].amount = newAmount;

            if (!item.type.includes("รับเข้า")) {
                const isFuneral = confirm("กด 'ตกลง' หากรายการนี้เป็นงานศพ\nกด 'ยกเลิก' หากไม่ใช่");
                stockData[index].funeral = isFuneral;
                stockData[index].type = isFuneral ? "จ่ายออก (งานศพ)" : "จ่ายออก";
            }

            updateDashboard();
        } else {
            alert("⚠️ กรุณากรอกตัวเลขจำนวนที่ถูกต้อง");
        }
    }

    // ฟังก์ชันลบรายการ
    function deleteItem(index) {
        const item = stockData[index];
        if (confirm(`คุณต้องการลบรายการ "${item.type}" จำนวน ${item.amount} ใช่หรือไม่?`)) {
            stockData.splice(index, 1);
            updateDashboard();
        }
    }

    // ทำงานอัตโนมัติเมื่อเปิดหน้าเว็บ
    document.addEventListener("DOMContentLoaded", updateDashboard);
</script>

</body>
</html>
