<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>คลังข้าวสาร</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:#f3f7f0;
    color:#333;
}

.header{
    background:linear-gradient(135deg,#176b2c,#4caf50);
    color:white;
    padding:22px 15px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.box{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:16px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.summary-card{
    background:#f8fff8;
    padding:16px;
    border-radius:14px;
    text-align:center;
}

.balance-card{
    grid-column:1 / -1;
    background:#e8f7e8;
}

.icon{
    font-size:34px;
}

.number{
    font-size:30px;
    font-weight:bold;
    color:#228B22;
}

.red{
    color:#c62828;
}

.blue{
    color:#1976d2;
}

.yellow{
    color:#b88600;
}

.filter{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    margin-bottom:10px;
}

.transaction{
    background:#fafafa;
    padding:15px;
    margin-top:10px;
    border-radius:12px;
    border-left:5px solid #228B22;
}

.transaction.out{
    border-left-color:#c62828;
}

.transaction.funeral{
    border-left-color:#1976d2;
}

.in-text{
    color:#228B22;
    font-weight:bold;
}

.out-text{
    color:#c62828;
    font-weight:bold;
}

.funeral-text{
    color:#1976d2;
    font-weight:bold;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}

button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#228B22;
    color:white;
    font-size:16px;
}

.back{
    display:block;
    text-align:center;
    padding:15px;
    color:#228B22;
    text-decoration:none;
}

@media(max-width:600px){

    .summary{
        grid-template-columns:1fr 1fr;
    }

    .summary-card{
        padding:12px 7px;
    }

}

@media print{

    body{
        background:white;
    }

    .header{
        background:white;
        color:#000;
        border-bottom:2px solid #333;
    }

    button,
    .back,
    .filter{
        display:none;
    }

    .box{
        box-shadow:none;
    }

}

</style>

</head>

<body>


<div class="header">

<h1>🌾 คลังข้าวสาร</h1>

<p>กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</p>

</div>


<div class="container">


<!-- =========================
     สรุปคลัง
========================= -->

<div class="box">

<div class="summary">


<div class="summary-card">

<div class="icon">📥</div>

รับเข้าทั้งหมด

<div
    class="number"
    id="totalIn"
>
0
</div>

ถุง

</div>


<div class="summary-card">

<div class="icon">📤</div>

นำออกทั้งหมด

<div
    class="number red"
    id="totalOut"
>
0
</div>

ถุง

</div>


<div class="summary-card">

<div class="icon">⚰️</div>

ช่วยงานศพ

<div
    class="number blue"
    id="funeralOut"
>
0
</div>

ถุง

</div>


<div class="summary-card">

<div class="icon">📦</div>

จ่ายอื่น ๆ

<div
    class="number yellow"
    id="otherOut"
>
0
</div>

ถุง

</div>


<div class="summary-card balance-card">

<div class="icon">🌾</div>

ข้าวสารคงเหลือ

<div
    class="number"
    id="balance"
>
0
</div>

ถุง

</div>


</div>

</div>


<!-- =========================
     ประวัติ
========================= -->

<div class="box">

<h2>📋 ประวัติการเคลื่อนไหวข้าวสาร</h2>


<input
    id="search"
    class="filter"
    type="text"
    placeholder="ค้นหาชื่อ บ้านเลขที่ หรืองานศพ"
    oninput="showTransactions()"
>


<div id="transactionList"></div>


</div>


<div class="box">

<button onclick="window.print()">

🖨️ พิมพ์รายงานคลังข้าวสาร

</button>

</div>


<a
    class="back"
    href="index.html"
>
← กลับหน้าหลัก
</a>


</div>


<script>

/* =====================================================
   โหลดข้อมูล
===================================================== */

const rice =
    JSON.parse(
        localStorage.getItem("rice")
    ) || [];


const funeralSends =
    JSON.parse(
        localStorage.getItem("funeralSends")
    ) || [];


const funerals =
    JSON.parse(
        localStorage.getItem("funerals")
    ) || [];


/* =====================================================
   คำนวณยอด
===================================================== */

let totalIn = 0;

let otherOut = 0;


rice.forEach(item => {

    if(item.type === "รับ"){

        totalIn +=
            Number(item.amount || 0);

    }


    if(item.type === "จ่าย"){

        otherOut +=
            Number(item.amount || 0);

    }

});


let funeralOut = 0;

funeralSends.forEach(item => {

    funeralOut +=
        Number(item.amount || 0);

});


const totalOut =
    otherOut +
    funeralOut;


let balance =
    totalIn -
    totalOut;


if(balance < 0){

    balance = 0;

}


/* =====================================================
   แสดงยอด
===================================================== */

document.getElementById("totalIn")
    .innerText =
    totalIn;


document.getElementById("totalOut")
    .innerText =
    totalOut;


document.getElementById("funeralOut")
    .innerText =
    funeralOut;


document.getElementById("otherOut")
    .innerText =
    otherOut;


document.getElementById("balance")
    .innerText =
    balance;


/* =====================================================
   รวมประวัติ
===================================================== */

function getTransactions(){

    let list = [];


    /* -------------------------
       รับเข้าคลัง
    ------------------------- */

    rice
    .filter(
        item =>
        item.type === "รับ"
    )
    .forEach(item => {

        list.push({

            type:"รับเข้า",

            date:item.date || "-",

            name:item.name || "-",

            house:item.house || "-",

            amount:
                Number(item.amount || 0),

            note:item.note || "-"

        });

    });


    /* -------------------------
       จ่ายทั่วไป
    ------------------------- */

    rice
    .filter(
        item =>
        item.type === "จ่าย"
    )
    .forEach(item => {

        list.push({

            type:"จ่ายออก",

            date:item.date || "-",

            name:item.name || "-",

            house:item.house || "-",

            amount:
                Number(item.amount || 0),

            note:item.note || "-"

        });

    });


    /* -------------------------
       ช่วยงานศพ
    ------------------------- */

    funeralSends.forEach(item => {

        const funeral =
            funerals.find(
                f =>
                String(f.id) ===
                String(item.funeralId)
            );


        list.push({

            type:"ช่วยงานศพ",

            date:item.date || "-",

            name:
                item.memberName || "-",

            house:
                item.memberHouse || "-",

            amount:
                Number(item.amount || 1),

            note:
                funeral
                ?
                "งานศพ " +
                funeral.name
                :
                "งานศพไม่พบข้อมูล"

        });

    });


    return list;

}


/* =====================================================
   แสดงประวัติ
===================================================== */

function showTransactions(){

    const keyword =
        document.getElementById("search")
        .value
        .trim()
        .toLowerCase();


    let transactions =
        getTransactions();


    transactions =
        transactions.filter(item => {

            const text =
                (
                    item.type +
                    " " +
                    item.date +
                    " " +
                    item.name +
                    " " +
                    item.house +
                    " " +
                    item.note
                )
                .toLowerCase();


            return text.includes(keyword);

        });


    let html = "";


    transactions.forEach((item,index)=>{

        let cardClass =
            "";


        let titleClass =
            "in-text";


        let sign =
            "+";


        if(item.type === "จ่ายออก"){

            cardClass =
                "out";

            titleClass =
                "out-text";

            sign =
                "-";

        }


        if(item.type === "ช่วยงานศพ"){

            cardClass =
                "funeral";

            titleClass =
                "funeral-text";

            sign =
                "-";

        }


        html += `

        <div class="
            transaction
            ${cardClass}
        ">

            <strong
                class="${titleClass}"
            >

                ${index + 1}.
                ${getIcon(item.type)}
                ${item.type}

            </strong>

            <br>

            📅 วันที่:
            ${escapeHTML(item.date)}

            <br>

            🏠 บ้านเลขที่:
            ${escapeHTML(item.house)}

            <br>

            👤 ชื่อ:
            ${escapeHTML(item.name)}

            <br>

            📦 จำนวน:

            <strong
                class="${titleClass}"
            >

                ${sign}
                ${item.amount}
                ถุง

            </strong>

            <br>

            📝 รายละเอียด:
            ${escapeHTML(item.note)}

        </div>

        `;

    });


    if(transactions.length === 0){

        html = `

        <div class="empty">

            ยังไม่มีรายการ

        </div>

        `;

    }


    document.getElementById("transactionList")
        .innerHTML =
        html;

}


/* =====================================================
   ไอคอน
===================================================== */

function getIcon(type){

    if(type === "รับเข้า"){
        return "📥";
    }

    if(type === "จ่ายออก"){
        return "📤";
    }

    if(type === "ช่วยงานศพ"){
        return "⚰️";
    }

    return "📦";

}


/* =====================================================
   ป้องกัน HTML
===================================================== */

function escapeHTML(value){

    return String(
        value || ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   เริ่มระบบ
===================================================== */

showTransactions();

</script>

</body>

</html>
