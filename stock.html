<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>จัดการคลังข้าวสาร | ระบบกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Tahoma,sans-serif;
}

body{
  background: linear-gradient(-45deg, #0b3d26, #0f5132, #198754, #20c997);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  min-height:100vh;
  display: flex;
  flex-direction: column;
  color: #fff;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(10px);
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  animation: slideDown 0.6s ease-out;
}

.btn-back {
  background: rgba(255,255,255,0.2);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.4);
  padding: 8px 16px;
  border-radius: 10px;
  cursor: pointer;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.btn-back:hover {
  background: rgba(255,255,255,0.35);
  transform: translateX(-3px);
}

.container{
  max-width:1000px;
  margin:auto;
  padding:25px;
  flex: 1;
  width: 100%;
}

.card {
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:25px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  border: 1px solid rgba(255,255,255,0.2);
  margin-bottom: 25px;
  animation: fadeInUp 0.8s ease-out;
}

/* การ์ดแสดงสรุปคลังข้าว */
.stock-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  margin-bottom: 25px;
}

.summary-box {
  background: rgba(0,0,0,0.15);
  border-radius: 15px;
  padding: 20px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.15);
}

.summary-box h1 {
  font-size: 36px;
  margin-top: 8px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
  margin-top: 15px;
}

input, select {
  width: 100%;
  padding: 12px 15px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.2);
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: 0.3s;
}

select option {
  background: #0f5132;
  color: #fff;
}

input::placeholder {
  color: rgba(255,255,255,0.7);
}

input:focus, select:focus {
  background: rgba(255,255,255,0.3);
  border-color: #fff;
}

.btn-add {
  background: #198754;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  font-size: 16px;
  transition: 0.3s;
  grid-column: 1 / -1;
  box-shadow: 0 4px 10px rgba(25, 135, 84, 0.3);
}

.btn-add:hover {
  background: #146c43;
  transform: translateY(-2px);
}

/* ตารางประวัติ */
.table-responsive {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  padding: 14px;
  text-align: left;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}

th {
  background: rgba(0,0,0,0.15);
  font-size: 16px;
}

tr {
  transition: 0.2s;
}

tr:hover {
  background: rgba(255,255,255,0.1);
}

.badge-in {
  background: rgba(25, 135, 84, 0.35);
  color: #75b798;
  padding: 4px 10px;
  border-radius: 8px;
  font-weight: bold;
  border: 1px solid rgba(25, 135, 84, 0.6);
}

.badge-out {
  background: rgba(220, 53, 69, 0.35);
  color: #ff868d;
  padding: 4px 10px;
  border-radius: 8px;
  font-weight: bold;
  border: 1px solid rgba(220, 53, 69, 0.6);
}

.btn-delete {
  background: #dc3545;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.btn-delete:hover {
  background: #bb2d3b;
  transform: scale(1.05);
}

@keyframes slideDown {
  from { transform: translateY(-100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes fadeInUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

footer {
  text-align: center;
  padding: 15px;
  background: rgba(0, 0, 0, 0.15);
  font-size: 13px;
  color: rgba(255,255,255,0.7);
}
</style>
</head>

<body>

<header>
  <h2>📦 ระบบจัดการคลังข้าวสาร</h2>
  <a href="dashboard.html" class="btn-back">⬅️ กลับหน้าหลัก</a>
</header>

<div class="container">

  <!-- สรุปสถานะคลัง -->
  <div class="stock-summary">
    <div class="summary-box">
      <div>นำเข้าทั้งหมด</div>
      <h1 id="totalIn" style="color: #75b798;">0 ถุง</h1>
    </div>
    <div class="summary-box">
      <div>เบิกจ่ายทั้งหมด</div>
      <h1 id="totalOut" style="color: #ff868d;">0 ถุง</h1>
    </div>
    <div class="summary-box" style="background: rgba(255, 193, 7, 0.15); border-color: rgba(255, 193, 7, 0.3);">
      <div>คงเหลือในคลัง</div>
      <h1 id="totalBalance" style="color: #ffda6a;">0 ถุง</h1>
    </div>
  </div>

  <!-- ฟอร์มบันทึกการรับ-จ่าย -->
  <div class="card">
    <h3>➕ บันทึกรายการ เข้า/ออก คลังข้าวสาร</h3>
    <form id="stockForm" onsubmit="addStockTransaction(event)">
      <div class="form-grid">
        <select id="type" required>
          <option value="in">📥 นำเข้า (รับเพิ่ม)</option>
          <option value="out">📤 เบิกจ่าย (นำไปใช้)</option>
        </select>
        <input type="number" id="amount" placeholder="จำนวน (ถุง / กระสอบ)" required min="1">
        <input type="text" id="date" placeholder="วันที่ (เช่น 12 ม.ค. 2569)" required>
        <input type="text" id="note" placeholder="หมายเหตุ / รายละเอียด (เช่น ซื้อเข้าคลัง, งานศพคุณ...)" required>
        <button type="submit" class="btn-add">บันทึกรายการคลัง</button>
      </div>
    </form>
  </div>

  <!-- ตารางประวัติเคลื่อนไหว -->
  <div class="card">
    <h3>📋 ประวัติการรับ - เบิกจ่ายข้าวสาร</h3>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>วันที่</th>
            <th>ประเภท</th>
            <th>จำนวน</th>
            <th>หมายเหตุ</th>
            <th style="text-align:center;">จัดการ</th>
          </tr>
        </thead>
        <tbody id="stockTableBody">
          <!-- ข้อมูลจะแสดงที่นี่ -->
        </tbody>
      </table>
    </div>
  </div>

</div>

<footer>
  © 2569 ระบบกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6
</footer>

<script>
// ตรวจสอบการ Login
if(sessionStorage.getItem("loggedIn") !== "true" && localStorage.getItem("loggedIn") !== "true"){
  location.href = "index.html";
}

// โหลดข้อมูลประวัติสต็อก
let stockList = JSON.parse(localStorage.getItem("stockList")) || [];

// แสดงผลเมื่อเปิดหน้า
displayStock();

// ฟังก์ชันบันทึกรายการ
function addStockTransaction(event) {
  event.preventDefault();

  const type = document.getElementById("type").value;
  const amount = parseInt(document.getElementById("amount").value.trim());
  const date = document.getElementById("date").value.trim();
  const note = document.getElementById("note").value.trim();

  const newItem = {
    id: Date.now(),
    type: type,
    amount: amount,
    date: date,
    note: note
  };

  stockList.unshift(newItem); // เอา รายการใหม่ไว้ข้างบนสุด
  localStorage.setItem("stockList", JSON.stringify(stockList));

  document.getElementById("stockForm").reset();
  displayStock();
}

// ฟังก์ชันคำนวณและแสดงผลตาราง
function displayStock() {
  const tbody = document.getElementById("stockTableBody");
  tbody.innerHTML = "";

  let inSum = 0;
  let outSum = 0;

  if (stockList.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; opacity:0.7;">ยังไม่มีประวัติการทำรายการคลัง</td></tr>`;
  } else {
    stockList.forEach((item) => {
      if (item.type === "in") {
        inSum += item.amount;
      } else {
        outSum += item.amount;
      }

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${item.date}</td>
        <td>
          <span class="${item.type === 'in' ? 'badge-in' : 'badge-out'}">
            ${item.type === 'in' ? '📥 นำเข้า' : '📤 เบิกจ่าย'}
          </span>
        </td>
        <td><strong>${item.amount}</strong> ถุง</td>
        <td>${item.note}</td>
        <td style="text-align:center;">
          <button class="btn-delete" onclick="deleteStock(${item.id})">🗑️ ลบ</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // อัปเดตตัวเลขสรุป
  document.getElementById("totalIn").textContent = inSum + " ถุง";
  document.getElementById("totalOut").textContent = outSum + " ถุง";
  
  const balance = inSum - outSum;
  document.getElementById("totalBalance").textContent = balance + " ถุง";
}

// ฟังก์ชันลบรายการ
function deleteStock(id) {
  if (confirm("คุณต้องการลบรายการคลังนี้ใช่หรือไม่?")) {
    stockList = stockList.filter(item => item.id !== id);
    localStorage.setItem("stockList", JSON.stringify(stockList));
    displayStock();
  }
}
</script>

</body>
</html>
