<h2>⚠️ สมาชิกที่ต้องติดตาม</h2>

<div id="followList"></div>

<script>

function loadFollow(){

let members =
JSON.parse(localStorage.getItem("members")) || [];


let follow =
members.filter(
m => Number(m.pending) > 0
);


let html = "";

if(follow.length === 0){

html = `
<div class="success">
✅ ไม่มีสมาชิกค้างส่ง
</div>
`;

}else{


html += `
<div class="box">

<h3>
⚠️ พบสมาชิกต้องติดตาม ${follow.length} ครัวเรือน
</h3>

<button onclick="printFollow()">
🖨️ พิมพ์รายงาน
</button>

</div>
`;


follow.forEach((m,i)=>{


html += `

<div class="card">

<h3>
${i+1}. ${m.name}
</h3>

<p>
🏠 บ้านเลขที่ : ${m.house || "-"}
</p>

<p>
📦 ค้างส่ง : ${m.pending} ครั้ง
</p>


<p>
${m.funeral 
? "⚰️ งานศพ : "+m.funeral 
: ""}
</p>


</div>

`;

});


}


document.getElementById(
"followList"
).innerHTML = html;


}



function printFollow(){

window.print();

}


loadFollow();


</script>
