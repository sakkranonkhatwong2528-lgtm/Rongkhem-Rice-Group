<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ติดตามสมาชิก - กลุ่มข้าวสารบ้านร่องเข็ม</title>

<style>
body{
    font-family:"Tahoma",sans-serif;
    background:#f1f8e9;
    margin:0;
    padding:15px;
}

.container{
    max-width:900px;
    margin:auto;
}

.header{
    background:#2e7d32;
    color:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.card{
    background:white;
    margin-top:15px;
    padding:15px;
    border-radius:15px;
    box-shadow:0 3px 8px #ccc;
}

.warning{
    border-left:8px solid #ffc107;
}

.danger{
    border-left:8px solid #d32f2f;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    margin-top:10px;
}

button{
    background:#2e7d32;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    margin-top:10px;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    background:#555;
    color:white;
    padding:12px;
    border-radius:10px;
}

.badge{
    padding:5px 10px;
    border-radius:20px;
    font-weight:bold;
}

.yellow{
    background:#fff3cd;
}

.red{
    background:#ffcdd2;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h2>⚠️ ติดตามสมาชิก</h2>
<p>กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</p>
<p>สมาชิกที่ยังต้องติดตาม 10 ครัวเรือน</p>
</div>


<input id="search" 
placeholder="🔎 ค้นหาชื่อ หรือ บ้านเลขที่"
onkeyup="searchMember()">


<div id="list"></div>


<a class="back" href="index.html">
← กลับหน้าหลัก
</a>

</div>


<script>

const members=[

{
name:"นายวุฒิภัทร เตชะวงค์",
house:"91/1",
count:1,
job:"นายเกษมสุข ใฝ่ใจ"
},

{
name:"นายต่วน ทาทอง",
house:"114",
count:1,
job:"นายเกษมสุข ใฝ่ใจ"
},

{
name:"นายประหยัด ปิงเมือง",
house:"120",
count:2,
job:"นายเกษมสุข ใฝ่ใจ"
},

{
name:"นายสมศีล งามจิต",
house:"135",
count:1,
job:"นายบูรณิพิภพ ผัดดี"
},

{
name:"น.ส.ยุพา ใจดี",
house:"160",
count:1,
job:"นายเกษมสุข ใฝ่ใจ"
},

{
name:"นายตื่น มิ่งขวัญ",
house:"176",
count:2,
job:"นายเกษมสุข ใฝ่ใจ"
},

{
name:"น.ส.สำรอง มหาวรรณศรี",
house:"200",
count:2,
job:"นายเกษมสุข ใฝ่ใจ"
},

{
name:"นายบรรพต อินวงค์",
house:"212",
count:2,
job:"นายเกษมสุข ใฝ่ใจ"
},

{
name:"นางลวงทิพย์ ใฝ่จิต",
house:"315",
count:2,
job:"นายเกษมสุข ใฝ่ใจ"
},

{
name:"นายประทุม ดาวกระจาย",
house:"328",
count:2,
job:"นายเกษมสุข ใฝ่ใจ"
}

];


function show(data){

let html="";

data.forEach((m,i)=>{

let status =
m.count>=2
?
`<span class="badge red">
🔴 เสนอพิจารณาตัดสมาชิก
</span>`
:
`<span class="badge yellow">
🟡 แจ้งเตือน
</span>`;


html+=`

<div class="card ${m.count>=2?'danger':'warning'}">

<h3>${i+1}. ${m.name}</h3>

<p>🏠 บ้านเลขที่ : ${m.house}</p>

<p>📦 ค้างส่ง : ${m.count} ครั้ง</p>

<p>⚰️ งานศพ : ${m.job}</p>

<p>${status}</p>


<button onclick="follow('${m.name}')">
✅ บันทึกติดตาม
</button>


</div>

`;

});


document.getElementById("list").innerHTML=html;

}



function searchMember(){

let text=
document.getElementById("search").value;


let result=
members.filter(m=>
m.name.includes(text)||
m.house.includes(text)
);


show(result);

}



function follow(name){

alert(
"บันทึกการติดตามสมาชิก : "+name
);

}


show(members);


</script>


</body>
</html>
