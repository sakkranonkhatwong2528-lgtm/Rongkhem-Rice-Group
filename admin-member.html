<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ทะเบียนสมาชิกกลุ่มข้าวสารบ้านร่องเข็ม</title>

<style>

body{
margin:0;
font-family:Tahoma,sans-serif;
background:#f5f7f2;
}

.header{
background:linear-gradient(135deg,#2e7d32,#66bb6a);
color:white;
padding:30px;
text-align:center;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;
}

input{
width:100%;
padding:12px;
margin:8px 0;
box-sizing:border-box;
border-radius:8px;
border:1px solid #ccc;
}

button{

background:#2e7d32;
color:white;
border:0;
padding:10px 15px;
border-radius:8px;
cursor:pointer;

}

.delete{
background:#d32f2f;
}


table{

width:100%;
border-collapse:collapse;

}


th{

background:#2e7d32;
color:white;
padding:10px;

}


td{

padding:10px;
border-bottom:1px solid #ddd;
text-align:center;

}

</style>

</head>


<body>


<div class="header">

<h1>
👥 ทะเบียนสมาชิกกลุ่มข้าวสาร
</h1>

<p>
บ้านร่องเข็ม หมู่ที่ 6
</p>

</div>



<div class="container">


<div class="card">

<h2>
➕ เพิ่มสมาชิก
</h2>


<input id="name" placeholder="ชื่อ - นามสกุล">

<input id="house" placeholder="บ้านเลขที่">

<input id="rice" placeholder="จำนวนข้าวที่นำส่ง (กก.)">


<button onclick="addMember()">
บันทึกสมาชิก
</button>


</div>



<div class="card">

<h2>
รายชื่อสมาชิก
</h2>


<table>

<thead>

<tr>

<th>ลำดับ</th>
<th>ชื่อ</th>
<th>บ้านเลขที่</th>
<th>ข้าว</th>
<th>จัดการ</th>

</tr>

</thead>


<tbody id="list">

</tbody>


</table>


</div>


<a href="index.html">
⬅ กลับหน้าหลัก
</a>


</div>



<script>


let members =
JSON.parse(localStorage.getItem("members")) || [

{
name:"นายจักรวัตร ประพลรัตนัง",
house:"2",
rice:"12"
}

];



function showMember(){


let html="";


members.forEach(function(m,i){


html += `

<tr>

<td>${i+1}</td>

<td>${m.name}</td>

<td>${m.house}</td>

<td>${m.rice} กก.</td>

<td>

<button class="delete"
onclick="deleteMember(${i})">

ลบ

</button>

</td>

</tr>

`;

});


document.getElementById("list").innerHTML=html;


}




function addMember(){


let name =
document.getElementById("name").value;


let house =
document.getElementById("house").value;


let rice =
document.getElementById("rice").value;



if(name==""){

alert("กรุณาใส่ชื่อสมาชิก");

return;

}



members.push({

name:name,

house:house,

rice:rice

});



localStorage.setItem(
"members",
JSON.stringify(members)
);



document.getElementById("name").value="";
document.getElementById("house").value="";
document.getElementById("rice").value="";


showMember();


alert("บันทึกสมาชิกเรียบร้อย");

}




function deleteMember(i){


if(confirm("ต้องการลบสมาชิกหรือไม่")){


members.splice(i,1);


localStorage.setItem(
"members",
JSON.stringify(members)
);


showMember();


}


}



showMember();


</script>


</body>

</html>
