<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>จัดการสมาชิกกลุ่มข้าวสาร</title>

<style>

body{
margin:0;
font-family:Tahoma,sans-serif;
background:#f5f7f2;
}

.header{
background:linear-gradient(135deg,#2e7d32,#66bb6a);
color:white;
padding:25px;
text-align:center;
}

.container{
padding:20px;
}

.box{

background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 3px 10px #ccc;

}


input{

width:100%;
padding:12px;
margin:8px 0;
box-sizing:border-box;

}


button{

padding:10px 15px;
border:none;
border-radius:8px;
background:#2e7d32;
color:white;

}


table{

width:100%;
border-collapse:collapse;

}


th{

background:#2e7d32;
color:white;
padding:10px;

}


td{

padding:10px;
border-bottom:1px solid #ddd;
text-align:center;

}


.delete{

background:#d32f2f;

}


</style>

</head>


<body>


<div class="header">

<h1>
⚙️ จัดการสมาชิกกลุ่มข้าวสาร
</h1>

<p>
บ้านร่องเข็ม หมู่ที่ 6
</p>

</div>



<div class="container">


<div class="box">

<h2>
➕ เพิ่มสมาชิก
</h2>


<input id="name" placeholder="ชื่อ - นามสกุล">

<input id="house" placeholder="บ้านเลขที่">

<input id="rice" placeholder="จำนวนข้าว (กก.)">


<button onclick="addMember()">
บันทึก
</button>


</div>



<div class="box">

<h2>
รายชื่อสมาชิก
</h2>


<table>


<thead>

<tr>

<th>ลำดับ</th>
<th>ชื่อ</th>
<th>บ้านเลขที่</th>
<th>ข้าว</th>
<th>ลบ</th>

</tr>

</thead>


<tbody id="list">

</tbody>


</table>


</div>


<a href="สมาชิก.html">
👥 ดูทะเบียนสมาชิก
</a>


</div>



<script src="ข้อมูล.js"></script>


<script>


function show(){

let html="";


members.forEach((m,i)=>{


html += `

<tr>

<td>${i+1}</td>

<td>${m.name}</td>

<td>${m.house}</td>

<td>${m.rice}</td>

<td>

<button class="delete" onclick="removeMember(${i})">
ลบ
</button>

</td>

</tr>

`;

});


document.getElementById("list").innerHTML=html;


}



function addMember(){


let name =
document.getElementById("name").value;


let house =
document.getElementById("house").value;


let rice =
document.getElementById("rice").value;



if(name==""){

alert("กรุณาใส่ชื่อสมาชิก");
return;

}



members.push({

id:Date.now(),

name:name,

house:house,

rice:rice

});


saveMembers();


show();


document.getElementById("name").value="";
document.getElementById("house").value="";
document.getElementById("rice").value="";


}



function removeMember(i){


if(confirm("ต้องการลบสมาชิกหรือไม่")){


members.splice(i,1);

saveMembers();

show();


}


}



show();


</script>


</body>

</html>
