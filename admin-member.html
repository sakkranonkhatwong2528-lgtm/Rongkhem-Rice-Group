<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>จัดการทะเบียนสมาชิกกลุ่มข้าวสาร</title>

<style>

body{
margin:0;
font-family:Tahoma,sans-serif;
background:#f5f7f2;
}

.header{
background:linear-gradient(135deg,#2e7d32,#66bb6a);
color:white;
padding:30px;
text-align:center;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;
}

input,select{

width:100%;
padding:12px;
margin:8px 0;
box-sizing:border-box;
border-radius:8px;
border:1px solid #ccc;

}

button{

background:#2e7d32;
color:white;
border:0;
padding:10px 15px;
border-radius:8px;
cursor:pointer;

}

.delete{
background:#d32f2f;
}

.edit{
background:#f57c00;
}

.status{
background:#1565c0;
}


table{

width:100%;
border-collapse:collapse;

}


th{

background:#2e7d32;
color:white;
padding:10px;

}


td{

padding:10px;
border-bottom:1px solid #ddd;
text-align:center;

}


</style>

</head>


<body>


<div class="header">

<h1>
👥 จัดการทะเบียนสมาชิก
</h1>

<p>
กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6
</p>

</div>



<div class="container">



<div class="card">

<h2>
➕ เพิ่มสมาชิก
</h2>


<input id="name" placeholder="ชื่อ - นามสกุล">


<input id="house" placeholder="บ้านเลขที่">


<input id="rice" placeholder="จำนวนข้าวที่นำส่ง (กก.)">


<select id="status">

<option value="ส่งแล้ว">
✅ ส่งข้าวแล้ว
</option>

<option value="ยังไม่ส่ง">
❌ ยังไม่ส่ง
</option>

</select>



<button onclick="addMember()">
บันทึกสมาชิก
</button>


</div>



<div id="summary"></div>



<div class="card">

<h2>
รายชื่อสมาชิก
</h2>


<table>

<thead>

<tr>

<th>ลำดับ</th>

<th>ชื่อ</th>

<th>บ้านเลขที่</th>

<th>ข้าว</th>

<th>สถานะ</th>

<th>จัดการ</th>


</tr>

</thead>


<tbody id="list">

</tbody>


</table>


</div>



<a href="index.html">
⬅ กลับหน้าหลัก
</a>



</div>




<script>


let members = JSON.parse(
localStorage.getItem("members")
) || [];


// เพิ่มสถานะให้ข้อมูลเก่า

members = members.map(m=>{

if(!m.status){

m.status="ยังไม่ส่ง";

}

return m;

});




function showMember(){


let html="";


members.forEach((m,i)=>{


html += `

<tr>

<td>${i+1}</td>


<td>${m.name}</td>


<td>${m.house}</td>


<td>${m.rice} กก.</td>



<td>

<button class="status"
onclick="changeStatus(${i})">

${m.status}

</button>

</td>



<td>


<button class="edit"
onclick="editMember(${i})">

แก้ไข

</button>



<button class="delete"
onclick="deleteMember(${i})">

ลบ

</button>


</td>


</tr>


`;

});


document.getElementById("list").innerHTML=html;


}




function showSummary(){


let send = members.filter(
m=>m.status=="ส่งแล้ว"
).length;



let notSend = members.filter(
m=>m.status=="ยังไม่ส่ง"
).length;



document.getElementById("summary").innerHTML=

`

<div class="card">

<h3>
📊 สรุปการส่งข้าวสาร
</h3>


<p>
✅ ส่งแล้ว : ${send} คน
</p>


<p>
❌ ยังไม่ส่ง : ${notSend} คน
</p>


</div>

`;

}





function addMember(){


let name =
document.getElementById("name").value;


let house =
document.getElementById("house").value;


let rice =
document.getElementById("rice").value;


let status =
document.getElementById("status").value;



if(name==""){

alert("กรุณาใส่ชื่อสมาชิก");

return;

}



members.push({

name:name,

house:house,

rice:rice,

status:status

});



saveData();



document.getElementById("name").value="";

document.getElementById("house").value="";

document.getElementById("rice").value="";


alert("บันทึกสมาชิกเรียบร้อย");


}




function changeStatus(i){


if(members[i].status=="ส่งแล้ว"){

members[i].status="ยังไม่ส่ง";

}else{

members[i].status="ส่งแล้ว";

}


saveData();


}





function editMember(i){


let name = prompt(
"แก้ไขชื่อสมาชิก",
members[i].name
);



if(name){

members[i].name=name;

saveData();

}


}




function deleteMember(i){


if(confirm("ต้องการลบสมาชิกหรือไม่")){


members.splice(i,1);


saveData();


}


}




function saveData(){


localStorage.setItem(

"members",

JSON.stringify(members)

);



showMember();

showSummary();


}




showMember();

showSummary();



</script>



</body>

</html>
