<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
จัดการทะเบียนสมาชิก
</title>


<style>

body{
font-family:Tahoma,sans-serif;
margin:0;
background:#f5f7f2;
}


.header{

background:#2e7d32;
color:white;
padding:25px;
text-align:center;

}


.container{

padding:20px;

}


.card{

background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 3px 10px #ccc;

}


input{

width:100%;
padding:12px;
margin:8px 0;
box-sizing:border-box;

}


button{

padding:10px 15px;
border:0;
border-radius:8px;
background:#2e7d32;
color:white;

}


.edit{

background:#f57c00;

}


.delete{

background:#d32f2f;

}


table{

width:100%;
border-collapse:collapse;

}


th{

background:#66bb6a;
color:white;
padding:10px;

}


td{

padding:10px;
text-align:center;
border-bottom:1px solid #ddd;

}

</style>


</head>


<body>


<div class="header">

<h1>
⚙️ จัดการทะเบียนสมาชิก
</h1>

<p>
กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6
</p>

</div>



<div class="container">


<div class="card">


<h2>
เพิ่มสมาชิก
</h2>


<input id="name" placeholder="ชื่อ-นามสกุล">


<input id="house" placeholder="บ้านเลขที่">


<input id="rice" placeholder="จำนวนข้าว (กก.)">


<button onclick="addMember()">

➕ เพิ่มสมาชิก

</button>


</div>



<div class="card">


<h2>
รายชื่อสมาชิก
</h2>


<table>


<thead>

<tr>

<th>
ชื่อ
</th>

<th>
บ้าน
</th>

<th>
ข้าว
</th>

<th>
จัดการ
</th>

</tr>

</thead>


<tbody id="list">

</tbody>


</table>


</div>


<a href="สมาชิก.html">
👥 ดูทะเบียนสมาชิก
</a>


</div>




<script>


let members =
JSON.parse(localStorage.getItem("members")) || [

{
name:"นายจักรวัตร ประพลรัตนัง",
house:"2",
rice:"12"
}

];



function save(){

localStorage.setItem(
"members",
JSON.stringify(members)
);

}



function show(){


let html="";


members.forEach((m,i)=>{


html += `

<tr>

<td>${m.name}</td>

<td>${m.house}</td>

<td>${m.rice} กก.</td>


<td>

<button class="edit"
onclick="editMember(${i})">
แก้ไข
</button>


<button class="delete"
onclick="deleteMember(${i})">
ลบ
</button>


</td>


</tr>

`;

});


document.getElementById("list").innerHTML=html;


}




function addMember(){


let name =
document.getElementById("name").value;


let house =
document.getElementById("house").value;


let rice =
document.getElementById("rice").value;



if(name==""){

alert("กรุณาใส่ชื่อสมาชิก");

return;

}



members.push({

name:name,
house:house,
rice:rice

});


save();

show();


document.getElementById("name").value="";
document.getElementById("house").value="";
document.getElementById("rice").value="";


}




function editMember(i){


let name =
prompt(
"แก้ไขชื่อสมาชิก",
members[i].name
);


if(name){

members[i].name=name;

save();

show();

}


}




function deleteMember(i){


if(confirm("ต้องการลบสมาชิกหรือไม่")){


members.splice(i,1);

save();

show();


}


}



show();


</script>


</body>

</html>
