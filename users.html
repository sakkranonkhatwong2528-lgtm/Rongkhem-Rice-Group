<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ จัดการผู้ใช้งานระบบ - กลุ่มข้าวสารบ้านร่องเข็ม</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background: #f5f7f2;
            color: #333;
            padding-bottom: 40px;
        }

        /* Header Bar */
        .navbar {
            background: linear-gradient(135deg, #1b5e20, #2e7d32);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .navbar h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .card h2 {
            color: #1b5e20;
            font-size: 1.25rem;
            margin-bottom: 15px;
            border-bottom: 2px solid #e8f5e9;
            padding-bottom: 8px;
        }

        /* Grid Form Layout */
        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus, select:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        input:disabled {
            background-color: #f0f0f0;
            cursor: not-allowed;
            color: #777;
        }

        /* Buttons */
        .btn-group {
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-save { background: #2e7d32; color: white; }
        .btn-save:hover { background: #1b5e20; }
        .btn-cancel { background: #757575; color: white; display: none; }
        .btn-cancel:hover { background: #616161; }

        .btn-edit { background: #f57c00; color: white; padding: 6px 12px; font-size: 13px; margin-right: 4px; }
        .btn-edit:hover { background: #e65100; }
        
        .btn-delete { background: #d32f2f; color: white; padding: 6px 12px; font-size: 13px; }
        .btn-delete:hover { background: #b71c1c; }

        /* Table & Badges */
        .table-responsive { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: #2e7d32;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        tr:hover { background-color: #f9fbf8; }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
        }

        .badge.admin { background: #e8f5e9; color: #2e7d32; }
        .badge.committee { background: #e3f2fd; color: #1565c0; }
        .badge.member, .badge.user { background: #fff3cd; color: #856404; }

        /* Back Link */
        .back-link {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: #2e7d32;
            font-weight: bold;
            padding: 10px 20px;
            background: #e8f5e9;
            border-radius: 8px;
            transition: 0.2s;
        }

        .back-link:hover { background: #c8e6c9; }

        @media (max-width: 600px) {
            .grid-form { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="navbar">
        <h1>⚙️ จัดการผู้ใช้งานระบบ</h1>
        <p>กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6</p>
    </div>

    <div class="container">

        <!-- ฟอร์มเพิ่ม/แก้ไขผู้ใช้งาน -->
        <div class="card">
            <h2 id="formTitle">➕ เพิ่มผู้ใช้งานใหม่</h2>
            <div class="grid-form">
                <div class="form-group">
                    <label for="userName">ชื่อผู้ใช้ (Username) *</label>
                    <input id="userName" placeholder="เช่น admin, committee01">
                </div>
                <div class="form-group">
                    <label for="userPassword">รหัสผ่าน (Password) *</label>
                    <input id="userPassword" type="password" placeholder="รหัสผ่านเข้าระบบ">
                </div>
                <div class="form-group">
                    <label for="fullName">ชื่อ - นามสกุล *</label>
                    <input id="fullName" placeholder="เช่น นายสมชาย ใจดี">
                </div>
                <div class="form-group">
                    <label for="role">ระดับสิทธิ์การใช้งาน</label>
                    <select id="role">
                        <option value="admin">ผู้ดูแลระบบ (Admin)</option>
                        <option value="committee">คณะกรรมการ (Committee)</option>
                        <option value="member">สมาชิกทั่วไป (Member)</option>
                    </select>
                </div>
            </div>

            <div class="btn-group">
                <button id="btnSave" class="btn-save" onclick="saveUser()">💾 บันทึกข้อมูล</button>
                <button id="btnCancel" class="btn-cancel" onclick="cancelEdit()">❌ ยกเลิกการแก้ไข</button>
            </div>
        </div>

        <!-- รายชื่อผู้ใช้ และระบบค้นหา -->
        <div class="card">
            <h2>📋 รายชื่อผู้ใช้งานในระบบ</h2>

            <!-- Search & Filter -->
            <div class="grid-form" style="margin-bottom: 15px;">
                <input id="searchInput" placeholder="🔍 ค้นหาตามชื่อผู้ใช้ หรือ ชื่อ-สกุล..." onkeyup="filterUsers()">
                <select id="roleFilter" onchange="filterUsers()">
                    <option value="all">-- แสดงสิทธิ์ทั้งหมด --</option>
                    <option value="admin">ผู้ดูแลระบบ</option>
                    <option value="committee">คณะกรรมการ</option>
                    <option value="member">สมาชิกทั่วไป</option>
                </select>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ชื่อผู้ใช้ (Username)</th>
                            <th>ชื่อ - นามสกุล</th>
                            <th>สิทธิ์การใช้งาน</th>
                            <th style="width: 160px; text-align: center;">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="userTable">
                        <!-- รายชื่อจะถูกดึงมาใส่ด้วย users.js -->
                    </tbody>
                </table>
            </div>
        </div>

        <a href="dashboard.html" class="back-link">⬅ กลับหน้าหลัก Dashboard</a>

    </div>

    <!-- สคริปต์ตรวจสิทธิ์ ล็อกอิน และจัดการข้อมูล -->
    <script src="js/auth.js"></script>
    <script src="js/users.js"></script>

    <!-- ป้องกันไม่ให้คนที่ไม่ใช่ Admin แอบเข้ามาใช้หน้านี้ -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof isAdmin === "function" && !isAdmin()) {
                alert("⛔ เฉพาะผู้ดูแลระบบ (Admin) เท่านั้นที่สามารถเข้าถึงหน้านี้ได้");
                window.location.href = "dashboard.html";
            }
        });
    </script>
</body>
</html>
