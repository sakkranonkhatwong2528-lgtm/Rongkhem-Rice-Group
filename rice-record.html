<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บันทึกรับข้าว — กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="members.css">
<link rel="stylesheet" href="rice.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="fa-solid fa-wheat-awn"></i></div>
      <div class="logo-text"><strong>กลุ่มข้าวสาร</strong><span>บ้านร่องเข็ม หมู่ที่ 6</span></div>
    </div>
    <nav class="sidebar-menu">
      <a href="index.html" class="menu-item"><i class="fa-solid fa-house"></i><span>หน้าหลัก</span></a>
      <a href="current-funeral.html" class="menu-item"><i class="fa-solid fa-hand-holding-heart"></i><span>งานศพปัจจุบัน</span></a>
      <a href="members.html" class="menu-item"><i class="fa-solid fa-users"></i><span>สมาชิก</span></a>
      <a href="rice-record.html" class="menu-item active"><i class="fa-solid fa-bowl-rice"></i><span>บันทึกรับข้าว</span></a>
      <a href="history.html" class="menu-item"><i class="fa-solid fa-calendar-days"></i><span>งานศพย้อนหลัง</span></a>
      <a href="announcements.html" class="menu-item"><i class="fa-solid fa-bullhorn"></i><span>ประกาศ</span></a>
      <a href="reports.html" class="menu-item"><i class="fa-solid fa-chart-column"></i><span>รายงาน</span></a>
      <a href="settings.html" class="menu-item"><i class="fa-solid fa-gear"></i><span>ตั้งค่า</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-box">
        <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
        <div class="user-info"></div>
      </div>
      <button class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="logo-icon small"><i class="fa-solid fa-bowl-rice"></i></div>
        <div><h1>บันทึกการรับข้าวสาร</h1><p>ติ๊กรายชื่อครัวเรือนที่นำข้าวสารมาร่วม</p></div>
      </div>
      <div class="topbar-right">
        <div class="clock-box"><i class="fa-regular fa-clock"></i>
          <div><div id="liveClock" class="clock-time">00:00:00</div>
               <div id="liveDate" class="clock-date">-</div></div></div>
      </div>
    </header>

    <section class="card">
      <div class="toolbar">
        <div class="form-group" style="flex:1;min-width:260px;margin:0">
          <label>เลือกงานศพ</label>
          <select id="funeralSelect"></select>
        </div>
        <div class="live-stat">
          <div><span id="rGot">0</span><small>รับแล้ว</small></div>
          <div><span id="rPending">0</span><small>ค้างส่ง</small></div>
          <div><span id="rPct">0%</span><small>ความคืบหน้า</small></div>
        </div>
      </div>
      <div class="progress-bar big"><div class="progress-fill" id="rBar" style="width:0%"></div></div>
    </section>

    <section class="card">
      <div class="toolbar">
        <div class="search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="searchInput" placeholder="ค้นหาบ้านเลขที่ / ชื่อ">
        </div>
        <select id="filterStatus">
          <option value="all">ทั้งหมด</option>
          <option value="got">รับแล้ว</option>
          <option value="pending">ค้างส่ง</option>
        </select>
        <div class="toolbar-actions admin-only">
          <button class="action-btn abtn-green" id="btnCheckAll"><i class="fa-solid fa-check-double"></i> ติ๊กทั้งหมด</button>
          <button class="action-btn abtn-orange" id="btnClearAll"><i class="fa-solid fa-eraser"></i> ล้างทั้งหมด</button>
          <button class="action-btn abtn-purple" id="btnExport"><i class="fa-solid fa-file-export"></i> ส่งออก CSV</button>
        </div>
      </div>
      <div class="rice-grid" id="riceGrid"></div>
      <div class="table-foot"><span id="countText">แสดง 0 รายการ</span></div>
    </section>

    <footer class="footer">© 2025 กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</footer>
  </main>
</div>
<div id="toastContainer" class="toast-container"></div>
<script type="module" src="rice-record.js"></script>
</body>
</html>
