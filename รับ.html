<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
รับ-จ่ายข้าวสาร
</title>


<style>

body{
margin:0;
font-family:Tahoma,sans-serif;
background:#f5f7f2;
}


.header{

background:linear-gradient(
135deg,#2e7d32,#66bb6a
);

color:white;
padding:30px;
text-align:center;

}


.container{

padding:20px;

}


.card{

background:white;
padding:20px;
margin-bottom:20px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;

}


input,select{

width:100%;
padding:12px;
margin:8px 0;
box-sizing:border-box;
border-radius:8px;
border:1px solid #ccc;

}



button{

background:#2e7d32;
color:white;
border:0;
padding:12px 20px;
border-radius:8px;
cursor:pointer;

}


.delete{

background:#d32f2f;

}



table{

width:100%;
border-collapse:collapse;

}


th{

background:#2e7d32;
color:white;
padding:10px;

}


td{

padding:10px;
border-bottom:1px solid #ddd;
text-align:center;

}


.balance{

background:#e8f5e9;
padding:20px;
border-radius:15px;
text-align:center;

}


.number{

font-size:35px;
font-weight:bold;
color:#2e7d32;

}


</style>


</head>



<body>


<div class="header">


<h1>
📦 รับ-จ่ายข้าวสาร
</h1>


<p>
กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6
</p>


</div>




<div class="container">



<div class="card">


<div class="balance">

<h2>
🌾 ข้าวคงเหลือ
</h2>

<div class="number" id="stock">

0

</div>

กิโลกรัม


</div>


</div>





<div class="card">


<h2>
➕ เพิ่มรายการรับ-จ่าย
</h2>



<input type="date" id="date">



<input id="detail"
placeholder="รายการ เช่น รับข้าวจากสมาชิก / ช่วยงานศพ">



<select id="type">


<option value="รับเข้า">

📥 รับเข้าคลัง

</option>


<option value="จ่ายออก">

📤 จ่ายออก

</option>


</select>



<input id="amount"
type="number"
placeholder="จำนวนกิโลกรัม">



<button onclick="addRice()">

บันทึก

</button>



</div>





<div class="card">


<h2>
📋 รายการย้อนหลัง
</h2>


<table>


<thead>

<tr>

<th>
วันที่
</th>

<th>
รายการ
</th>

<th>
ประเภท
</th>

<th>
จำนวน
</th>

<th>
จัดการ
</th>

</tr>

</thead>


<tbody id="list">

</tbody>


</table>



</div>




<a href="index.html">

⬅ กลับหน้าหลัก

</a>



</div>





<script>



let riceData = JSON.parse(

localStorage.getItem("riceData")

) || [];





function show(){


let html="";

let balance=0;



riceData.forEach((r,i)=>{


if(r.type=="รับเข้า"){

balance += Number(r.amount);

}else{

balance -= Number(r.amount);

}




html +=`

<tr>


<td>

${r.date}

</td>


<td>

${r.detail}

</td>


<td>

${r.type}

</td>


<td>

${r.amount} กก.

</td>



<td>


<button class="delete"

onclick="del(${i})">

ลบ

</button>


</td>


</tr>

`;


});



document.getElementById("stock").innerHTML=

balance;



document.getElementById("list").innerHTML=

html;



}





function addRice(){



let data={


date:
document.getElementById("date").value,


detail:
document.getElementById("detail").value,


type:
document.getElementById("type").value,


amount:
document.getElementById("amount").value


};



if(data.detail==""
||data.amount==""){


alert("กรุณากรอกข้อมูล");

return;

}




riceData.push(data);



localStorage.setItem(

"riceData",

JSON.stringify(riceData)

);



document.getElementById("detail").value="";

document.getElementById("amount").value="";



show();



alert("บันทึกรายการแล้ว");


}





function del(i){


if(confirm("ต้องการลบรายการหรือไม่")){


riceData.splice(i,1);



localStorage.setItem(

"riceData",

JSON.stringify(riceData)

);



show();


}


}





show();



</script>


</body>

</html>
