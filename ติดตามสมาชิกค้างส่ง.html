<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ติดตามสมาชิกค้างส่ง กลุ่มข้าวสารบ้านร่องเข็ม</title>

<style>
body{
font-family:Tahoma;
background:#f1f8e9;
padding:15px;
}
header{
background:#2e7d32;
color:white;
padding:20px;
border-radius:15px;
text-align:center;
}
.card{
background:white;
padding:15px;
margin-top:15px;
border-radius:15px;
box-shadow:0 2px 8px #bbb;
}
.member{
padding:12px;
margin:10px 0;
background:#fafafa;
border-radius:10px;
border-left:5px solid orange;
}
.cut{
border-left-color:red;
}
input,textarea,button{
width:100%;
padding:10px;
margin-top:8px;
border-radius:8px;
}
button{
background:#2e7d32;
color:white;
border:0;
}
</style>

</head>

<body>

<header>
<h2>🌾 ระบบติดตามสมาชิกค้างส่ง</h2>
<h3>กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</h3>
<p>สมาชิกทั้งหมด 192 ครัวเรือน</p>
</header>


<div class="card">

<h2>🔎 ค้นหาสมาชิก</h2>

<input id="search"
placeholder="ค้นหาชื่อ หรือ บ้านเลขที่"
onkeyup="show()">

</div>


<div class="card">

<h2>⚠️ รายชื่อค้างส่ง</h2>

<div id="list"></div>

</div>


<div class="card">

<h2>🔴 พิจารณาตัดสิทธิ์</h2>

<div id="cut"></div>

</div>


<div class="card">

<h2>📋 ประวัติการติดตาม</h2>

<div id="history"></div>

</div>



<script>

let members=[

{
name:"นายวุฒิภัทร เตชะวงค์",
house:"91/1",
debt:1,
funeral:"นายเกษมสุข ใฝ่ใจ",
status:"ติดตาม"
},

{
name:"นายต่วน ทาทอง",
house:"114",
debt:1,
funeral:"นายเกษมสุข ใฝ่ใจ",
status:"ติดตาม"
},

{
name:"นายสมศีล งามจิต",
house:"135",
debt:1,
funeral:"นายบูรณพิภพ ผัดดี",
status:"ติดตาม"
},

{
name:"น.ส.ยุพา ใจดี",
house:"160",
debt:1,
funeral:"นายเกษมสุข ใฝ่ใจ",
status:"ติดตาม"
},


{
name:"นายประหยัด ปิงเมือง",
house:"120",
debt:2,
funeral:"นายเกษมสุข ใฝ่ใจ",
status:"ตัดสิทธิ์"
},

{
name:"นายตื่น มิ่งขวัญ",
house:"176",
debt:2,
funeral:"นายเกษมสุข ใฝ่ใจ",
status:"ตัดสิทธิ์"
},

{
name:"น.ส.สำรอง มหาวรรณศรี",
house:"200",
debt:2,
funeral:"นายเกษมสุข ใฝ่ใจ",
status:"ตัดสิทธิ์"
},

{
name:"นายบรรพต อินวงค์",
house:"212",
debt:2,
funeral:"นายเกษมสุข ใฝ่ใจ",
status:"ตัดสิทธิ์"
},

{
name:"นางลวงทิพย์ ใฝ่จิต",
house:"315",
debt:2,
funeral:"นายเกษมสุข ใฝ่ใจ",
status:"ตัดสิทธิ์"
},

{
name:"นายประทุม ดาวกระจาย",
house:"328",
debt:2,
funeral:"นายเกษมสุข ใฝ่ใจ",
status:"ตัดสิทธิ์"
}

];


function show(){

let key=document.getElementById("search").value;

let normal="";
let cut="";

members
.filter(x=>x.name.includes(key)||x.house.includes(key))
.forEach(x=>{


let html=`

<div class="member">

<b>${x.name}</b><br>
🏠 บ้านเลขที่ ${x.house}<br>
📦 ค้างส่ง ${x.debt} ครั้ง<br>
⚰️ ${x.funeral}<br>
สถานะ : ${x.status}

<br>

<button onclick="follow('${x.name}')">
📞 บันทึกติดตาม
</button>

</div>

`;

if(x.status=="ตัดสิทธิ์")
cut+=html;
else
normal+=html;


});


document.getElementById("list").innerHTML=normal;
document.getElementById("cut").innerHTML=cut;

loadHistory();

}



function follow(name){

let note=prompt("บันทึกผลการติดตาม");

let data=JSON.parse(localStorage.follow||"[]");

data.push({

name:name,
date:new Date().toLocaleDateString("th-TH"),
note:note

});


localStorage.follow=JSON.stringify(data);

loadHistory();

}



function loadHistory(){

let data=JSON.parse(localStorage.follow||"[]");

history.innerHTML="";

data.forEach((x,i)=>{

history.innerHTML+=`

<div class="member">

${i+1}. ${x.name}<br>
วันที่ ${x.date}<br>
${x.note}

</div>

`;

});

}


show();

</script>

</body>
</html>
