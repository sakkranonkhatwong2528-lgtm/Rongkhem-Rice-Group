<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>คลังข้าวสาร</title>

<style>

body{
margin:0;
font-family:Tahoma,sans-serif;
background:#f5f7f2;
}

.header{

background:linear-gradient(135deg,#2e7d32,#81c784);
color:white;
padding:30px;
text-align:center;

}

.container{
padding:20px;
}

.card{

background:white;
padding:20px;
margin-bottom:20px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;

}


.dashboard{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;

}


.box{

background:#e8f5e9;
padding:20px;
border-radius:15px;
text-align:center;

}


.number{

font-size:32px;
font-weight:bold;
color:#2e7d32;

}


table{

width:100%;
border-collapse:collapse;

}


th{

background:#2e7d32;
color:white;
padding:10px;

}


td{

padding:10px;
border-bottom:1px solid #ddd;
text-align:center;

}

</style>

</head>


<body>


<div class="header">

<h1>
🌾 คลังข้าวสาร
</h1>

<p>
กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6
</p>

</div>



<div class="container">



<div class="card">


<h2>
📊 สถานะคลังข้าว
</h2>


<div class="dashboard">


<div class="box">

📥 รับเข้าทั้งหมด

<div class="number" id="receive">

0

</div>

กก.

</div>



<div class="box">

📤 จ่ายออกทั้งหมด

<div class="number" id="pay">

0

</div>

กก.

</div>



<div class="box">

🌾 คงเหลือ

<div class="number" id="stock">

0

</div>

กก.

</div>



</div>


</div>





<div class="card">


<h2>
📋 รายการเคลื่อนไหวคลัง
</h2>



<table>

<thead>

<tr>

<th>วันที่</th>

<th>รายการ</th>

<th>ประเภท</th>

<th>จำนวน</th>

</tr>

</thead>


<tbody id="list">

</tbody>


</table>



</div>




<a href="index.html">

⬅ กลับหน้าหลัก

</a>



</div>





<script>


let riceData =
JSON.parse(
localStorage.getItem("riceData")
) || [];



let receive=0;

let pay=0;


let html="";



riceData.forEach(r=>{


if(r.type=="รับเข้า"){

receive += Number(r.amount);

}else{

pay += Number(r.amount);

}



html +=`

<tr>

<td>
${r.date}
</td>

<td>
${r.detail}
</td>

<td>
${r.type}
</td>

<td>
${r.amount} กก.
</td>

</tr>

`;

});




document.getElementById("receive").innerHTML=
receive;



document.getElementById("pay").innerHTML=
pay;



document.getElementById("stock").innerHTML=
receive-pay;



document.getElementById("list").innerHTML=
html;



</script>



</body>

</html>
