<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งเสียชีวิต / งานศพ</title>

    <style>
        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background: #f5f7f2;
        }

        .header {
            background: linear-gradient(135deg, #424242, #757575);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 10px #ccc;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: #424242;
            color: white;
            border: 0;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .delete {
            background: #d32f2f;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #424242;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        .status {
            background: #1565c0;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>⚰️ แจ้งเสียชีวิต / งานศพ</h1>
        <p>กลุ่มข้าวสารบ้านร่องเข็ม หมู่ที่ 6</p>
    </div>

    <div class="container">

        <div class="card">
            <h2>➕ เพิ่มข้อมูลผู้เสียชีวิต</h2>

            <input id="name" placeholder="ชื่อ - นามสกุล">
            <input id="house" placeholder="บ้านเลขที่">

            <label>วันที่เสียชีวิต</label>
            <input type="date" id="death">

            <label>วันที่ฌาปนกิจ</label>
            <input type="date" id="cremate">

            <select id="status">
                <option value="ยังไม่ดำเนินการ">ยังไม่ดำเนินการ</option>
                <option value="นำข้าวสารช่วยเหลือแล้ว">นำข้าวสารช่วยเหลือแล้ว</option>
            </select>

            <button onclick="addFuneral()">บันทึกข้อมูล</button>
        </div>

        <div class="card">
            <h2>📋 รายการแจ้งเสียชีวิต</h2>

            <table>
                <thead>
                    <tr>
                        <th>ลำดับ</th>
                        <th>ชื่อ</th>
                        <th>บ้านเลขที่</th>
                        <th>วันที่เสียชีวิต</th>
                        <th>วันที่ฌาปนกิจ</th>
                        <th>สถานะ</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>

        <a href="index.html">⬅ กลับหน้าหลัก</a>

    </div>

    <script>
        let funerals = JSON.parse(localStorage.getItem("funerals")) || [];

        function show() {
            let html = "";
            funerals.forEach((f, i) => {
                html += `
                <tr>
                    <td>${i + 1}</td>
                    <td>${f.name}</td>
                    <td>${f.house}</td>
                    <td>${f.death}</td>
                    <td>${f.cremate}</td>
                    <td><button class="status">${f.status}</button></td>
                    <td>
                        <button class="delete" onclick="deleteFuneral(${i})">ลบ</button>
                    </td>
                </tr>`;
            });
            document.getElementById("list").innerHTML = html;
        }

        function addFuneral() {
            let data = {
                name: document.getElementById("name").value.trim(),
                house: document.getElementById("house").value,
                death: document.getElementById("death").value,
                cremate: document.getElementById("cremate").value,
                status: document.getElementById("status").value
            };

            if (data.name == "") {
                alert("กรุณาใส่ชื่อผู้เสียชีวิต");
                return;
            }

            funerals.push(data);

            // 1. บันทึกรายการทั้งหมดลงระบบ
            localStorage.setItem("funerals", JSON.stringify(funerals));

            // 2. ส่งชื่อผู้เสียชีวิตล่าสุดไปตั้งค่าไว้สำหรับประกาศข่าวไว้อาลัย (ส่งไปหน้า news.html)
            localStorage.setItem("latest_deceased_name", data.name);

            alert("บันทึกข้อมูลเรียบร้อยแล้ว ระบบได้อัปเดตชื่อแสดงความไว้อาลัยในหน้าประกาศแล้ว");

            // ล้างค่าในช่องกรอก
            document.getElementById("name").value = "";
            document.getElementById("house").value = "";
            document.getElementById("death").value = "";
            document.getElementById("cremate").value = "";

            show();
        }

        function deleteFuneral(i) {
            if (confirm("ต้องการลบข้อมูลหรือไม่")) {
                funerals.splice(i, 1);

                // บันทึกรายการใหม่หลังลบ
                localStorage.setItem("funerals", JSON.stringify(funerals));

                // ปรับเปลี่ยนชื่อผู้เสียชีวิตล่าสุดตามรายการที่เหลืออยู่
                if (funerals.length > 0) {
                    localStorage.setItem("latest_deceased_name", funerals[funerals.length - 1].name);
                } else {
                    // หากไม่มีรายการเหลือเลย ให้ล้างชื่อออก เพื่อเปลี่ยนเป็นคำประกาศทั่วไป
                    localStorage.removeItem("latest_deceased_name");
                }

                show();
            }
        }

        show();
    </script>

</body>

</html>
