<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<title>⚙️ ตั้งค่าระบบ</title>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Sarabun',sans-serif;
}

body{
background:#eef2f5;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.header{

background:linear-gradient(135deg,#0f5132,#198754);

color:#fff;

padding:25px;

border-radius:20px;

margin-bottom:20px;

}

.card{

background:#fff;

padding:25px;

border-radius:15px;

box-shadow:0 8px 20px rgba(0,0,0,.08);

margin-bottom:20px;

}

label{

display:block;

margin-top:15px;

margin-bottom:5px;

font-weight:bold;

}

input{

width:100%;

padding:12px;

border:1px solid #ddd;

border-radius:10px;

}

button{

padding:14px 22px;

border:none;

border-radius:10px;

cursor:pointer;

margin-top:20px;

font-weight:bold;

}

.btn-save{

background:#198754;

color:#fff;

}

.btn-reset{

background:#dc3545;

color:#fff;

}

</style>

</head>

<body>

<div class="container">

⚙️ ตั้งค่าระบบ

</h1>

<p>

ระบบกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6

</p>

</div>

<div class="card">

<label>

ชื่อระบบ

</label>

<input
id="systemName">

<label>

ชื่อหมู่บ้าน

</label>

<input
id="villageName">

<label>

ตำบล

</label>

<input
id="subdistrict">

<label>

อำเภอ

</label>

<input
id="district">

<label>

จังหวัด

</label>

<input
id="province">

</label>

<input
id="developer">

<button
class="btn-save"
onclick="saveSettings()">

💾 บันทึก

</button>

<button
class="btn-reset"
onclick="defaultSettings()">

รีเซ็ต

</button>
  </div>

<a href="index.html"
style="
display:block;
text-align:center;
margin-top:25px;
text-decoration:none;

color:#666;
">

</div>

<script src="js/app.js"></script>
