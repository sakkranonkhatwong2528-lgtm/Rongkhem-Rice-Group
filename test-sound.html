<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔊 ทดสอบระบบเสียงประชาสัมพันธ์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-100 p-6 flex flex-col items-center justify-center min-h-screen">

    <div class="bg-white p-6 rounded-3xl shadow-xl max-w-md w-full border border-slate-200">
        <div class="text-center mb-6">
            <span class="text-5xl">📢</span>
            <h2 class="text-xl font-bold text-slate-800 mt-2">ทดสอบเสียงระบบประชาสัมพันธ์</h2>
            <p class="text-xs text-slate-500">กดปุ่มเพื่อทดสอบฟังเสียงตอบรับภาษาไทย</p>
        </div>

        <div class="space-y-3">
            <button onclick="speakDemo('บันทึกรับข้าวสาร จากคุณ นายจักร์กวัส ประพลรัตนัง เรียบร้อยแล้วค่ะ')" 
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-2xl shadow transition flex items-center justify-between">
                <span>🌾 1. เสียงยืนยันการรับข้าวสาร</span>
                <span class="text-lg">🔊</span>
            </button>

            <button onclick="speakDemo('ทีมผู้นำหมู่บ้านร่องเข็ม หมู่ 6 ขอแสดงความเสียใจอย่างสุดซึ้งต่อครอบครัวผู้วายชนม์ ขอวิญญาณของท่านจงไปสู่สุขคติ')" 
                    class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-4 rounded-2xl shadow transition flex items-center justify-between">
                <span>🕊️ 2. เสียงกล่าวไว้อาลัยงานศพ</span>
                <span class="text-lg">🔊</span>
            </button>

            <button onclick="speakDemo('แจ้งเตือน ขณะนี้มีสมาชิกค้างส่งข้าวสาร จำนวน 10 ครัวเรือน กรุณานำส่งที่คณะกรรมการด้วยค่ะ')" 
                    class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-2xl shadow transition flex items-center justify-between">
                <span>⚠️ 3. เสียงแจ้งเตือนสมาชิกค้างส่ง</span>
                <span class="text-lg">🔊</span>
            </button>
        </div>

        <div id="statusText" class="mt-4 p-3 bg-slate-50 rounded-xl text-center text-xs text-slate-500 font-medium border border-slate-100">
            กดเลือกปุ่มด้านบนเพื่อทดลองฟังเสียง
        </div>
    </div>

    <script>
        function speakDemo(text) {
            if ('speechSynthesis' in window) {
                // ยกเลิกเสียงที่กำลังพูดอยู่ก่อนหน้า
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH'; // กำหนดภาษาไทย
                utterance.rate = 0.95;    // ความเร็วการพูด (0.95 อ่านชัดเป็นธรรมชาติ)
                utterance.pitch = 1.0;     //ระดับเสียง

                document.getElementById('statusText').innerText = '🔊 กำลังเล่นเสียง: "' + text + '"';
                document.getElementById('statusText').className = 'mt-4 p-3 bg-green-50 text-green-700 rounded-xl text-center text-xs font-medium border border-green-200';

                utterance.onend = function() {
                    document.getElementById('statusText').innerText = '✅ เล่นเสียงเรียบร้อยแล้ว';
                    document.getElementById('statusText').className = 'mt-4 p-3 bg-slate-50 text-slate-500 rounded-xl text-center text-xs font-medium border border-slate-100';
                };

                window.speechSynthesis.speak(utterance);
            } else {
                alert('อุปกรณ์ของคุณไม่รองรับระบบสังเคราะห์เสียง Speech Synthesis');
            }
        }
    </script>

</body>
</html>
