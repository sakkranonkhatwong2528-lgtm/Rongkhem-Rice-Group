<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>💾 สำรองข้อมูล</title>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Sarabun',sans-serif;
}

body{
background:#eef2f5;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.header{

background:linear-gradient(135deg,#0f5132,#198754);

color:#fff;

padding:25px;

border-radius:20px;

margin-bottom:20px;

}

.card{

background:#fff;

padding:25px;

border-radius:18px;

box-shadow:0 8px 20px rgba(0,0,0,.08);

margin-bottom:20px;

text-align:center;

}

button{

padding:15px 25px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

margin:10px;

font-size:16px;

}

.btn-green{

background:#198754;

color:white;

}

.btn-blue{

background:#0d6efd;

color:white;

}

.btn-red{

background:#dc3545;

color:white;

}

input[type=file]{

margin-top:20px;

}

.info{

margin-top:20px;

padding:20px;

background:#f8f9fa;

border-radius:12px;

text-align:left;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>

💾 สำรองข้อมูลระบบ

</h1>

<p>

ระบบกลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6

</p>

</div>

<div class="card">

<h2>

สำรองข้อมูล

</h2>

<br>

<button

class="btn-green"

onclick="backupData()">

⬇ ดาวน์โหลด Backup

</button>

<br>

<input

type="file"

id="restoreFile">

<br>

<button

class="btn-blue"

onclick="restoreData()">

⬆ นำเข้าข้อมูล

</button>

<button

class="btn-red"

onclick="resetData()">

🗑 ล้างข้อมูลทั้งหมด

</button>

</div>

<div class="card">

<h2>

ข้อมูลที่สำรอง

</h2>

<div class="info">

✅ สมาชิก

<br>

✅ งานศพ

<br>

✅ รับข้าวสาร

<br>

✅ คลังข้าวสาร

<br>

✅ กิจกรรมล่าสุด

<br>

✅ การตั้งค่าระบบ

</div>

</div>
</div>

<a href="index.html"
style="
display:block;
text-align:center;
margin-top:25px;
text-decoration:none;
font-weight:bold;
color:#666;
">

🏠 กลับหน้าหลัก

</a>

</div>

<script src="js/app.js"></script>
<script src="js/backup.js"></script>

</body>
</html>
