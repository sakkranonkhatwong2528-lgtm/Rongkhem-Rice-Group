<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สำรองข้อมูล - กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</title>
  <style>
    body { font-family: 'Sarabun', sans-serif; background: #f4f7f6; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 600px; margin: auto; }
    .header { background: #2c3e50; color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
    
    .card { background: white; padding: 25px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
    .card h3 { margin-top: 0; color: #2c3e50; }
    .card p { color: #666; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }

    .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-bottom: 10px; }
    .btn-backup { background: #27ae60; color: white; }
    .btn-backup:hover { background: #219150; }
    .btn-restore { background: #2980b9; color: white; }
    .btn-restore:hover { background: #1f6391; }

    .btn-back { display: block; text-align: center; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 style="margin: 0;">💾 สำรองและฟื้นฟูข้อมูล</h2>
    <small>กลุ่มข้าวสาร บ้านร่องเข็ม หมู่ที่ 6</small>
  </div>

  <!-- การ์ดสำรองข้อมูล -->
  <div class="card">
    <h3>📥 สำรองข้อมูลระบบ (Export Data)</h3>
    <p>ดาวน์โหลดข้อมูลสมาชิก ประวัติงานศพ และการค้างส่งเก็บไว้ในเครื่องเพื่อความปลอดภัย</p>
    <button class="btn btn-backup" onclick="exportData()">💾 ดาวน์โหลดไฟล์สำรองข้อมูล (JSON)</button>
  </div>

  <!-- การ์ดเรียกคืนข้อมูล -->
  <div class="card">
    <h3>📤 นำเข้าข้อมูลสำรอง (Restore Data)</h3>
    <p>เลือกไฟล์สำรองข้อมูล (.json) เพื่อดึงข้อมูลเดิมกลับเข้าสู่ระบบ</p>
    <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
    <button class="btn btn-restore" onclick="document.getElementById('importFile').click()">📂 เลือกไฟล์เพื่อนำเข้าข้อมูล</button>
  </div>

  <a href="index.html" class="btn-back">← กลับหน้าหลัก</a>
</div>

<script>
function exportData() {
  const dummyData = {
    totalMembers: 192,
    paidMembers: 182,
    unpaidMembers: 10,
    exportDate: new Date().toLocaleDateString('th-TH')
  };

  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dummyData, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `backup_rice_group_${new Date().toISOString().slice(0,10)}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();

  alert("ดาวน์โหลดไฟล์สำรองข้อมูลเรียบร้อยแล้ว!");
}

function importData(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        alert("นำเข้าข้อมูลสำเร็จ! ระบบทำการอัปเดตข้อมูลเรียบร้อยแล้ว");
      } catch (err) {
        alert("รูปแบบไฟล์ไม่ถูกต้อง กรุณาเลือกไฟล์ .json ของระบบเท่านั้น");
      }
    };
    reader.readAsText(file);
  }
}
</script>

</body>
</html>
